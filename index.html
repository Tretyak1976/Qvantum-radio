<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>3D Symbiosis - Infinite Evolution (Live Radio)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }

        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(10, 10, 15, 0.75); padding: 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px);
            width: 320px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        #ui-layer.idle { opacity: 0; transform: translateX(-20px); pointer-events: none; }
        #ui-layer:hover { opacity: 1.0; transform: translateX(0); }

        .control-group { margin-bottom: 20px; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #3b82f6; text-transform: uppercase; letter-spacing: 2px; }
        label { display: block; font-size: 0.7rem; margin-bottom: 8px; color: #aaa; text-transform: uppercase; }

        button {
            width: 100%; background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6;
            color: #3b82f6; padding: 12px; border-radius: 10px; box-sizing: border-box;
            outline: none; cursor: pointer; transition: all 0.3s; font-weight: bold;
        }
        button:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }

        #playlist { margin-top: 15px; max-height: 180px; overflow-y: auto; font-size: 0.85rem; }
        .track-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: 0.2s; }
        .track-item:hover { background: rgba(255,255,255,0.08); }
        .track-item.active { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 2px; }

        #status { font-size: 0.8rem; color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h2>3D Symbiosis</h2>
        <div class="control-group">
            <button id="connectBtn">CONNECT TO SERVER</button>
            <div id="status">Ready</div>
        </div>
        <div class="control-group">
            <label>Channels / Tracks</label>
            <div id="playlist"></div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxBgeGkURQSo9Ju4Bq3gDU2HZh0KH5GC2Ts_UfJ7yV5bHVLSWrxYGvIafDX6qG7Tmg/exec";
        const PROXIED_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(APPS_SCRIPT_URL);

        let playlist = [];
        let currentTrackIndex = 0;
        let audioContext, analyser, source, dataArray;
        const audio = document.getElementById('audioPlayer');

        document.getElementById('connectBtn').onclick = () => {
            initAudio();
            fetchPlaylist();
        };

        async function fetchPlaylist() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Loading tracks from Drive...";
            try {
                const response = await fetch(PROXIED_URL);
                const data = await response.json();

                if (data.error) {
                    statusEl.innerText = "Error: " + data.error;
                    return;
                }

                playlist = data;
                if (playlist.length > 0) {
                    statusEl.innerText = `Loaded ${playlist.length} tracks`;
                    updatePlaylistUI();
                } else {
                    statusEl.innerText = "No tracks found in folder";
                }
            } catch (err) {
                console.error("Ошибка загрузки плейлиста:", err);
                statusEl.innerText = "Failed to load tracks";
            }
        }

        function updatePlaylistUI() {
            const playlistDiv = document.getElementById('playlist');
            playlistDiv.innerHTML = '';
            playlist.forEach((track, index) => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track-item';
                trackEl.innerText = `${track.name} [${track.genre}]`;
                trackEl.onclick = () => {
                    initAudio();
                    playTrack(index);
                };
                playlistDiv.appendChild(trackEl);
            });
            updateActiveTrackUI();
        }

        function updateActiveTrackUI() {
            const items = document.querySelectorAll('.track-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === currentTrackIndex);
            });
        }

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.85;
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
        }

        function playTrack(index) {
            if (!playlist[index]) return;
            currentTrackIndex = index;
            updateActiveTrackUI();

            audio.src = playlist[index].url;
            audio.play().catch(e => console.warn("Audio autoplay blocked:", e));
        }

        audio.onended = () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(currentTrackIndex);
        };

        // 3D Scene Initialization
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Particle sphere visualizer setup
        const gridDim = 50;
        const particleCount = gridDim * gridDim;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const radius = 12;
        let pIdx = 0;
        for (let i = 0; i < gridDim; i++) {
            const u = (i / (gridDim - 1)) * Math.PI * 2;
            for (let j = 0; j < gridDim; j++) {
                const v = (j / (gridDim - 1)) * Math.PI;
                positions[pIdx * 3] = radius * Math.sin(v) * Math.cos(u);
                positions[pIdx * 3 + 1] = radius * Math.sin(v) * Math.sin(u);
                positions[pIdx * 3 + 2] = radius * Math.cos(v);

                colors[pIdx * 3] = 0.2;
                colors[pIdx * 3 + 1] = 0.5;
                colors[pIdx * 3 + 2] = 1.0;
                pIdx++;
            }
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.35,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const quantumPoints = new THREE.Points(geometry, material);
        scene.add(quantumPoints);

        // Interaction
        let isDragging = false;
        let prevMousePos = { x: 0, y: 0 };
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - prevMousePos.x;
            const deltaY = e.clientY - prevMousePos.y;
            quantumPoints.rotation.y += deltaX * 0.005;
            quantumPoints.rotation.x += deltaY * 0.005;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        let angle = 0;
        function animate() {
            requestAnimationFrame(animate);

            let audioScale = 0;
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < 64; i++) sum += dataArray[i];
                audioScale = (sum / 64) / 255.0;
            }

            angle += 0.005;
            quantumPoints.rotation.y += 0.002;

            const posAttr = quantumPoints.geometry.attributes.position;
            const colAttr = quantumPoints.geometry.attributes.color;

            let idx = 0;
            for (let i = 0; i < gridDim; i++) {
                const u = (i / (gridDim - 1)) * Math.PI * 2;
                for (let j = 0; j < gridDim; j++) {
                    const v = (j / (gridDim - 1)) * Math.PI;
                    const deform = 1.0 + Math.sin(u * 4 + angle) * Math.cos(v * 4 + angle) * (0.1 + audioScale * 0.4);
                    const currentR = radius * deform;

                    posAttr.array[idx * 3] = currentR * Math.sin(v) * Math.cos(u);
                    posAttr.array[idx * 3 + 1] = currentR * Math.sin(v) * Math.sin(u);
                    posAttr.array[idx * 3 + 2] = currentR * Math.cos(v);

                    colAttr.array[idx * 3] = 0.2 + audioScale * 0.8;
                    colAttr.array[idx * 3 + 1] = 0.5 + Math.sin(angle) * 0.3;
                    colAttr.array[idx * 3 + 2] = 1.0;
                    idx++;
                }
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
