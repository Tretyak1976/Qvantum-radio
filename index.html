<!DOCTYPE html>
<html lang="ru" class="h-full bg-black select-none overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALITY RADIO 3D :: FESTIVAL SHOW (OPTIMIZED & PHYSICS)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }, colors: { glass: 'rgba(10, 10, 15, 0.75)', glassBorder: 'rgba(255, 255, 255, 0.1)' } } }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Базовый Three.js (БЕЗ тяжелой постобработки для макс. производительности) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root { --accent-primary: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.6); --accent-rgb: 59, 130, 246; --accent-gradient: linear-gradient(135deg, rgba(var(--accent-rgb), 0.25) 0%, rgba(16, 185, 129, 0.2) 100%); transition: --accent-primary 0.3s ease, --accent-glow 0.3s ease; }
        body { font-family: 'Inter', sans-serif; background-color: #000000; color: #fff; margin: 0; overflow: hidden; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glassBorder); border-radius: 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); transition: opacity 0.6s ease, transform 0.6s ease; }
        .zen-hidden-left { transform: translateX(-120%); opacity: 0 !important; pointer-events: none; }
        .zen-hidden-right { transform: translateX(120%); opacity: 0 !important; pointer-events: none; }
        .zen-hidden-bottom { transform: translateY(120%); opacity: 0 !important; pointer-events: none; }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; } ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: var(--accent-primary); cursor: pointer; margin-top: -5px; box-shadow: 0 0 12px var(--accent-glow); transition: background 0.3s ease; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
        select { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px top 50%; background-size: 10px auto; }
        .active-station-card { background: var(--accent-gradient); border: 1px solid var(--accent-primary) !important; box-shadow: 0 0 25px var(--accent-glow); }
        @keyframes glowingPulse { 0% { box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.3); } 50% { box-shadow: 0 0 35px rgba(var(--accent-rgb), 0.7); transform: scale(1.01); } 100% { box-shadow: 0 0 15px rgba(var(--accent-rgb), 0.3); } }
        .pulsing-active { animation: glowingPulse 2s infinite ease-in-out; z-index: 40; }
        .station-item:active { transform: scale(0.98); }
        #stations-list-container { overflow-y: auto; position: relative; scroll-behavior: smooth; } #stations-list-content { position: absolute; top: 0; left: 0; width: 100%; }
        .dynamic-bg { transition: background-color 0.3s ease; } .dynamic-text { transition: color 0.3s ease; }
        .flag-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 0 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="h-screen w-screen relative overflow-hidden bg-black select-none">

    <div id="globe-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>

                    <div class="flex items-center gap-2">

                        <button id="btn-more-countries" class="shrink-0 bg-black/60 border border-white/10 rounded-xl w-9 h-9 flex items-center justify-center text-gray-400 hover:text-white transition" onclick="toggleMinorCountries()" title="Показать остальные страны"><i data-lucide="plus" class="w-4 h-4"></i></button>
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-gray-400"></i>
                        <input type="text" id="input-search" placeholder="Поиск станций..." autocomplete="off" class="w-full bg-black/60 border border-white/10 rounded-xl pl-9 pr-3 py-2 text-xs text-white placeholder-gray-500 focus:outline-none transition hover:border-white/30 focus:border-[var(--accent-primary)]">
                    </div>
                    <button class="bg-black/60 hover:bg-white/10 active:scale-95 text-gray-400 p-2 rounded-xl border border-white/10 text-xs font-bold transition dynamic-bg" onclick="toggleHQFilter(this)">HQ</button>
                </div>
            </div>
        </aside>
    </div>

    <button id="btn-show-left" onclick="toggleLeftPanel()" class="hidden fixed left-4 top-4 z-40 bg-black/80 border border-white/20 rounded-xl p-3 text-white hover:bg-white/10 transition shadow-lg pointer-events-auto">
        <i data-lucide="sliders" class="w-5 h-5"></i>
    </button>

    <!-- ПРАВАЯ ПАНЕЛЬ -->
    <div id="ui-right" class="fixed top-4 right-4 bottom-32 z-30 w-[360px] pointer-events-none transition-all duration-700 md:block hidden md:opacity-100 flex flex-col">
        <aside class="w-full glass-panel h-full pointer-events-auto flex flex-col shadow-2xl overflow-hidden relative">
            <div class="p-3 border-b border-white/10 flex items-center justify-between bg-black/40 shrink-0">
                <h2 class="text-xs font-bold uppercase tracking-wider flex items-center gap-2 text-gray-200"><i data-lucide="radio" class="w-4 h-4 dynamic-text text-blue-400"></i> Эфирная сетка</h2>
            </div>
            <div id="active-station-pinned-container" class="hidden shrink-0 border-b border-white/20 bg-black/60 p-2 z-40"></div>
            <div id="stations-list-container" class="flex-1 relative scroll-smooth p-2">
                <div id="stations-list" class="w-full h-full relative overflow-y-auto"><div id="stations-list-content"></div></div>
                <div id="list-loader" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 text-xs gap-2 bg-black/60 backdrop-blur-sm z-10"><i data-lucide="loader-2" class="w-6 h-6 animate-spin dynamic-text text-blue-400"></i> Синхронизация...</div>
            </div>
        </aside>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ ПЛЕЕРА -->
    <footer id="ui-player" class="fixed bottom-4 left-4 right-4 z-40 pointer-events-none transition-all duration-700 max-w-7xl mx-auto">
        <div class="glass-panel w-full p-4 pointer-events-auto flex flex-col gap-3 shadow-2xl">
            <div id="player-controls-wrap" class="flex flex-wrap md:flex-nowrap items-center justify-between gap-3 w-full transition-all duration-500 overflow-hidden">
                
                <div class="w-full md:w-1/3 md:flex-1 flex items-center justify-between md:justify-start gap-3">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="relative group shrink-0">
                            <img id="player-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='1'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3Cpath d='M12 16v-4'/%3E%3Cpath d='M12 8h.01'/%3E%3C/svg%3E" class="w-10 h-10 md:w-12 md:h-12 rounded-xl bg-black/60 border border-white/10 object-cover" alt="Logo">
                            <button id="btn-fav-current" title="Добавить в избранное" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-black/80 border border-white/20 flex items-center justify-center text-gray-400 hover:text-red-500 active:scale-90 transition shadow"><i data-lucide="heart" class="w-3 h-3"></i></button>
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <div class="flex items-center gap-2"><span id="player-title" class="font-bold text-white text-sm truncate">Выберите станцию</span></div>
                            <span id="player-location" class="text-xs dynamic-text text-blue-400 truncate">Ожидание...</span>
                        </div>
                    </div>
                    <div class="flex md:hidden items-center gap-1.5 bg-black/40 p-1.5 rounded-xl border border-white/10 shrink-0">
                        <button class="text-gray-400 transition" onclick="toggleMute()"><i data-lucide="volume-2" id="icon-volume-mobile" class="w-4 h-4"></i></button>
                        <input type="range" id="master-volume-mobile" min="0" max="1" step="0.01" value="0.8" class="w-16">
                    </div>
                </div>

                <div class="w-full md:w-auto flex items-center justify-center gap-2 sm:gap-4 order-3 md:order-none pt-2 md:pt-0 border-t border-white/10 md:border-t-0">
                    <button id="btn-prev" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-white/10 border border-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition shrink-0"><i data-lucide="skip-back" class="w-4 h-4 fill-white"></i></button>
                    <button id="btn-play" class="w-10 h-10 md:w-12 md:h-12 rounded-full dynamic-bg bg-blue-500 text-white flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-[0_0_20px_var(--accent-glow)] shrink-0"><i data-lucide="play" class="w-4 h-4 md:w-5 md:h-5 fill-white ml-0.5"></i></button>
                    <button id="btn-next" class="w-8 h-8 md:w-9 md:h-9 rounded-full bg-white/10 border border-white/10 text-white flex items-center justify-center hover:bg-white/20 active:scale-90 transition shrink-0"><i data-lucide="skip-forward" class="w-4 h-4 fill-white"></i></button>
                    <div class="flex items-center gap-1.5 md:gap-3 ml-1 md:ml-3 border-l border-white/10 pl-2 md:pl-4">
                        <button class="flex items-center gap-1.5 bg-red-500/20 hover:bg-red-500/40 text-red-300 border border-red-500/30 px-3 md:px-4 py-1.5 rounded-xl transition active:scale-95" onclick="likeCurrentStation()"><i data-lucide="heart" id="icon-like" class="w-4 h-4 shrink-0"></i><span class="text-xs font-mono font-bold tracking-wide">Лайки: <span id="btn-like-text">--</span></span></button>
                    </div>
                </div>

                <div class="hidden md:flex md:w-1/3 md:flex-1 items-center justify-end gap-3 min-w-0">
                    <button title="ZEN Режим (F)" class="text-gray-400 hover:text-white transition p-2 rounded-xl border border-white/10 bg-white/5 ml-2" onclick="isUIHidden = !isUIHidden; setZenMode(isUIHidden);"><i data-lucide="maximize" class="w-4 h-4"></i></button>
                    <div class="flex items-center gap-2 bg-black/40 p-2 rounded-xl border border-white/10">
                        <button class="text-gray-400 hover:text-white transition p-0.5" onclick="toggleMute()"><i data-lucide="volume-2" id="icon-volume-desktop" class="w-4 h-4"></i></button>
                        <input type="range" id="master-volume-desktop" min="0" max="1" step="0.01" value="0.8" class="w-24">
                    </div>
                </div>
            </div>

            <!-- ПОЛОСА 2D ЭКВАЛАЙЗЕРА -->
            <div id="equalizer-container" class="w-full h-8 bg-black/60 rounded-xl overflow-hidden border border-white/10 relative flex items-center transition-all duration-500">
                <canvas id="equalizer-canvas" class="w-full h-full block"></canvas>
            </div>
        </div>
    </footer>

    <audio id="audio-player" crossorigin="anonymous" preload="none"></audio>

    <script>
        let globalStationCount = 0, dynamicCountries = []; 
        let showAllCountries = false;
        
        const GENRE_MAP = {
            'pop': ['k-pop', 'j-pop', 'indie pop', 'synthpop', 'top 40', 'electro pop'],
            'dance': ['club', 'house', 'techno', 'trance', 'eurodance', 'hardstyle'],
            'rock': ['hard rock', 'metal', 'indie rock', 'classic rock', 'punk', 'alternative'],
            'jazz': ['smooth jazz', 'bebop', 'swing', 'big band', 'blues'],
            'electronic': ['ambient', 'dubstep', 'drum and bass', 'synthwave', 'chillout', 'lo-fi'],
            'chillout': ['lounge', 'ambient', 'lo-fi', 'new age', 'meditation'],
            'news': ['world news', 'local news', 'business', 'sports news', 'weather'],
            'talk': ['interview', 'comedy', 'podcast', 'politics', 'education'],
            'classical': ['symphony', 'baroque', 'romantic', 'opera', 'piano', 'contemporary'],
            'hiphop': ['rap', 'trap', 'old school', 'rnb', 'lo-fi hip hop'],
            'folk': ['country', 'bluegrass', 'celtic', 'latin', 'world']
        };

        const GENRE_LABELS = {
            'pop': 'Поп-музыка', 'dance': 'Танцевальная', 'rock': 'Рок', 'jazz': 'Джаз / Блюз',
            'electronic': 'Электронная', 'chillout': 'Чиллаут', 'news': 'Новостные', 'talk': 'Разговорные',
            'classical': 'Классическая музыка', 'hiphop': 'Хип-Хоп / R&B', 'folk': 'Фолк / Этно'
        };

        let stationsData = [], allStationsMaster = [], currentStationIndex = -1, currentStation = null;
        let isHQOnly = false, isOnlyFavorites = false, isOnlyHistory = false, lastVolume = 0.8, isUIHidden = false;
        
        let favorites = JSON.parse(localStorage.getItem('radio_favs') || '[]');
        let historyStations = JSON.parse(localStorage.getItem('radio_history') || '[]');
        let likedStations = JSON.parse(localStorage.getItem('radio_likes') || '{}');

        const audio = document.getElementById('audio-player');
        let isPlaying = false, isAudioActuallyPlaying = false, isBuffering = false;            
        let corsEnabled = true;

        let idleTimer = null, currentBassLevel = 0, currentGlobalListeners = 0; 
        const ITEM_HEIGHT = 65; let scrollTimeout, searchTimeout, playErrorCount = 0, MAX_PLAY_ERRORS = 3; 
        let currentApiBase = 'https://de1.api.radio-browser.info', currentStationHash = 0;

        // 3D SHOW ENGINE (Optimized)
        let scene, camera, renderer, controls, globeGroup, pointsMesh;
        let sunLight, strobeLight;
        let quantumPoints, quantumLines, radioWavesGroup, radioRings = [];
        let eqCanvas, eqCtx, eqAnimationId, audioCtx, analyser, dataArray, timeDataArray;
        let leftPanelVisible = true;
        
        // Оптимизированный космос
        const NUM_GALAXIES = 5; // Снижено для FPS
        let galaxies = [];
        const NUM_PLANETS = 8; // Снижено для FPS
        let planets = [];
        let ambientDust;
        let nebulasSystem;
        
        // STATE
        let visualizerOffset = 0, smoothedCentroid = 0.5, beatThreshold = 0.5, isBeat = false, transitionFlash = 0.0; 

        // ОПТИМИЗИРОВАННАЯ СЕТКА КОРАБЛЯ (в 4 раза быстрее)
        const gridDim = 32, pCount = gridDim * gridDim;
        const pOrig = new Float32Array(pCount * 3), lineIndices = [];
        for(let i=0; i<gridDim; i++){
            for(let j=0; j<gridDim; j++){
                let idx = i*gridDim + j;
                if (j < gridDim - 1) lineIndices.push(idx, idx + 1);
                if (i < gridDim - 1) lineIndices.push(idx, idx + gridDim);
            }
        }

        /* ================= ФУНКЦИИ ИНТЕРФЕЙСА ================= */
        async function resolveFastestApiServer() { currentApiBase = 'https://de1.api.radio-browser.info'; return true; }
        async function fetchAPILists() { return true; }
        function loadStaticCatalogs() {
            const genreSelect = document.getElementById('filter-genre');
            if (genreSelect) { genreSelect.innerHTML = '<option value="">Все жанры</option>'; for (const [key, label] of Object.entries(GENRE_LABELS)) { genreSelect.innerHTML += `<option value="${key}">${label}</option>`; } }
            const countrySelect = document.getElementById('filter-country');
            if (countrySelect) { const commonCountries = ['Russia', 'USA', 'Germany', 'France', 'UK', 'Japan', 'Ukraine', 'Belarus']; countrySelect.innerHTML = '<option value="">Все страны</option>'; commonCountries.forEach(c => { countrySelect.innerHTML += `<option value="${c}">${c}</option>`; }); }
        }
        function updateSubgenreCatalog(genre) {
            const sub = document.getElementById('filter-subgenre'); if (!sub) return;
            if (!genre || !GENRE_MAP[genre]) { sub.innerHTML = '<option value="">Все поджанры</option>'; sub.disabled = true; return; }
            sub.innerHTML = '<option value="">Все поджанры</option>'; GENRE_MAP[genre].forEach(sg => { sub.innerHTML += `<option value="${sg}">${sg}</option>`; }); sub.disabled = false;
        }
        function toggleLeftPanel() {
            leftPanelVisible = !leftPanelVisible; const left = document.getElementById('ui-left'), showBtn = document.getElementById('btn-show-left');
            if (!leftPanelVisible) { left.classList.add('zen-hidden-left'); if(showBtn) showBtn.classList.remove('hidden'); } 
            else { left.classList.remove('zen-hidden-left'); if(showBtn) showBtn.classList.add('hidden'); }
        }
        function toggleMinorCountries() { showToast("Эта функция будет доступна в полной версии"); }
        function toggleHQFilter(btn) {
            isHQOnly = !isHQOnly; btn.classList.toggle('bg-blue-600'); btn.classList.toggle('text-white');
            showToast(isHQOnly ? "Режим HQ включен" : "Режим HQ выключен"); fetchStations(5000, document.getElementById('filter-country').value, '', document.getElementById('filter-genre').value, true);
        }

        function toggleFavoritesMode(btn) { isOnlyFavorites = !isOnlyFavorites; stationsData = isOnlyFavorites ? allStationsMaster.filter(st => favorites.includes(st.id)) : [...allStationsMaster]; updateStationCounts(); renderList(); btn.classList.toggle('bg-red-600'); btn.classList.toggle('text-white'); }
        function toggleHistoryMode(btn) { isOnlyHistory = !isOnlyHistory; stationsData = isOnlyHistory ? [...historyStations] : [...allStationsMaster]; updateStationCounts(); renderList(); btn.classList.toggle('bg-blue-600'); btn.classList.toggle('text-white'); }

        function setupEvents() {
            document.getElementById('btn-play').onclick = togglePlay; document.getElementById('btn-next').onclick = playNextStation; document.getElementById('btn-prev').onclick = playPrevStation; 
            const volDesktop = document.getElementById('master-volume-desktop'), volMobile = document.getElementById('master-volume-mobile');
            if(volDesktop) { volDesktop.addEventListener('input', e => syncVolume(e.target.value)); }
            if(volMobile) { volMobile.addEventListener('input', e => syncVolume(e.target.value)); volMobile.addEventListener('touchmove', e => syncVolume(e.target.value), {passive: true}); }
            document.getElementById('filter-country').addEventListener('change', onFilterChange); document.getElementById('filter-genre').addEventListener('change', onFilterChange); 
            const subgenreEl = document.getElementById('filter-subgenre'); if(subgenreEl) subgenreEl.addEventListener('change', onFilterChange);
            document.getElementById('input-search').addEventListener('input', e => { 
                const q = e.target.value.toLowerCase().trim(); if(q) stationsData = allStationsMaster.filter(st => st.name.toLowerCase().includes(q) || st.tags.toLowerCase().includes(q) || st.country.toLowerCase().includes(q)); 
                else stationsData = [...allStationsMaster]; updateStationCounts(); renderList(); 
                clearTimeout(searchTimeout); if(stationsData.length > 0) { searchTimeout = setTimeout(() => { selectStation(stationsData[0]); }, 500); } 
            });
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container'), el = document.createElement('div'); el.className = 'bg-black/90 backdrop-blur-md border border-white/20 px-4 py-2 rounded-full text-xs text-white shadow-2xl transition-all duration-300 transform translate-y-[-20px] opacity-0 flex items-center gap-2 pointer-events-auto dynamic-bg'; el.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-white"></i> ${msg}`; container.appendChild(el); lucide.createIcons(); requestAnimationFrame(() => { el.classList.remove('translate-y-[-20px]', 'opacity-0'); el.classList.add('translate-y-0', 'opacity-100'); }); setTimeout(() => { el.classList.remove('translate-y-0', 'opacity-100'); el.classList.add('translate-y-[-20px]', 'opacity-0'); setTimeout(() => el.remove(), 300); }, 3000);
        }
    </script>
</body>
</html>
