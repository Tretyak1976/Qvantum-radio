<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Radio 3D - GPU Symbiosis 10/10</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(10, 10, 15, 0.85); padding: 15px 30px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); display: flex; gap: 15px; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(59, 130, 246, 0.4); color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; }
        .btn:hover { background: rgba(59, 130, 246, 0.3); box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); }
        #audio-upload { display: none; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <label class="btn">
            Загрузить трек <input type="file" id="audio-upload" accept="audio/*">
        </label>
        <button class="btn" id="play-btn">▶ Play / Pause</button>
    </div>

    <div id="canvas-container"></div>

    <!-- Зависимости Three.js (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ==========================================
        // 1. КОНФИГУРАЦИЯ (CONFIG) - Легкая настройка
        // ==========================================
        const CONFIG = {
            audio: {
                fftSize: 2048,
                smoothing: 0.85,
                bassSensitivity: 2.5,
                midSensitivity: 1.5,
                highSensitivity: 3.0,
                lerpSpeed: 0.15 // Плавность перехода значений (избегание дерганий)
            },
            motion: {
                baseSpeed: 0.15,
                beatMultiplier: 6.0,
                speedDecay: 0.05, // Как быстро затухает скорость после бита
                noiseScale: 0.08,
                macroDistortion: 15.0
            },
            visuals: {
                baseRadius: 20,
                detailLevel: 35, // Плотность нейросети (влияет на кол-во полигонов)
                bloomStrength: 1.8,
                bloomRadius: 0.6,
                bloomThreshold: 0.1
            },
            palettes: [
                // Палитра 1: Неон / Киберпанк (Blue -> Magenta)
                [new THREE.Color(0x00f2fe), new THREE.Color(0x4facfe), new THREE.Color(0xf093fb), new THREE.Color(0xf5576c)],
                // Палитра 2: Инопланетная биомасса (Green -> Gold)
                [new THREE.Color(0x11998e), new THREE.Color(0x38ef7d), new THREE.Color(0xffb75e), new THREE.Color(0xed8f03)],
                // Палитра 3: Плазма / Огонь (Red -> Yellow)
                [new THREE.Color(0xff4b1f), new THREE.Color(0xff9068), new THREE.Color(0xf12711), new THREE.Color(0xf5af19)]
            ]
        };

        // ==========================================
        // 2. ШЕЙДЕРЫ (Симбиотическая геометрия на GPU)
        // ==========================================
        const vertexShader = `
            uniform float uTime;
            uniform float uLow;
            uniform float uMid;
            uniform float uHigh;
            uniform float uNoiseScale;
            uniform float uMacroDistortion;
            
            uniform vec3 uPalette[4];
            uniform float uPaletteMix; // От 0.0 до 3.0 для морфинга палитр

            varying vec3 vColor;
            varying float vGlow;

            // 3D Simplex Noise function (Ashima Arts)
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 1.0/7.0;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z.z.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m; return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vec3 pos = position;
                
                // --- ДВИЖЕНИЕ И ФИЗИКА ---
                // Базовое органичное "дыхание" + влияние средних частот на натяжение (масштаб шума)
                float currentNoiseScale = uNoiseScale + (uMid * 0.02);
                vec3 noiseCoord = pos * currentNoiseScale + vec3(0.0, uTime * 0.5, uTime * 0.2);
                float noiseVal = snoise(noiseCoord);

                // Макро-искажение от Баса (Low)
                float bassDistortion = (1.0 + uLow * uMacroDistortion);
                pos += normal * noiseVal * bassDistortion;

                // Микро-реакции от Высоких (High): случайные резкие всплески вершин
                float microHash = fract(sin(dot(position.xyz, vec3(12.9898, 78.233, 45.164))) * 43758.5453);
                float isHighHit = step(0.95, microHash); // Только 5% вершин реагируют на верха
                float spike = isHighHit * (uHigh * 8.0);
                pos += normal * spike;

                // --- ДИНАМИЧЕСКАЯ ПАЛИТРА ---
                // Зависимость цвета от высоты (Y), шума и текущего аудио-состояния
                float colorMixPos = (pos.y / (20.0 + bassDistortion)) * 0.5 + 0.5; // Нормализация от 0 до 1
                colorMixPos += noiseVal * 0.2 + uMid * 0.2;
                colorMixPos = clamp(colorMixPos, 0.0, 1.0);

                // Плавный морфинг между цветами в активной палитре
                vec3 colorA = mix(uPalette[0], uPalette[1], colorMixPos);
                vec3 colorB = mix(uPalette[2], uPalette[3], colorMixPos);
                
                // Выбор текущей палитры на основе uPaletteMix (изменение со временем/настроением)
                // Для упрощения примера берем первую палитру как базу.
                // В полном коде uPalette обновляется из JS массивами.
                vColor = mix(colorA, colorB, smoothstep(0.3, 0.7, colorMixPos));
                
                vGlow = isHighHit * uHigh; // Передаем данные о вспышке во фрагментный шейдер

                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                
                // Размер точек зависит от близости к камере и высоких частот
                gl_PointSize = (3.0 + spike) * (100.0 / gl_Position.z);
            }
        `;

        const fragmentShader = `
            varying vec3 vColor;
            varying float vGlow;
            
            void main() {
                // Делаем точки круглыми с мягким краем
                float dist = distance(gl_PointCoord, vec2(0.5));
                if (dist > 0.5) discard;
                
                float alpha = smoothstep(0.5, 0.1, dist);
                
                // Микро-реакция: изменение свечения (Bloom) на кончиках
                vec3 finalColor = vColor + vec3(vGlow * 1.5);

                gl_FragColor = vec4(finalColor, alpha * 0.9);
            }
        `;

        // ==========================================
        // 3. ИНИЦИАЛИЗАЦИЯ СЦЕНЫ И AUDIO
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 70);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // Эффекты (Bloom)
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), CONFIG.visuals.bloomStrength, CONFIG.visuals.bloomRadius, CONFIG.visuals.bloomThreshold);
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ==========================================
        // 4. ГЕОМЕТРИЯ (Нейросеть / Клетки)
        // ==========================================
        const uniforms = {
            uTime: { value: 0.0 },
            uLow: { value: 0.0 },
            uMid: { value: 0.0 },
            uHigh: { value: 0.0 },
            uNoiseScale: { value: CONFIG.motion.noiseScale },
            uMacroDistortion: { value: CONFIG.motion.macroDistortion },
            uPalette: { value: CONFIG.palettes[0] }, // Стартуем с 1-й палитры
            uPaletteMix: { value: 0.0 }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        // Используем Икосаэдр высокого разрешения — он формирует органичную сеть из треугольников
        const geometry = new THREE.IcosahedronGeometry(CONFIG.visuals.baseRadius, CONFIG.visuals.detailLevel);
        const wireframeGeom = new THREE.WireframeGeometry(geometry);

        const organismGroup = new THREE.Group();
        
        // Точки (ядра клеток / синапсы)
        const points = new THREE.Points(geometry, material);
        // Линии (связи / аксоны). Используют Тот же материал и деформируются идентично!
        const linesMat = material.clone(); 
        // Немного убавляем прозрачность линий для глубины
        linesMat.transparent = true;
        linesMat.opacity = 0.3;
        const lines = new THREE.LineSegments(wireframeGeom, linesMat);

        organismGroup.add(points);
        organismGroup.add(lines);
        scene.add(organismGroup);

        // ==========================================
        // 5. АУДИО АНАЛИЗАТОР (Web Audio API)
        // ==========================================
        let audioContext, analyser, dataArray;
        let audioElement = new Audio();
        audioElement.crossOrigin = "anonymous";
        let isPlaying = false;

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = CONFIG.audio.fftSize;
            analyser.smoothingTimeConstant = CONFIG.audio.smoothing;

            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        // UI Логика
        const playBtn = document.getElementById('play-btn');
        document.getElementById('audio-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                initAudio();
                audioElement.src = URL.createObjectURL(file);
                audioElement.play();
                isPlaying = true;
                playBtn.innerText = "❚❚ Pause";
                if(audioContext.state === 'suspended') audioContext.resume();
            }
        });

        playBtn.addEventListener('click', () => {
            initAudio();
            if (isPlaying) { audioElement.pause(); isPlaying = false; playBtn.innerText = "▶ Play"; } 
            else { 
                if(!audioElement.src) { alert('Сначала загрузите трек!'); return; }
                audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚ Pause"; 
            }
        });

        // ==========================================
        // 6. ANIMATION LOOP & PHYSICS
        // ==========================================
        let globalTime = 0;
        let currentSpeed = CONFIG.motion.baseSpeed;
        let activePaletteIndex = 0;
        let paletteMorphTimer = 0;

        // Внутренние значения для Lerp
        let targetLow = 0, targetMid = 0, targetHigh = 0;
        let curLow = 0, curMid = 0, curHigh = 0;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);
                
                let bassSum = 0, midSum = 0, highSum = 0;
                const bins = analyser.frequencyBinCount;
                
                // Разделяем полосы (примерные индексы для Sub-bass, Mid, High)
                for (let i = 0; i < bins; i++) {
                    const val = dataArray[i] / 255.0;
                    if (i < 10) bassSum += val;         // 0 - 10: Sub/Bass
                    else if (i < 150) midSum += val;    // 10 - 150: Mids
                    else if (i > 300 && i < 600) highSum += val; // Highs / Cymbals
                }

                targetLow = (bassSum / 10) * CONFIG.audio.bassSensitivity;
                targetMid = (midSum / 140) * CONFIG.audio.midSensitivity;
                targetHigh = (highSum / 300) * CONFIG.audio.highSensitivity;

                // Усиливаем влияние битов (возведение в степень)
                targetLow = Math.pow(targetLow, 1.5); 
                targetHigh = Math.pow(targetHigh, 2.0);

            } else {
                targetLow = 0; targetMid = 0; targetHigh = 0;
            }

            // Математическое сглаживание (Lerp) частот для предотвращения дерганых кадров
            curLow += (targetLow - curLow) * CONFIG.audio.lerpSpeed;
            curMid += (targetMid - curMid) * CONFIG.audio.lerpSpeed;
            curHigh += (targetHigh - curHigh) * CONFIG.audio.lerpSpeed;

            // ФИЗИКА СКОРОСТИ: Ускорение на битах, плавное затухание
            let targetMotionSpeed = CONFIG.motion.baseSpeed + (curLow > 0.5 ? curLow * CONFIG.motion.beatMultiplier : 0);
            currentSpeed += (targetMotionSpeed - currentSpeed) * CONFIG.motion.speedDecay;
            globalTime += currentSpeed * 0.01;

            // СМЕНА НАСТРОЕНИЯ / ПАЛИТР (Переключаем каждые ~15 сек музыки)
            paletteMorphTimer += currentSpeed * 0.005;
            if (paletteMorphTimer > 10.0) {
                paletteMorphTimer = 0;
                activePaletteIndex = (activePaletteIndex + 1) % CONFIG.palettes.length;
                uniforms.uPalette.value = CONFIG.palettes[activePaletteIndex];
                linesMat.uniforms.uPalette.value = CONFIG.palettes[activePaletteIndex];
            }

            // Обновляем Uniforms
            uniforms.uTime.value = globalTime;
            uniforms.uLow.value = curLow;
            uniforms.uMid.value = curMid;
            uniforms.uHigh.value = curHigh;
            
            linesMat.uniforms.uTime.value = globalTime;
            linesMat.uniforms.uLow.value = curLow;
            linesMat.uniforms.uMid.value = curMid;
            linesMat.uniforms.uHigh.value = curHigh;

            // Динамический Bloom: пульсирует вместе с басом
            bloomPass.strength = CONFIG.visuals.bloomStrength + (curLow * 1.5);

            composer.render();
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
