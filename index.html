<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quantum Radio 3D - Global Stream</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; user-select: none; touch-action: none; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        
        /* New Bottom UI Wrapper */
        #ui-wrapper {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 900px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        
        /* Idle State - Hides UI completely */
        #ui-wrapper.idle {
            opacity: 0; transform: translate(-50%, 30px); pointer-events: none;
        }

        /* Playlist Layer */
        #playlist-container {
            background: rgba(10, 10, 15, 0.75); padding: 15px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px);
            max-height: 25vh; overflow-y: auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* Controls Bar Layer */
        #controls-bar {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: rgba(10, 10, 15, 0.85); padding: 15px 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        h2 { margin: 0; font-size: 1.2rem; color: #3b82f6; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; text-shadow: 0 0 15px rgba(59, 130, 246, 0.6); white-space: nowrap;}
        
        /* Form Elements */
        select, button, .custom-file-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(59, 130, 246, 0.4);
            color: white; padding: 12px 18px; border-radius: 12px; box-sizing: border-box;
            outline: none; cursor: pointer; transition: all 0.3s; font-weight: bold;
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;
            display: inline-block; text-align: center;
        }
        
        select { flex: 1; min-width: 120px; }
        select option { background: #111; color: #fff; }
        
        button:hover, select:hover, .custom-file-btn:hover { 
            background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); 
        }
        button { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        
        /* Playlist Items */
        .track-item { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; border-radius: 8px; transition: background 0.2s; font-size: 0.9rem;}
        .track-item:hover { background: rgba(255,255,255,0.08); }
        .track-item.active { color: #3b82f6; background: rgba(59, 130, 246, 0.1); border-color: transparent; font-weight: bold; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);}
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 2px; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            #ui-wrapper { width: 100%; bottom: 0; border-radius: 25px 25px 0 0; }
            #controls-bar { 
                flex-wrap: wrap; padding: 15px; border-radius: 25px 25px 0 0; 
                border-bottom: none; border-left: none; border-right: none;
            }
            h2 { width: 100%; text-align: center; margin-bottom: 5px; font-size: 1.4rem;}
            select, button, .custom-file-btn { flex: 1 1 45%; padding: 15px 10px; font-size: 0.75rem; }
            #playlist-container { border-radius: 20px; margin: 0 10px; max-height: 30vh; }
        }
    </style>
</head>
<body>

    <div id="ui-wrapper">
        <div id="playlist-container">
            <div id="playlist">
                <div style="padding: 10px; color: #aaa; text-align: center;">Connecting to Google Drive...</div>
            </div>
        </div>
        
        <div id="controls-bar">
            <h2>QUANTUM RADIO</h2>
            
            <select id="genre-filter"><option value="all">Loading database...</option></select>
            
            <label class="custom-file-btn">
                UPLOAD
                <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
            </label>
            
            <button id="play-pause-btn">PLAY / PAUSE</button>
            <button id="fullscreen-btn">FULLSCREEN</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // =====================================================================
        // INSERT YOUR NEW APPS SCRIPT URL HERE !!!
        // =====================================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw70Zm6VuqsMbkp34l6LQpMswfad6slExKsp_19twxAxofHBFyxzL3zGpd4kICPTuo/exec"; 
        // =====================================================================

        let uiTimeout;
        const uiLayer = document.getElementById('ui-wrapper');
        
        // Auto-hide UI and Cursor after 3 seconds of inactivity
        function resetUiTimer() {
            uiLayer.classList.remove('idle');
            document.body.style.cursor = 'default';
            clearTimeout(uiTimeout);
            
            uiTimeout = setTimeout(() => { 
                if (isPlaying) { 
                    uiLayer.classList.add('idle'); 
                    document.body.style.cursor = 'none'; // Magic trick to hide the mouse!
                } 
            }, 3000);
        }
        
        window.addEventListener('mousemove', resetUiTimer);
        window.addEventListener('touchstart', resetUiTimer, {passive: true});
        window.addEventListener('click', resetUiTimer);

        // Fullscreen Logic
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
                fullscreenBtn.innerText = "EXIT FULL";
            } else {
                document.exitFullscreen();
                fullscreenBtn.innerText = "FULLSCREEN";
            }
            resetUiTimer();
        };

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) fullscreenBtn.innerText = "FULLSCREEN";
        });

        // Audio Engine
        let audioContext, analyser, dataArray, timeDataArray;
        let audioElement = new Audio();
        audioElement.crossOrigin = "anonymous"; 
        
        let isPlaying = false, fullPlaylist = [], currentPlaylist = [];
        let currentPlayingTrack = null;

        function initAudio() {
            if (audioContext) return;
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContextClass();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            analyser.smoothingTimeConstant = 0.85; 
            
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            timeDataArray = new Uint8Array(analyser.fftSize);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (APPS_SCRIPT_URL === "ВСТАВЬ_ССЫЛКУ_СЮДА") {
                document.getElementById('playlist').innerHTML = '<div style="color:#ef4444; padding:10px; text-align:center;">ERROR: Insert Apps Script URL in the code!</div>';
                return;
            }

            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                fullPlaylist = data;
                currentPlaylist = [...fullPlaylist];
                
                const genres = [...new Set(fullPlaylist.map(t => t.genre).filter(Boolean))];
                const filterSelect = document.getElementById('genre-filter');
                filterSelect.innerHTML = '<option value="all">ALL GENRES</option>';
                
                genres.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g; opt.innerText = g.toUpperCase();
                    filterSelect.appendChild(opt);
                });

                updatePlaylistUI();
            } catch (err) {
                console.error("Load error:", err);
                document.getElementById('playlist').innerHTML = '<div style="color:#ef4444; padding:10px; text-align:center;">Failed to load database. Check Apps Script URL.</div>';
            }
        });

        document.getElementById('genre-filter').addEventListener('change', (e) => {
            const selectedGenre = e.target.value;
            currentPlaylist = selectedGenre === 'all' ? [...fullPlaylist] : fullPlaylist.filter(t => t.genre === selectedGenre);
            updatePlaylistUI();
            resetUiTimer();
        });

        document.getElementById('audio-upload').onchange = (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                fullPlaylist.unshift({ name: file.name.substring(0, 30) + '...', genre: "LOCAL", url: URL.createObjectURL(file), isLocal: true }); 
                currentPlaylist = [...fullPlaylist];
                document.getElementById('genre-filter').value = 'all'; 
                updatePlaylistUI(); e.target.value = ''; 
                resetUiTimer();
            }
        };

        async function playTrack(track) {
            currentPlayingTrack = track;
            initAudio(); 
            if(audioContext.state === 'suspended') await audioContext.resume();
            
            document.querySelectorAll('.track-item').forEach(el => {
                el.classList.remove('active');
                if (el.dataset.url === track.url) el.classList.add('active');
            });

            const playBtn = document.getElementById('play-pause-btn');
            const originalBtnText = "PLAY / PAUSE";
            playBtn.innerText = "FETCHING DATA...";
            
            try {
                if (!track.isLocal && track.url.includes("script.google.com")) {
                     const response = await fetch(track.url);
                     if(!response.ok) throw new Error("Audio stream loading error");
                     const data = await response.json();
                     
                     if (data.error) throw new Error(data.error);
                     if (!data.base64) throw new Error("Track not converted");
                     
                     audioElement.src = data.base64;
                } else {
                     audioElement.src = track.url; 
                }

                await audioElement.play();
                isPlaying = true; 
                playBtn.innerText = originalBtnText;
                resetUiTimer();
                
            } catch (error) {
                console.error("Playback error:", error);
                playBtn.innerText = "ERROR - SKIPPING...";
                setTimeout(() => { 
                    playBtn.innerText = originalBtnText; 
                    playNextInGenre();
                }, 2000);
            }
        }

        function playNextInGenre() {
            if (!currentPlayingTrack) return;
            const sameGenreTracks = fullPlaylist.filter(t => t.genre === currentPlayingTrack.genre);
            if (sameGenreTracks.length > 0) {
                let currentIndex = sameGenreTracks.findIndex(t => t.url === currentPlayingTrack.url);
                playTrack(sameGenreTracks[(currentIndex + 1) % sameGenreTracks.length]);
            }
        }

        audioElement.addEventListener('ended', playNextInGenre);

        function updatePlaylistUI() {
            const playlistDiv = document.getElementById('playlist');
            playlistDiv.innerHTML = '';
            
            if (currentPlaylist.length === 0) {
                playlistDiv.innerHTML = '<div style="padding:10px; color:#aaa; text-align:center;">No tracks found</div>';
                return;
            }

            currentPlaylist.forEach((track) => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track-item';
                trackEl.dataset.url = track.url; 
                const genrePrefix = track.genre ? `<span style="color:#aaa; font-size:0.7rem;">[${track.genre}]</span> ` : '';
                trackEl.innerHTML = genrePrefix + track.name;
                if (currentPlayingTrack && currentPlayingTrack.url === track.url) trackEl.classList.add('active');
                trackEl.onclick = () => { playTrack(track); resetUiTimer(); };
                playlistDiv.appendChild(trackEl);
            });
        }

        document.getElementById('play-pause-btn').onclick = async () => {
            initAudio();
            if(audioContext.state === 'suspended') await audioContext.resume();
            if (isPlaying) { 
                audioElement.pause(); isPlaying = false; 
            } else {
                if (!audioElement.src || audioElement.src.endsWith(window.location.host + "/")) {
                    if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
                } else { 
                    await audioElement.play(); isPlaying = true; 
                }
            }
            resetUiTimer();
        };

        // --- 3D SCENE (UNCHANGED) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.002);

        const baseFov = 50;
        const camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 10, 55); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.minDistance = 20; controls.maxDistance = 150;

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.15; bloomPass.strength = 1.0; bloomPass.radius = 0.5;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene); composer.addPass(bloomPass);

        const globeGroup = new THREE.Group(); scene.add(globeGroup);

        const gridDim = 48; const pCount = gridDim * gridDim;
        const pOrig = new Float32Array(pCount * 3);
        const pPos = new Float32Array(pCount * 3);
        const pColor = new Float32Array(pCount * 3);
        const lineIndices = [];

        for(let i=0; i<gridDim; i++){
            for(let j=0; j<gridDim; j++){
                let idx = i*gridDim + j;
                if (j < gridDim - 1) lineIndices.push(idx, idx + 1);
                if (i < gridDim - 1) lineIndices.push(idx, idx + gridDim);
                
                let u = (j / (gridDim - 1)) * Math.PI * 2;
                let v = (i / (gridDim - 1)) * Math.PI;
                let r = 10.3; 
                
                pOrig[idx*3] = r * Math.cos(u) * Math.sin(v);
                pOrig[idx*3+1] = r * Math.cos(v);
                pOrig[idx*3+2] = r * Math.sin(u) * Math.sin(v);
                
                pPos[idx*3] = pOrig[idx*3]; pPos[idx*3+1] = pOrig[idx*3+1]; pPos[idx*3+2] = pOrig[idx*3+2];
            }
        }

        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pColor, 3));
        pGeo.setIndex(lineIndices);

        const pCanvas = document.createElement('canvas'); pCanvas.width = 16; pCanvas.height = 16; 
        const pCtx = pCanvas.getContext('2d'); const pGrad = pCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
        pGrad.addColorStop(0, 'rgba(255,255,255,1)'); pGrad.addColorStop(0.2, 'rgba(255,255,255,0.8)'); pGrad.addColorStop(1, 'rgba(0,0,0,0)'); 
        pCtx.fillStyle = pGrad; pCtx.fillRect(0,0,16,16);

        const quantumPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.6, map: new THREE.CanvasTexture(pCanvas), vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        const quantumLines = new THREE.LineSegments(pGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
        globeGroup.add(quantumPoints); globeGroup.add(quantumLines);

        const laserGroup = new THREE.Group();
        const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        for(let i=0; i<100; i++) {
            const points = [new THREE.Vector3(0, 10, 0), new THREE.Vector3(0, 250, 0)];
            const laser = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), laserMat.clone());
            const phi = Math.acos(-1 + (2 * i) / 100); const theta = Math.sqrt(100 * Math.PI) * phi;
            laser.rotation.set(phi, theta, 0); 
            laser.userData = { phase: Math.random() * Math.PI * 2, speed: 0.02 + Math.random() * 0.03, basex: phi, basey: theta };
            laserGroup.add(laser);
        }
        globeGroup.add(laserGroup);

        const radioWavesGroup = new THREE.Group(); globeGroup.add(radioWavesGroup);
        const radioRings = [];
        for(let i=0; i<4; i++) {
            const ringGeo = new THREE.BufferGeometry(); ringGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(256 * 3), 3));
            const ringMesh = new THREE.LineLoop(ringGeo, new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
            ringMesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            radioRings.push({ mesh: ringMesh, baseRadius: 10.4 + i*0.8, speed: (Math.random()-0.5)*0.02 }); 
            radioWavesGroup.add(ringMesh);
        }

        const strobeLight = new THREE.AmbientLight(0xffffff, 0); scene.add(strobeLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0); sunLight.position.set(50, 20, 30); scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x050510, 2.0));

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); 
            if(composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        const colorObj = new THREE.Color();
        let currentBassLevel = 0, smoothedCentroid = 0.5, beatThreshold = 0.5;
        let evolveBass = 0, evolveMid = 0, evolveTreble = 0;
        let targetRotX = 0.001, targetRotY = 0.002, targetRotZ = 0.001;
        let currentRotX = 0.001, currentRotY = 0.002, currentRotZ = 0.001;

        function animate() {
            requestAnimationFrame(animate); 
            controls.update();
            const t = Date.now() * 0.001;

            if (isPlaying && analyser && dataArray && timeDataArray) {
                analyser.getByteFrequencyData(dataArray); 
                analyser.getByteTimeDomainData(timeDataArray);
                
                let bass = 0, mid = 0, treble = 0, energy = 0, centroid = 0, weightSum = 0;
                const binCount = analyser.frequencyBinCount; 
                for(let i=0; i<binCount; i++) {
                    let val = dataArray[i] / 255.0; energy += val; centroid += val * i; weightSum += val;
                    if(i < 32) bass += val; else if(i < 360) mid += val; else treble += val; 
                }
                bass /= 32; mid /= 328; treble /= (binCount - 360); energy /= binCount; if(weightSum > 0) centroid /= weightSum;
                smoothedCentroid += ((centroid / binCount) - smoothedCentroid) * 0.05;

                const sharpBass = Math.pow(bass, 3);
                const sharpMid = Math.pow(mid, 2); 

                currentBassLevel += (sharpBass - currentBassLevel) * 0.2; 
                
                evolveBass += (sharpBass * 0.05) + 0.001;
                evolveMid += (mid * 0.05) + 0.002;
                evolveTreble += (treble * 0.05) + 0.0015;
                
                let currentBloom = 0.5 + (energy * 1.5) + (sharpBass * 2.0);
                if (bloomPass) bloomPass.strength = currentBloom;
                
                if (sharpBass > 0.8) {
                    camera.fov += ((baseFov - sharpBass * 15) - camera.fov) * 0.2;
                } else {
                    camera.fov += (baseFov - camera.fov) * 0.1;
                }
                camera.updateProjectionMatrix();

                beatThreshold = Math.max(0.2, beatThreshold * 0.95);
                let isBeat = false;
                if (sharpBass > beatThreshold) { 
                    isBeat = true; 
                    beatThreshold = Math.min(1.0, sharpBass * 1.2); 
                    
                    targetRotX = (Math.random() - 0.5) * 0.06 * sharpBass;
                    targetRotY = (Math.random() - 0.5) * 0.08 * sharpBass;
                    targetRotZ = (Math.random() - 0.5) * 0.04 * sharpBass;
                }

                currentRotX += (targetRotX - currentRotX) * 0.05;
                currentRotY += (targetRotY - currentRotY) * 0.05;
                currentRotZ += (targetRotZ - currentRotZ) * 0.05;

                const dynamicHue = (evolveMid * 50 + smoothedCentroid * 800 + energy * 200) % 360;

                let laserPower = Math.pow(treble, 2) * 1.5 + sharpBass; 
                laserGroup.children.forEach((l, i) => {
                    l.material.color.setHSL((dynamicHue + i*3)%360 / 360, 1.0, 0.6);
                    if(sharpBass > 0.5 || laserPower > 0.4) { 
                        l.material.opacity = Math.min(1.0, laserPower); l.scale.y = 1 + sharpBass * 2; 
                    } else { 
                        l.material.opacity *= 0.85; l.scale.y += (1 - l.scale.y) * 0.1; 
                    }
                    let choreo = i % 3;
                    if (choreo === 0) { l.rotation.x = l.userData.basex + Math.sin(t * l.userData.speed + l.userData.phase) * (0.2 + sharpBass*0.5); l.rotation.y = l.userData.basey + Math.cos(t * l.userData.speed + l.userData.phase) * (0.2 + sharpBass*0.5); } 
                    else if (choreo === 1) { l.rotation.x = l.userData.basex + Math.sin(t * 0.5) * 0.3; l.rotation.z = Math.cos(t * 0.5) * 0.3; } 
                    else { l.rotation.y = l.userData.basey + Math.cos(evolveBass * 0.5) * (0.5 * sharpBass); }
                });

                if (isBeat && sharpBass > 0.7) { strobeLight.intensity = 4.0; sunLight.intensity = 3.0; } 
                else { strobeLight.intensity += (0 - strobeLight.intensity) * 0.2; sunLight.intensity += (1.0 - sunLight.intensity) * 0.1; }

                const positions = quantumPoints.geometry.attributes.position.array; 
                const colors = quantumPoints.geometry.attributes.color.array;
                
                let freqU = 2.0 + Math.sin(evolveMid * 0.2) * 5.0; 
                let freqV = 3.0 + Math.cos(evolveBass * 0.15) * 6.0; 
                let shapeChaos = Math.sin(evolveTreble * 0.3) * 0.5;

                for(let i=0; i<gridDim; i++) {
                    for(let j=0; j<gridDim; j++) {
                        let idx = i*gridDim + j; 
                        let u = (j / (gridDim - 1)) * Math.PI * 2; 
                        let v = (i / (gridDim - 1)) * Math.PI;
                        
                        let audioIdx = Math.floor((idx / pCount) * (binCount * 0.5)); 
                        let rawF = dataArray[audioIdx] / 255.0; 
                        let fSharp = Math.pow(rawF, 2); 
                        let waveRipple = (timeDataArray[audioIdx]/128.0 - 1.0); 
                        
                        let tx = pOrig[idx*3], ty = pOrig[idx*3+1], tz = pOrig[idx*3+2];

                        if (energy > 0.01) {
                            let R = 15 + sharpBass * 20 + Math.sin(v * freqV + evolveMid) * (8 + mid * 10);
                            let twist = u + Math.sin(v * freqU + evolveTreble) * (Math.sin(evolveBass) * 4);
                            let flare = Math.abs(Math.cos(u * (4 + shapeChaos*2) + t)) * (10 + sharpMid * 15);
                            
                            let currentRadius = R + flare + fSharp * 15;

                            tx = Math.cos(twist) * Math.sin(v) * currentRadius;
                            tz = Math.sin(twist) * Math.sin(v) * currentRadius;
                            
                            let yVolume = Math.cos(v) * currentRadius * (0.6 + shapeChaos * 0.4); 
                            let yDrift = Math.cos(v * freqV) * (15 + shapeChaos * 10);
                            ty = yVolume + yDrift + Math.sin(u * freqU + evolveMid) * (5 + treble * 25);

                            let rippleForce = waveRipple * (5 + treble * 30); 
                            tx += Math.cos(v*20) * rippleForce; 
                            ty += Math.sin(u*20) * rippleForce; 
                            tz += Math.cos(u*20) * rippleForce;
                        }

                        let lerpFactor = fSharp > 0.4 ? 0.35 : 0.08; 
                        if(energy <= 0.01) lerpFactor = 0.02; 
                        
                        positions[idx*3] += (tx - positions[idx*3]) * lerpFactor; 
                        positions[idx*3+1] += (ty - positions[idx*3+1]) * lerpFactor; 
                        positions[idx*3+2] += (tz - positions[idx*3+2]) * lerpFactor;
                        
                        let l = energy > 0.01 ? (0.15 + fSharp*0.85) : 0.02; 
                        colorObj.setHSL((dynamicHue + idx*0.02 + waveRipple*40)/360, 1.0, l);
                        colors[idx*3] += (colorObj.r - colors[idx*3]) * lerpFactor; 
                        colors[idx*3+1] += (colorObj.g - colors[idx*3+1]) * lerpFactor; 
                        colors[idx*3+2] += (colorObj.b - colors[idx*3+2]) * lerpFactor;
                    }
                }
                quantumPoints.geometry.attributes.position.needsUpdate = true; 
                quantumPoints.geometry.attributes.color.needsUpdate = true;
                quantumLines.material.opacity = energy < 0.01 ? 0 : Math.min(0.8, energy * 1.5);
                
                globeGroup.rotation.x += currentRotX;
                globeGroup.rotation.y += currentRotY;
                globeGroup.rotation.z += currentRotZ;

                radioRings.forEach((r, idx) => {
                    r.mesh.rotation.x += r.speed * (1 + bass * 5); 
                    r.mesh.rotation.y += r.speed * (1 + mid * 5); 
                    const ringPositions = r.mesh.geometry.attributes.position.array;
                    r.mesh.material.color.setHSL((dynamicHue + idx*40)/360, 1.0, 0.4 + bass*0.6); 
                    r.mesh.material.opacity = 0.15 + energy;
                    
                    for(let j=0; j<256; j++) {
                        const angle = (j / 256) * Math.PI * 2; 
                        const freqVal = dataArray[j*4] / 255.0; 
                        const waveVal = (timeDataArray[j*8]/128.0 - 1.0); 
                        const dynamicRadius = r.baseRadius + Math.pow(freqVal, 2) * (3 + idx) + (waveVal * (1 + sharpBass*4));
                        ringPositions[j*3] = Math.cos(angle) * dynamicRadius; 
                        ringPositions[j*3+1] = Math.sin(angle) * dynamicRadius; 
                        ringPositions[j*3+2] = Math.sin(angle * (5 + idx*2) + t*5) * (freqVal * 5 + waveVal);
                    }
                    r.mesh.geometry.attributes.position.needsUpdate = true;
                });

            } else {
                currentBassLevel += (0 - currentBassLevel) * 0.1;
                strobeLight.intensity += (0 - strobeLight.intensity) * 0.1; 
                if (bloomPass) bloomPass.strength += (0.4 - bloomPass.strength) * 0.1;
                camera.fov += (baseFov - camera.fov) * 0.1; camera.updateProjectionMatrix();

                currentRotX += (0.0 - currentRotX) * 0.02;
                currentRotY += (0.001 - currentRotY) * 0.02;
                currentRotZ += (0.0 - currentRotZ) * 0.02;

                laserGroup.children.forEach((l) => { l.material.opacity *= 0.8; l.scale.y += (1 - l.scale.y) * 0.1; });
                
                radioRings.forEach(r => {
                    r.mesh.rotation.x += r.speed; r.mesh.rotation.y += r.speed; 
                    const pos = r.mesh.geometry.attributes.position.array; 
                    r.mesh.material.opacity += (0 - r.mesh.material.opacity) * 0.1;
                    for(let j=0; j<256; j++) { 
                        const angle = (j / 256) * Math.PI * 2; 
                        pos[j*3] += (Math.cos(angle) * r.baseRadius - pos[j*3]) * 0.1; 
                        pos[j*3+1] += (Math.sin(angle) * r.baseRadius - pos[j*3+1]) * 0.1; 
                        pos[j*3+2] += (0 - pos[j*3+2]) * 0.1; 
                    }
                    r.mesh.geometry.attributes.position.needsUpdate = true;
                });

                const positions = quantumPoints.geometry.attributes.position.array; 
                const colors = quantumPoints.geometry.attributes.color.array;
                for(let i=0; i<pCount; i++) {
                    positions[i*3] += (pOrig[i*3] - positions[i*3]) * 0.1; 
                    positions[i*3+1] += (pOrig[i*3+1] - positions[i*3+1]) * 0.1; 
                    positions[i*3+2] += (pOrig[i*3+2] - positions[i*3+2]) * 0.1;
                    colors[i*3] += (0.05 - colors[i*3]) * 0.1; 
                    colors[i*3+1] += (0.05 - colors[i*3+1]) * 0.1; 
                    colors[i*3+2] += (0.1 - colors[i*3+2]) * 0.1;
                }
                quantumPoints.geometry.attributes.position.needsUpdate = true; 
                quantumPoints.geometry.attributes.color.needsUpdate = true;
                quantumLines.material.opacity += (0 - quantumLines.material.opacity) * 0.1;
                
                globeGroup.rotation.x += currentRotX;
                globeGroup.rotation.y += currentRotY;
                globeGroup.rotation.z += currentRotZ;
            }
            
            composer.render();
        }

        animate();
    </script>
