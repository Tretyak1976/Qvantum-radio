<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Radio 3D - Neural Singularity</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; 
            background-color: #000000 !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; 
        }
        
        :fullscreen, ::backdrop, :-webkit-full-screen { background-color: #000000 !important; }

        #canvas-container { width: 100vw; height: 100dvh; position: fixed; top: 0; left: 0; z-index: 1; cursor: grab; background-color: #000000; }
        #canvas-container:active { cursor: grabbing; }
        
        #ui-bottom {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 700px; z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #ui-bottom.idle { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }

        #player-panel {
            width: 100%; background: rgba(10, 10, 15, 0.85); padding: 15px 20px; border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); box-sizing: border-box;
            display: flex; flex-direction: column; gap: 12px;
        }

        #sidebar {
            position: fixed; top: 0; left: 0; width: 350px; height: 100%;
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20; display: flex; flex-direction: column;
            transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.7); box-sizing: border-box;
        }
        #sidebar.open { transform: translateX(0); }

        #sidebar-header {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 1.1rem; color: #3b82f6; letter-spacing: 1px;
        }
        
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0; outline: none; transition: color 0.2s; }
        .close-btn:hover { color: #ef4444; }

        #playlist { flex: 1; overflow-y: auto; padding: 10px; }
        
        .track-item { 
            display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; transition: background 0.2s; font-size: 0.9rem; margin-bottom: 4px;
        }
        .track-item:hover { background: rgba(255,255,255,0.05); }
        .track-item.active { background: rgba(59, 130, 246, 0.1); border-color: transparent; font-weight: bold; }
        
        .track-play-icon {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.08); color: #aaa; cursor: pointer;
            margin-right: 15px; font-size: 1.1rem; transition: all 0.2s;
        }
        .track-play-icon:hover { background: rgba(59, 130, 246, 0.3); color: #fff; transform: scale(1.1); }
        .track-item.active .track-play-icon { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .track-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eee; }
        
        .fav-btn { font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; padding: 5px; margin-left: 10px; }
        .fav-btn:hover { transform: scale(1.3); }

        #progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 0.75rem; color: #aaa; font-weight: 600; }
        
        input[type="range"] { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 10px rgba(59,130,246,0.8); }

        #controls-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

        select, .btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(59, 130, 246, 0.3);
            color: white; padding: 10px 14px; border-radius: 20px;
            outline: none; cursor: pointer; transition: all 0.3s; font-weight: bold;
            font-size: 0.8rem; text-transform: uppercase;
        }
        
        select { flex: 1; min-width: 100px; text-overflow: ellipsis; }
        select option { background: #111; color: #fff; }
        
        .btn.icon { display: flex; align-items: center; justify-content: center; min-width: 40px; font-size: 1.1rem; }
        #play-pause-btn { font-size: 1.3rem; min-width: 50px; background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        
        select:hover, .btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }

        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #ui-bottom { bottom: 15px; width: 95%; }
            #player-panel { padding: 12px 15px; border-radius: 20px; }
            select { padding: 10px; font-size: 0.7rem; }
            .btn.icon { padding: 10px; font-size: 1.1rem; min-width: 35px; }
            #play-pause-btn { min-width: 45px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <span>QUANTUM PLAYLIST</span>
            <button id="close-sidebar" class="close-btn" title="Закрыть плейлист">✕</button>
        </div>
        <div id="playlist">
            <div style="padding: 20px; color: #aaa; text-align: center;">Syncing with Global Core...</div>
        </div>
    </div>

    <div id="ui-bottom">
        <div id="player-panel">
            <div id="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="time-total">0:00</span>
            </div>

            <div id="controls-bar">
                <button id="toggle-sidebar-btn" class="btn icon" title="Открыть плейлист">☰</button>
                <select id="genre-filter"><option value="all">Loading...</option></select>
                
                <label class="btn icon" title="Upload Local Track">
                    ⇧ <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
                </label>
                
                <div style="display: flex; gap: 8px;">
                    <button id="prev-btn" class="btn icon" title="Previous Track">⏮</button>
                    <button id="play-pause-btn" class="btn icon" title="Play/Pause">▶</button>
                    <button id="next-btn" class="btn icon" title="Next Track">⏭</button>
                </div>

                <button id="fullscreen-btn" class="btn icon" title="Fullscreen">⛶</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-mIMwHe0AAz1xQxxmklBJFTkfRxhGDcllBKjYs3J8N77RvbROOlapD7YpiOgoBLQ/exec"; 

        let uiTimeout;
        const uiLayer = document.getElementById('ui-bottom');
        const sidebar = document.getElementById('sidebar');
        
        function resetUiTimer() {
            uiLayer.classList.remove('idle');
            document.body.style.cursor = 'default';
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => { 
                if (isPlaying && !sidebar.classList.contains('open')) { 
                    uiLayer.classList.add('idle'); 
                    document.body.style.cursor = 'none'; 
                } 
            }, 3000);
        }
        
        window.addEventListener('mousemove', resetUiTimer);
        window.addEventListener('touchstart', resetUiTimer, {passive: true});
        window.addEventListener('click', resetUiTimer);

        document.getElementById('toggle-sidebar-btn').onclick = () => { sidebar.classList.add('open'); resetUiTimer(); };
        document.getElementById('close-sidebar').onclick = () => { sidebar.classList.remove('open'); resetUiTimer(); };
        document.getElementById('fullscreen-btn').onclick = () => {
            let docEl = document.documentElement;
            if (!document.fullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen().catch(e => {});
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(e => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            resetUiTimer();
        };

        // --- AUDIO ENGINE ---
        let audioContext, analyser, dataArray, timeDataArray;
        let audioElement = new Audio();
        audioElement.crossOrigin = "anonymous"; 
        
        let isPlaying = false, isPreloadingNext = false; 
        let fullPlaylist = [], currentPlaylist = [], currentPlayingTrack = null;
        const audioCache = {}; 
        let favorites = JSON.parse(localStorage.getItem('quantum_favorites')) || [];

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048; 
            analyser.smoothingTimeConstant = 0.82; // Отличное чтение транзиентов (ударов)
            
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser); analyser.connect(audioContext.destination);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            timeDataArray = new Uint8Array(analyser.fftSize);
        }

        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                progressBar.max = audioElement.duration;
                progressBar.value = audioElement.currentTime;
                timeCurrent.innerText = formatTime(audioElement.currentTime);
                timeTotal.innerText = formatTime(audioElement.duration);
                
                let timeLeft = audioElement.duration - audioElement.currentTime;
                if (timeLeft < 15 && currentPlaylist.length > 1 && !isPreloadingNext) {
                    let currentIdx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
                    let nextIdx = (currentIdx + 1) % currentPlaylist.length;
                    let nextTrack = currentPlaylist[nextIdx];
                    
                    if (!nextTrack.isLocal && nextTrack.url.includes("script.google.com") && !audioCache[nextTrack.url]) {
                        isPreloadingNext = true;
                        fetch(nextTrack.url)
                            .then(res => res.json())
                            .then(data => { if (!data.error && data.base64) audioCache[nextTrack.url] = data.base64; })
                            .catch(e => console.error(e));
                    }
                }
            }
        });

        progressBar.addEventListener('input', () => {
            if(audioElement.duration) audioElement.currentTime = progressBar.value;
            resetUiTimer();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            if (APPS_SCRIPT_URL === "ВСТАВЬ_ССЫЛКУ_СЮДА") return;
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                fullPlaylist = data; currentPlaylist = [...fullPlaylist];
                const genres = [...new Set(fullPlaylist.map(t => t.genre).filter(Boolean))];
                const filterSelect = document.getElementById('genre-filter');
                filterSelect.innerHTML = '<option value="all">ALL GENRES</option><option value="favorites">❤ FAVORITES</option>';
                
                genres.forEach(g => {
                    const opt = document.createElement('option'); opt.value = g; opt.innerText = g.toUpperCase();
                    filterSelect.appendChild(opt);
                });
                updatePlaylistUI();
                if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
            } catch (err) {
                document.getElementById('playlist').innerHTML = '<div style="color:#ef4444; padding:20px; text-align:center;">Database connection failed.</div>';
            }
        });

        document.getElementById('genre-filter').addEventListener('change', (e) => {
            const selectedGenre = e.target.value;
            if (selectedGenre === 'all') currentPlaylist = [...fullPlaylist];
            else if (selectedGenre === 'favorites') currentPlaylist = fullPlaylist.filter(t => favorites.includes(t.url));
            else currentPlaylist = fullPlaylist.filter(t => t.genre === selectedGenre);
            
            updatePlaylistUI();
            if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
            else { audioElement.pause(); isPlaying = false; document.getElementById('play-pause-btn').innerText = "▶"; }
            resetUiTimer();
        });

        document.getElementById('audio-upload').onchange = (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const localUrl = URL.createObjectURL(file);
                fullPlaylist.unshift({ name: file.name.substring(0, 30) + '...', genre: "LOCAL", url: localUrl, isLocal: true }); 
                const filter = document.getElementById('genre-filter');
                if(filter.value !== 'all') { filter.value = 'all'; filter.dispatchEvent(new Event('change')); }
                else { currentPlaylist = [...fullPlaylist]; updatePlaylistUI(); playTrack(currentPlaylist[0]); }
                e.target.value = ''; resetUiTimer();
            }
        };

        const playBtn = document.getElementById('play-pause-btn');

        function playNext() {
            if (!currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            playTrack(currentPlaylist[(idx + 1) % currentPlaylist.length]);
        }
        function playPrev() {
            if (!currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            let prevIdx = (idx - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrack(currentPlaylist[prevIdx]);
        }

        document.getElementById('next-btn').onclick = () => { playNext(); resetUiTimer(); };
        document.getElementById('prev-btn').onclick = () => { playPrev(); resetUiTimer(); };
        audioElement.addEventListener('ended', playNext);

        async function playTrack(track) {
            currentPlayingTrack = track;
            initAudio(); 
            if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});

            isPreloadingNext = false;
            updatePlaylistUI();
            playBtn.innerText = "↻"; 
            
            try {
                if (!track.isLocal && track.url.includes("script.google.com")) {
                     if (audioCache[track.url]) { audioElement.src = audioCache[track.url]; } 
                     else {
                         const response = await fetch(track.url); const data = await response.json();
                         if (data.error || !data.base64) throw new Error("Load error");
                         audioElement.src = data.base64; audioCache[track.url] = data.base64; 
                     }
                } else { audioElement.src = track.url; }

                let playPromise = audioElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true; playBtn.innerText = "❚❚";
                        updatePlaylistUI(); resetUiTimer();
                    }).catch(error => {
                        isPlaying = false; playBtn.innerText = "▶"; updatePlaylistUI();
                        document.body.addEventListener('click', function resumeAutoplay() {
                            if(!isPlaying) { audioContext.resume(); audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; updatePlaylistUI(); }
                            document.body.removeEventListener('click', resumeAutoplay);
                        }, {once: true});
                    });
                }
            } catch (error) { playBtn.innerText = "⚠"; setTimeout(() => playNext(), 2000); }
        }

        function updatePlaylistUI() {
            const playlistDiv = document.getElementById('playlist');
            playlistDiv.innerHTML = '';
            if (currentPlaylist.length === 0) { playlistDiv.innerHTML = '<div style="padding:10px; color:#aaa; text-align:center;">No tracks found</div>'; return; }

            currentPlaylist.forEach((track) => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track-item';
                const isActive = (currentPlayingTrack && currentPlayingTrack.url === track.url);
                if (isActive) trackEl.classList.add('active');
                
                const playIconBtn = document.createElement('div');
                playIconBtn.className = 'track-play-icon';
                playIconBtn.innerHTML = (isActive && isPlaying) ? '❚❚' : '▶';
                playIconBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (isActive) {
                        if (isPlaying) { audioElement.pause(); isPlaying = false; } else { audioElement.play(); isPlaying = true; }
                        updatePlaylistUI(); playBtn.innerText = isPlaying ? "❚❚" : "▶";
                    } else playTrack(track);
                    resetUiTimer();
                };
                
                const titleSpan = document.createElement('span'); titleSpan.className = 'track-title'; titleSpan.innerHTML = track.name;
                const favBtn = document.createElement('span');
                const isFav = favorites.includes(track.url);
                favBtn.className = 'fav-btn'; favBtn.innerText = isFav ? '♥' : '♡'; favBtn.style.color = isFav ? '#ef4444' : '#aaa';
                favBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (isFav) favorites = favorites.filter(url => url !== track.url); else favorites.push(track.url);
                    localStorage.setItem('quantum_favorites', JSON.stringify(favorites));
                    if (document.getElementById('genre-filter').value === 'favorites' && isFav) currentPlaylist = currentPlaylist.filter(t => t.url !== track.url);
                    updatePlaylistUI(); 
                };

                trackEl.appendChild(playIconBtn); trackEl.appendChild(titleSpan); trackEl.appendChild(favBtn);
                playlistDiv.appendChild(trackEl);
            });
        }

        playBtn.onclick = async () => {
            initAudio(); if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            if (isPlaying) { audioElement.pause(); isPlaying = false; playBtn.innerText = "▶"; } 
            else {
                if (!audioElement.src || audioElement.src.endsWith(window.location.host + "/")) { if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]); } 
                else { await audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; }
            }
            updatePlaylistUI(); resetUiTimer();
        };

        // =========================================================================
        // 3D SCENE: THE NEURAL SINGULARITY (МОЁ ВИДЕНИЕ)
        // =========================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.0035);

        const baseFov = 45;
        const camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 5, 60); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); 
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.04; controls.minDistance = 20; controls.maxDistance = 150;

        const renderScene = new THREE.RenderPass(scene, camera);
        
        // Кристальный, неоновый Bloom
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.2, 0.85);
        bloomPass.threshold = 0.15; 
        bloomPass.strength = 1.2; 
        bloomPass.radius = 0.25;

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene); composer.addPass(bloomPass);

        const singularityGroup = new THREE.Group(); scene.add(singularityGroup);

        // Текстура частиц (Чистая звезда)
        const pCanvas = document.createElement('canvas'); pCanvas.width = 32; pCanvas.height = 32; 
        const pCtx = pCanvas.getContext('2d'); const pGrad = pCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        pGrad.addColorStop(0, 'rgba(255,255,255,1)'); pGrad.addColorStop(0.2, 'rgba(255,255,255,0.9)'); pGrad.addColorStop(0.6, 'rgba(255,255,255,0.2)'); pGrad.addColorStop(1, 'rgba(0,0,0,0)'); 
        pCtx.fillStyle = pGrad; pCtx.fillRect(0,0,32,32);
        const particleTexture = new THREE.CanvasTexture(pCanvas);

        // --- ОРГАН 1: ЖИВОЕ ЯДРО (The Core) ---
        // Икосаэдр высокой детализации (~12,000 вершин). Идеально для плавных жидкокристаллических волн.
        const coreGeo = new THREE.IcosahedronGeometry(12, 35); 
        const coreBasePos = new Float32Array(coreGeo.attributes.position.array);
        const coreNormals = new Float32Array(coreGeo.attributes.normal.array);
        const coreColors = new Float32Array(coreBasePos.length);
        coreGeo.setAttribute('color', new THREE.BufferAttribute(coreColors, 3));
        
        const coreMat = new THREE.PointsMaterial({ size: 0.9, vertexColors: true, map: particleTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
        const coreMesh = new THREE.Points(coreGeo, coreMat);
        singularityGroup.add(coreMesh);

        // --- ОРГАН 2: НЕЙРОННЫЕ КОЛЬЦА (Torus Knots) ---
        // Сложные узлы, вращающиеся вокруг ядра. Реагируют на мелодию.
        const rings = [];
        const ringMat = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, map: particleTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
        for (let i = 0; i < 3; i++) {
            const rGeo = new THREE.TorusKnotGeometry(18 + i * 3, 0.5 + i * 0.2, 300, 20, 3 + i, 4 + i);
            const rBasePos = new Float32Array(rGeo.attributes.position.array);
            const rNormals = new Float32Array(rGeo.attributes.normal.array);
            const rColors = new Float32Array(rBasePos.length);
            rGeo.setAttribute('color', new THREE.BufferAttribute(rColors, 3));
            const rMesh = new THREE.Points(rGeo, ringMat);
            rMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            singularityGroup.add(rMesh);
            rings.push({ mesh: rMesh, basePos: rBasePos, normals: rNormals, speedX: (Math.random() - 0.5) * 0.01, speedY: (Math.random() - 0.5) * 0.01 });
        }

        // --- ОРГАН 3: КВАНТОВАЯ ПЫЛЬ (The Swarm) ---
        // Облако частиц, которое разлетается при резких высоких звуках (скрипки, хэты)
        const swarmCount = 8000;
        const swarmGeo = new THREE.BufferGeometry();
        const swarmPos = new Float32Array(swarmCount * 3);
        const swarmBasePos = new Float32Array(swarmCount * 3);
        const swarmColors = new Float32Array(swarmCount * 3);
        const swarmVel = new Float32Array(swarmCount * 3); // Вектор скорости для каждой частицы
        
        for (let i = 0; i < swarmCount; i++) {
            // Равномерное распределение по сфере
            const u = Math.random(); const v = Math.random();
            const theta = u * 2.0 * Math.PI; const phi = Math.acos(2.0 * v - 1.0);
            const r = 25 + Math.random() * 20;
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);
            swarmPos[i*3] = x; swarmPos[i*3+1] = y; swarmPos[i*3+2] = z;
            swarmBasePos[i*3] = x; swarmBasePos[i*3+1] = y; swarmBasePos[i*3+2] = z;
        }
        swarmGeo.setAttribute('position', new THREE.BufferAttribute(swarmPos, 3));
        swarmGeo.setAttribute('color', new THREE.BufferAttribute(swarmColors, 3));
        const swarmMat = new THREE.PointsMaterial({ size: 1.5, vertexColors: true, map: particleTexture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.8 });
        const swarmMesh = new THREE.Points(swarmGeo, swarmMat);
        singularityGroup.add(swarmMesh);

        // Освещение для глубины
        const ambientLight = new THREE.AmbientLight(0x0a0a1a, 2.0); scene.add(ambientLight);

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); if(composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // -------------------------------------------------------------------------
        // МАТЕМАТИКА НЕЙРОННОЙ СИНГУЛЯРНОСТИ
        // -------------------------------------------------------------------------
        const colorObj = new THREE.Color();
        
        // Анализаторы огибающей (Attack / Release)
        let aBass = 0, aMid = 0, aTreble = 0; 
        let prevEnergy = 0, vitality = 0;
        let globalTime = Math.random() * 1000; // Бесконечное время мутации
        let waltzPhase = 0;
        let beatCooldown = 0;

        let rotImpulseX = 0, rotImpulseY = 0;
        let currentRotX = 0.001, currentRotY = 0.002;

        function animate() {
            requestAnimationFrame(animate); 
            controls.update(); 
            const deltaT = 0.016; 
            globalTime += deltaT;
            
            if (beatCooldown > 0) beatCooldown--;

            if (isPlaying && analyser && dataArray && timeDataArray) {
                analyser.getByteFrequencyData(dataArray); 
                analyser.getByteTimeDomainData(timeDataArray);
                
                let bass = 0, mid = 0, treble = 0, energy = 0;
                const binCount = analyser.frequencyBinCount;
                for(let i=0; i<binCount; i++) {
                    let val = dataArray[i] / 255.0; 
                    energy += val;
                    if(i < 15) bass += val;        // Суббас и бас
                    else if(i < 150) mid += val;   // Вокал, синты
                    else treble += val;            // Скрипки, тарелки
                }
                bass /= 15; mid /= 135; treble /= (binCount - 150); energy /= binCount; 
                
                let energyFlux = Math.max(0, energy - prevEnergy);
                prevEnergy = energy;

                // Нелинейное усиление частот для чёткого разделения
                const sharpBass = Math.pow(bass, 2.5);
                const sharpMid = Math.pow(mid, 1.8);
                const sharpTreble = Math.pow(treble, 2.2); // Скрипки будут очень острыми

                // Идеальные фильтры считывания (Attack/Release)
                const attack = 0.45, release = 0.05;
                aBass += (sharpBass > aBass ? attack : release) * (sharpBass - aBass);
                aMid += (sharpMid > aMid ? attack : release) * (sharpMid - aMid);
                aTreble += (sharpTreble > aTreble ? attack : release) * (sharpTreble - aTreble);

                // Vitality - Темперамент музыки
                let targetVitality = Math.min(1.0, energy * 3.0 + aBass * 0.8 + energyFlux * 4.0);
                vitality += (targetVitality - vitality) * 0.05;

                waltzPhase += (0.002 + vitality * 0.01) + aMid * 0.02; // Мелодия крутит фазу

                // Детектор бита (Только для вращения всей фигуры)
                if (aBass > 0.45 && beatCooldown <= 0 && energyFlux > 0.02) { 
                    beatCooldown = 20; 
                    // Жесткий бас = мощный разворот
                    rotImpulseX = (Math.random() - 0.5) * (0.05 + vitality * 0.1) * aBass;
                    rotImpulseY = (Math.random() - 0.5) * (0.05 + vitality * 0.15) * aBass;
                }

                if (bloomPass) {
                    bloomPass.strength += (Math.min(1.8, 0.6 + vitality * 0.8 + aTreble * 1.5) - bloomPass.strength) * 0.1;
                }

                // Дыхание камеры
                camera.fov += ((baseFov + Math.sin(waltzPhase)*2 - aBass*10) - camera.fov) * 0.1;
                camera.updateProjectionMatrix();

                // Инерция вращения
                rotImpulseX *= 0.92; rotImpulseY *= 0.92;
                currentRotX += ((Math.sin(waltzPhase*0.5)*0.002 + rotImpulseX) - currentRotX) * 0.05; 
                currentRotY += ((Math.cos(waltzPhase*0.4)*0.003 + rotImpulseY) - currentRotY) * 0.05; 
                singularityGroup.rotation.x += currentRotX;
                singularityGroup.rotation.y += currentRotY;

                // Цветовая эволюция (зависит от времени и энергии)
                const baseHue = (globalTime * 15 + vitality * 100) % 360;

                // --- 1. АНИМАЦИЯ ЯДРА (Liquid Core) ---
                // Ядро дышит от Мелодии (aMid) и раздувается от Баса (aBass)
                const cPos = coreGeo.attributes.position.array;
                const cCol = coreGeo.attributes.color.array;
                for (let i = 0; i < cPos.length; i += 3) {
                    let nx = coreNormals[i], ny = coreNormals[i+1], nz = coreNormals[i+2];
                    
                    // Сложный 3D шум для эффекта жидкости
                    let noise = Math.sin(nx * 3.5 + waltzPhase) * Math.cos(ny * 3.5 - globalTime) * Math.sin(nz * 3.5 + waltzPhase * 1.2);
                    let noise2 = Math.sin(nx * 7.0 - waltzPhase*2) * Math.cos(ny * 7.0 + globalTime);
                    
                    // Бас делает ядро больше и шипастее, Мелодия пускает по нему рябь
                    let displacement = (noise * 2.5 * aMid) + (noise2 * 1.5 * aTreble) + (aBass * 6.0);
                    
                    let targetX = coreBasePos[i] + nx * displacement;
                    let targetY = coreBasePos[i+1] + ny * displacement;
                    let targetZ = coreBasePos[i+2] + nz * displacement;

                    cPos[i] += (targetX - cPos[i]) * 0.15;
                    cPos[i+1] += (targetY - cPos[i+1]) * 0.15;
                    cPos[i+2] += (targetZ - cPos[i+2]) * 0.15;

                    let hue = (baseHue + noise * 40 + aBass * 60) % 360;
                    colorObj.setHSL(hue / 360, 0.9, 0.2 + aMid * 0.4 + aTreble * 0.4);
                    cCol[i] = colorObj.r; cCol[i+1] = colorObj.g; cCol[i+2] = colorObj.b;
                }
                coreGeo.attributes.position.needsUpdate = true;
                coreGeo.attributes.color.needsUpdate = true;

                // --- 2. АНИМАЦИЯ НЕЙРОННЫХ КОЛЕЦ (Torus Knots) ---
                rings.forEach((ring, idx) => {
                    ring.mesh.rotation.x += ring.speedX + (aMid * 0.05);
                    ring.mesh.rotation.y += ring.speedY + (aMid * 0.05);
                    
                    const rPos = ring.mesh.geometry.attributes.position.array;
                    const rCol = ring.mesh.geometry.attributes.color.array;
                    
                    for (let i = 0; i < rPos.length; i += 3) {
                        let nx = ring.normals[i], ny = ring.normals[i+1], nz = ring.normals[i+2];
                        let wave = Math.sin((ring.basePos[i] + ring.basePos[i+1]) * 0.5 - waltzPhase * 3.0);
                        
                        // Кольца пульсируют под Мелодию и раздуваются на Бас
                        let expand = (wave * 2.0 * aMid) + (aBass * 3.0);
                        
                        rPos[i] += ((ring.basePos[i] + nx * expand) - rPos[i]) * 0.1;
                        rPos[i+1] += ((ring.basePos[i+1] + ny * expand) - rPos[i+1]) * 0.1;
                        rPos[i+2] += ((ring.basePos[i+2] + nz * expand) - rPos[i+2]) * 0.1;

                        let hue = (baseHue + 120 * idx + wave * 30) % 360;
                        colorObj.setHSL(hue / 360, 0.9, 0.15 + aMid * 0.5);
                        rCol[i] = colorObj.r; rCol[i+1] = colorObj.g; rCol[i+2] = colorObj.b;
                    }
                    ring.mesh.geometry.attributes.position.needsUpdate = true;
                    ring.mesh.geometry.attributes.color.needsUpdate = true;
                });

                // --- 3. КВАНТОВАЯ ПЫЛЬ (Реакция на скрипки / Treble) ---
                const sPos = swarmGeo.attributes.position.array;
                const sCol = swarmGeo.attributes.color.array;
                
                for (let i = 0; i < swarmCount; i++) {
                    let idx3 = i * 3;
                    let bx = swarmBasePos[idx3], by = swarmBasePos[idx3+1], bz = swarmBasePos[idx3+2];
                    
                    // Считываем "чистую" волну с осциллографа для трепетания пыли
                    let waveData = (timeDataArray[(i * 5) % analyser.fftSize] / 128.0 - 1.0);
                    
                    // При высоких звуках частицы разлетаются от центра
                    let dist = Math.sqrt(bx*bx + by*by + bz*bz);
                    let scatter = aTreble * 15.0 + Math.abs(waveData) * aTreble * 20.0;
                    
                    // Бас притягивает пыль обратно к ядру (эффект гравитации)
                    let gravity = aBass * 10.0; 
                    
                    let targetX = bx + (bx/dist) * scatter - (bx/dist) * gravity;
                    let targetY = by + (by/dist) * scatter - (by/dist) * gravity;
                    let targetZ = bz + (bz/dist) * scatter - (bz/dist) * gravity;

                    // Добавляем завихрения
                    let swirl = Math.sin(globalTime + by * 0.1) * 2.0 * aMid;
                    targetX += swirl; targetZ -= swirl;

                    sPos[idx3] += (targetX - sPos[idx3]) * 0.15;
                    sPos[idx3+1] += (targetY - sPos[idx3+1]) * 0.15;
                    sPos[idx3+2] += (targetZ - sPos[idx3+2]) * 0.15;

                    // Пыль вспыхивает на высоких нотах
                    let hue = (baseHue + 180 + waveData * 60) % 360;
                    let lum = aTreble > 0.1 ? (0.2 + aTreble * 0.8) : 0.02; // Гаснут в тишине
                    colorObj.setHSL(hue / 360, 1.0, Math.min(0.8, lum));
                    sCol[idx3] = colorObj.r; sCol[idx3+1] = colorObj.g; sCol[idx3+2] = colorObj.b;
                }
                swarmGeo.attributes.position.needsUpdate = true;
                swarmGeo.attributes.color.needsUpdate = true;

            } else {
                // ПАУЗА - Тихий режим
                if (bloomPass) bloomPass.strength += (0.4 - bloomPass.strength) * 0.05; 
                camera.fov += (baseFov - camera.fov) * 0.05; camera.updateProjectionMatrix();
                
                currentRotX += (0.0005 - currentRotX) * 0.02; currentRotY += (0.0015 - currentRotY) * 0.02; 
                singularityGroup.rotation.x += currentRotX; singularityGroup.rotation.y += currentRotY;

                // Медленное дыхание ядра
                let idleBreath = Math.sin(globalTime * 1.5) * 0.5;
                const cPos = coreGeo.attributes.position.array;
                for (let i = 0; i < cPos.length; i += 3) {
                    cPos[i] += ((coreBasePos[i] + coreNormals[i] * idleBreath) - cPos[i]) * 0.05;
                    cPos[i+1] += ((coreBasePos[i+1] + coreNormals[i+1] * idleBreath) - cPos[i+1]) * 0.05;
                    cPos[i+2] += ((coreBasePos[i+2] + coreNormals[i+2] * idleBreath) - cPos[i+2]) * 0.05;
                }
                coreGeo.attributes.position.needsUpdate = true;

                // Кольца возвращаются на место
                rings.forEach(ring => {
                    ring.mesh.rotation.x += ring.speedX; ring.mesh.rotation.y += ring.speedY;
                    const rPos = ring.mesh.geometry.attributes.position.array;
                    for (let i = 0; i < rPos.length; i++) rPos[i] += (ring.basePos[i] - rPos[i]) * 0.05;
                    ring.mesh.geometry.attributes.position.needsUpdate = true;
                });

                // Пыль оседает
                const sPos = swarmGeo.attributes.position.array;
                const sCol = swarmGeo.attributes.color.array;
                for (let i = 0; i < swarmCount; i++) {
                    let idx3 = i*3;
                    sPos[idx3] += (swarmBasePos[idx3] - sPos[idx3]) * 0.05;
                    sPos[idx3+1] += (swarmBasePos[idx3+1] - sPos[idx3+1]) * 0.05;
                    sPos[idx3+2] += (swarmBasePos[idx3+2] - sPos[idx3+2]) * 0.05;
                    sCol[idx3] *= 0.95; sCol[idx3+1] *= 0.95; sCol[idx3+2] *= 0.95; // Гаснут
                }
                swarmGeo.attributes.position.needsUpdate = true;
                swarmGeo.attributes.color.needsUpdate = true;
            }
            composer.render();
        }
        animate();
    </script>
