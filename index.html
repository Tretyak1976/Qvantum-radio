<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Radio 3D - Infinite Symbiosis (10/10)</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; 
            background-color: #000000 !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; 
        }
        
        :fullscreen, ::backdrop, :-webkit-full-screen { background-color: #000000 !important; }

        #canvas-container { width: 100vw; height: 100dvh; position: fixed; top: 0; left: 0; z-index: 1; cursor: grab; background-color: #000000; }
        #canvas-container:active { cursor: grabbing; }
        
        #fullscreen-btn-top-left {
            position: fixed; top: 20px; left: 20px; z-index: 15;
            background: rgba(10, 10, 15, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: #fff; cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.3s; padding: 0; outline: none;
        }
        #fullscreen-btn-top-left:hover { background: rgba(59, 130, 246, 0.4); transform: scale(1.1); }

        #ui-bottom {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 700px; z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #ui-bottom.idle { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }

        #player-panel {
            width: 100%; background: rgba(10, 10, 15, 0.85); padding: 15px 20px; border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); box-sizing: border-box;
            display: flex; flex-direction: column; gap: 12px;
        }

        #sidebar {
            position: fixed; top: 0; left: 0; width: 350px; height: 100%;
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20; display: flex; flex-direction: column;
            transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.7); box-sizing: border-box;
        }
        #sidebar.open { transform: translateX(0); }

        #sidebar-header {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 1.1rem; color: #3b82f6; letter-spacing: 1px;
        }
        
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0; outline: none; transition: color 0.2s; }
        .close-btn:hover { color: #ef4444; }

        #playlist { flex: 1; overflow-y: auto; padding: 10px; transition: opacity 0.3s; }
        
        .track-item { 
            display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; transition: background 0.2s; font-size: 0.9rem; margin-bottom: 4px;
        }
        .track-item:hover { background: rgba(255,255,255,0.05); }
        .track-item.active { background: rgba(59, 130, 246, 0.1); border-color: transparent; font-weight: bold; }
        
        .track-play-icon {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.08); color: #aaa; cursor: pointer;
            margin-right: 15px; font-size: 1.1rem; transition: all 0.2s;
        }
        .track-play-icon:hover { background: rgba(59, 130, 246, 0.3); color: #fff; transform: scale(1.1); }
        .track-item.active .track-play-icon { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .track-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eee; }
        
        .fav-btn { font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; padding: 5px; margin-left: 10px; }
        .fav-btn:hover { transform: scale(1.3); }

        #progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 0.75rem; color: #aaa; font-weight: 600; }
        
        input[type="range"] { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 10px rgba(59,130,246,0.8); }

        #controls-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

        select, .btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(59, 130, 246, 0.3);
            color: white; padding: 10px 14px; border-radius: 20px;
            outline: none; cursor: pointer; transition: all 0.3s; font-weight: bold;
            font-size: 0.8rem; text-transform: uppercase;
        }
        
        select { flex: 1; min-width: 100px; text-overflow: ellipsis; }
        select option { background: #111; color: #fff; }
        
        .btn.icon { display: flex; align-items: center; justify-content: center; min-width: 40px; font-size: 1.1rem; }
        #play-pause-btn { font-size: 1.3rem; min-width: 50px; background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        
        select:hover, .btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }

        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #ui-bottom { bottom: 15px; width: 95%; }
            #player-panel { padding: 12px 15px; border-radius: 20px; }
            select { padding: 10px; font-size: 0.7rem; }
            .btn.icon { padding: 10px; font-size: 1.1rem; min-width: 35px; }
            #play-pause-btn { min-width: 45px; }
            #playlist-container { max-height: 25vh; }
        }
    </style>
</head>
<body>

    <button id="fullscreen-btn-top-left" title="На весь экран">⛶</button>

    <div id="sidebar">
        <div id="sidebar-header">
            <span>QUANTUM PLAYLIST</span>
            <button id="close-sidebar" class="close-btn" title="Закрыть плейлист">✕</button>
        </div>
        <div id="playlist">
            <div style="padding: 20px; color: #aaa; text-align: center;">Syncing with Global Core...</div>
        </div>
    </div>

    <div id="ui-bottom">
        <div id="player-panel">
            <div id="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="time-total">0:00</span>
            </div>

            <div id="controls-bar">
                <button id="toggle-sidebar-btn" class="btn icon" title="Открыть плейлист">☰</button>
                <select id="genre-filter"><option value="all">Loading...</option></select>
                
                <label class="btn icon" title="Upload Local Track">
                    ⇧ <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
                </label>
                
                <div style="display: flex; gap: 8px;">
                    <button id="prev-btn" class="btn icon" title="Previous Track">⏮</button>
                    <button id="play-pause-btn" class="btn icon" title="Play/Pause">▶</button>
                    <button id="next-btn" class="btn icon" title="Next Track">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ==========================================
        // ГЛОБАЛЬНЫЙ КОНФИГУРАТОР СИМБИОЗА (10/10)
        // ==========================================
        const CONFIG = {
            audio: {
                smoothing: 0.82,
                bassSens: 1.4,     // Глобальная пульсация и макро-искажения
                midSens: 1.1,      // Натяжение линий
                trebleSens: 1.8,   // Микро-реакции, отскоки
                attack: 0.45,      // Мгновенная реакция на пик
                release: 0.05      // Плавное затухание (убирает дерганость)
            },
            motion: {
                baseSpeed: 0.08,   // Скорость дыхания в тишине
                peakSpeed: 2.5,    // Скорость на мощном дропе
                breathAmp: 1.8     // Амплитуда "дыхания" в покое
            },
            render: {
                bloomThreshold: 0.15,
                bloomStrength: 1.2,
                bloomRadius: 0.5,
                particleSize: 1.4,
                lineOpacity: 0.35
            },
            palettes: [
                [0x00f0ff, 0x0055ff, 0x8a2be2, 0xff0055], // Cyberpunk
                [0x00ffaa, 0x0088ff, 0x0000ff, 0x5500ff], // Bio-Ocean
                [0xff3300, 0xffaa00, 0xff0055, 0x440000], // Solar Flare
                [0xffffff, 0xaaaaff, 0x00aaff, 0x002255]  // Ethereal Quantum
            ]
        };

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-mIMwHe0AAz1xQxxmklBJFTkfRxhGDcllBKjYs3J8N77RvbROOlapD7YpiOgoBLQ/exec"; 

        // --- УПРАВЛЕНИЕ UI И ПЛЕЕРОМ ---
        let uiTimeout;
        const uiLayer = document.getElementById('ui-bottom');
        const sidebar = document.getElementById('sidebar');
        const fullscreenBtnTopLeft = document.getElementById('fullscreen-btn-top-left');
        
        function resetUiTimer() {
            uiLayer.classList.remove('idle');
            fullscreenBtnTopLeft.style.opacity = '1';
            fullscreenBtnTopLeft.style.pointerEvents = 'auto';
            document.body.style.cursor = 'default';
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => { 
                if (isPlaying && !sidebar.classList.contains('open')) { 
                    uiLayer.classList.add('idle'); 
                    fullscreenBtnTopLeft.style.opacity = '0';
                    fullscreenBtnTopLeft.style.pointerEvents = 'none';
                    document.body.style.cursor = 'none'; 
                } 
            }, 3000);
        }
        
        window.addEventListener('mousemove', resetUiTimer);
        window.addEventListener('touchstart', resetUiTimer, {passive: true});
        window.addEventListener('click', resetUiTimer);

        document.getElementById('toggle-sidebar-btn').onclick = () => { sidebar.classList.add('open'); resetUiTimer(); };
        document.getElementById('close-sidebar').onclick = () => { sidebar.classList.remove('open'); resetUiTimer(); };
        fullscreenBtnTopLeft.onclick = () => {
            let docEl = document.documentElement;
            if (!document.fullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen().catch(e => {});
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(e => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            resetUiTimer();
        };

        let audioContext, analyser, dataArray, timeDataArray;
        let audioElement = new Audio();
        audioElement.crossOrigin = "anonymous"; 
        
        let isPlaying = false, isPreloadingNext = false, isLoadingTrack = false;
        let loadingTimer = null, countdownValue = 10;
        let fullPlaylist = [], currentPlaylist = [], currentPlayingTrack = null;
        const audioCache = {}; 
        let favorites = JSON.parse(localStorage.getItem('quantum_favorites')) || [];

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048; 
            analyser.smoothingTimeConstant = CONFIG.audio.smoothing; 
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser); analyser.connect(audioContext.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            timeDataArray = new Uint8Array(analyser.fftSize);
        }

        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                progressBar.max = audioElement.duration;
                progressBar.value = audioElement.currentTime;
                timeCurrent.innerText = formatTime(audioElement.currentTime);
                timeTotal.innerText = formatTime(audioElement.duration);
                
                let timeLeft = audioElement.duration - audioElement.currentTime;
                if (timeLeft < 15 && currentPlaylist.length > 1 && !isPreloadingNext) {
                    let currentIdx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
                    let nextTrack = currentPlaylist[(currentIdx + 1) % currentPlaylist.length];
                    if (!nextTrack.isLocal && nextTrack.url.includes("script.google.com") && !audioCache[nextTrack.url]) {
                        isPreloadingNext = true; 
                        fetch(nextTrack.url).then(res => res.json()).then(data => {
                            if (!data.error && data.base64) audioCache[nextTrack.url] = data.base64; 
                        }).catch(e => console.error(e));
                    }
                }
            }
        });

        progressBar.addEventListener('input', () => {
            if(audioElement.duration) audioElement.currentTime = progressBar.value;
            resetUiTimer();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            if (APPS_SCRIPT_URL === "ВСТАВЬ_ССЫЛКУ_СЮДА") return;
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                fullPlaylist = data; currentPlaylist = [...fullPlaylist];
                const genres = [...new Set(fullPlaylist.map(t => t.genre).filter(Boolean))];
                const filterSelect = document.getElementById('genre-filter');
                filterSelect.innerHTML = '<option value="all">ALL GENRES</option><option value="favorites">❤ FAVORITES</option>';
                genres.forEach(g => {
                    const opt = document.createElement('option'); opt.value = g; opt.innerText = g.toUpperCase();
                    filterSelect.appendChild(opt);
                });
                updatePlaylistUI();
                if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
            } catch (err) {
                document.getElementById('playlist').innerHTML = '<div style="color:#ef4444; padding:10px; text-align:center;">Database connection failed.</div>';
            }
        });

        document.getElementById('genre-filter').addEventListener('change', (e) => {
            if (isLoadingTrack) return; 
            const selectedGenre = e.target.value;
            if (selectedGenre === 'all') currentPlaylist = [...fullPlaylist];
            else if (selectedGenre === 'favorites') currentPlaylist = fullPlaylist.filter(t => favorites.includes(t.url));
            else currentPlaylist = fullPlaylist.filter(t => t.genre === selectedGenre);
            updatePlaylistUI();
            if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
            else { audioElement.pause(); isPlaying = false; document.getElementById('play-pause-btn').innerText = "▶"; }
            resetUiTimer();
        });

        document.getElementById('audio-upload').onchange = (e) => {
            if (isLoadingTrack) return;
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const localUrl = URL.createObjectURL(file);
                fullPlaylist.unshift({ name: file.name.substring(0, 30) + '...', genre: "LOCAL", url: localUrl, isLocal: true }); 
                const filter = document.getElementById('genre-filter');
                if(filter.value !== 'all') { filter.value = 'all'; filter.dispatchEvent(new Event('change')); }
                else { currentPlaylist = [...fullPlaylist]; updatePlaylistUI(); playTrack(currentPlaylist[0]); }
                e.target.value = ''; resetUiTimer();
            }
        };

        const playBtn = document.getElementById('play-pause-btn');

        function playNext() {
            if (isLoadingTrack || !currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            playTrack(currentPlaylist[(idx + 1) % currentPlaylist.length]);
        }
        function playPrev() {
            if (isLoadingTrack || !currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            let prevIdx = (idx - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrack(currentPlaylist[prevIdx]);
        }

        document.getElementById('next-btn').onclick = () => { playNext(); resetUiTimer(); };
        document.getElementById('prev-btn').onclick = () => { playPrev(); resetUiTimer(); };
        audioElement.addEventListener('ended', playNext);

        async function playTrack(track) {
            if (isLoadingTrack) return; 

            currentPlayingTrack = track;
            initAudio(); 
            if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            
            seedTrackEvolution();
            isPreloadingNext = false; 

            isLoadingTrack = true; countdownValue = 10;
            playBtn.innerHTML = `<span style="color:#ef4444;">${countdownValue}</span>`;
            updatePlaylistUI(); 
            
            clearInterval(loadingTimer);
            loadingTimer = setInterval(() => {
                if (countdownValue > 1) {
                    countdownValue--; playBtn.innerHTML = `<span style="color:#ef4444;">${countdownValue}</span>`; updatePlaylistUI();
                }
            }, 1000);
            
            try {
                if (!track.isLocal && track.url.includes("script.google.com")) {
                     if (audioCache[track.url]) audioElement.src = audioCache[track.url];
                     else {
                         const response = await fetch(track.url); const data = await response.json();
                         if (data.error || !data.base64) throw new Error("Load error");
                         audioElement.src = data.base64; audioCache[track.url] = data.base64; 
                     }
                } else { audioElement.src = track.url; }

                clearInterval(loadingTimer); isLoadingTrack = false;

                let playPromise = audioElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true; playBtn.innerText = "❚❚"; updatePlaylistUI(); resetUiTimer();
                    }).catch(error => {
                        isPlaying = false; playBtn.innerText = "▶"; updatePlaylistUI();
                        document.body.addEventListener('click', function resumeAutoplay() {
                            if(!isPlaying) { audioContext.resume(); audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; updatePlaylistUI(); }
                            document.body.removeEventListener('click', resumeAutoplay);
                        }, {once: true});
                    });
                }
            } catch (error) {
                clearInterval(loadingTimer); isLoadingTrack = false;
                playBtn.innerText = "⚠"; setTimeout(() => playNext(), 2000);
            }
        }

        function updatePlaylistUI() {
            const playlistDiv = document.getElementById('playlist');
            playlistDiv.innerHTML = '';
            
            if (isLoadingTrack) { playlistDiv.style.pointerEvents = 'none'; playlistDiv.style.opacity = '0.7'; } 
            else { playlistDiv.style.pointerEvents = 'auto'; playlistDiv.style.opacity = '1'; }
            
            if (currentPlaylist.length === 0) { playlistDiv.innerHTML = '<div style="padding:10px; color:#aaa; text-align:center;">No tracks found</div>'; return; }

            currentPlaylist.forEach((track) => {
                const trackEl = document.createElement('div'); trackEl.className = 'track-item';
                const isActive = (currentPlayingTrack && currentPlayingTrack.url === track.url);
                if (isActive) trackEl.classList.add('active');
                
                const playIconBtn = document.createElement('div'); playIconBtn.className = 'track-play-icon';
                
                if (isActive && isLoadingTrack) playIconBtn.innerHTML = `<span style="font-size:1.1rem; color:#ef4444; font-weight:bold;">${countdownValue}</span>`;
                else playIconBtn.innerHTML = (isActive && isPlaying) ? '❚❚' : '▶';

                playIconBtn.onclick = (e) => {
                    e.stopPropagation(); if (isLoadingTrack) return;
                    if (isActive) {
                        if (isPlaying) { audioElement.pause(); isPlaying = false; }
                        else { audioElement.play(); isPlaying = true; }
                        updatePlaylistUI(); playBtn.innerText = isPlaying ? "❚❚" : "▶";
                    } else playTrack(track);
                    resetUiTimer();
                };
                
                const titleSpan = document.createElement('span'); titleSpan.className = 'track-title'; titleSpan.innerHTML = track.name; 
                const favBtn = document.createElement('span'); const isFav = favorites.includes(track.url);
                favBtn.className = 'fav-btn'; favBtn.innerText = isFav ? '♥' : '♡'; favBtn.style.color = isFav ? '#ef4444' : '#aaa';
                favBtn.onclick = (e) => {
                    e.stopPropagation(); if (isLoadingTrack) return;
                    if (isFav) favorites = favorites.filter(url => url !== track.url); else favorites.push(track.url);
                    localStorage.setItem('quantum_favorites', JSON.stringify(favorites));
                    if (document.getElementById('genre-filter').value === 'favorites' && isFav) currentPlaylist = currentPlaylist.filter(t => t.url !== track.url);
                    updatePlaylistUI(); 
                };

                trackEl.appendChild(playIconBtn); trackEl.appendChild(titleSpan); trackEl.appendChild(favBtn);
                playlistDiv.appendChild(trackEl);
            });
        }

        playBtn.onclick = async () => {
            if (isLoadingTrack) return; 
            initAudio(); if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            if (isPlaying) { audioElement.pause(); isPlaying = false; playBtn.innerText = "▶"; } 
            else {
                if (!audioElement.src || audioElement.src.endsWith(window.location.host + "/")) { if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]); } 
                else { await audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; }
            }
            updatePlaylistUI(); resetUiTimer();
        };

        // =========================================================================
        // 3D SCENE & THE MASTERPIECE DANCE ENGINE (CPU Optimized)
        // =========================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.0025);

        const baseFov = 50;
        const camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 10, 55); 

        // Идеальный рендерер без "мыла"
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Кристальная резкость
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.minDistance = 20; controls.maxDistance = 150;

        const renderScene = new THREE.RenderPass(scene, camera);
        
        // Оптимальный Bloom для неонового свечения без засветки
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), CONFIG.render.bloomStrength, CONFIG.render.bloomRadius, CONFIG.render.bloomThreshold);

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene); composer.addPass(bloomPass);

        const globeGroup = new THREE.Group(); scene.add(globeGroup);
        
        // Матрица Фигуры
        const gridDim = 48; const pCount = gridDim * gridDim;
        const pOrig = new Float32Array(pCount * 3); const pPos = new Float32Array(pCount * 3); const pColor = new Float32Array(pCount * 3); const lineIndices = [];

        for(let i=0; i<gridDim; i++){
            for(let j=0; j<gridDim; j++){
                let idx = i*gridDim + j;
                if (j < gridDim - 1) lineIndices.push(idx, idx + 1);
                if (i < gridDim - 1) lineIndices.push(idx, idx + gridDim);
                let u = (j / (gridDim - 1)) * Math.PI * 2; let v = (i / (gridDim - 1)) * Math.PI; 
                pOrig[idx*3] = pPos[idx*3] = 10.3 * Math.cos(u) * Math.sin(v); 
                pOrig[idx*3+1] = pPos[idx*3+1] = 10.3 * Math.cos(v); 
                pOrig[idx*3+2] = pPos[idx*3+2] = 10.3 * Math.sin(u) * Math.sin(v);
            }
        }

        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); 
        pGeo.setAttribute('color', new THREE.BufferAttribute(pColor, 3)); 
        pGeo.setIndex(lineIndices);

        // Чёткие точки с ярким ядром (Фикс проблемы "мутного стекла")
        const pCanvas = document.createElement('canvas'); pCanvas.width = 32; pCanvas.height = 32; 
        const pCtx = pCanvas.getContext('2d'); const pGrad = pCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        pGrad.addColorStop(0, 'rgba(255,255,255,1)'); pGrad.addColorStop(0.3, 'rgba(255,255,255,0.85)'); pGrad.addColorStop(1, 'rgba(0,0,0,0)'); 
        pCtx.fillStyle = pGrad; pCtx.fillRect(0,0,32,32);
        const particleTexture = new THREE.CanvasTexture(pCanvas);

        const quantumPoints = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: CONFIG.render.particleSize, map: particleTexture, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        const quantumLines = new THREE.LineSegments(pGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: CONFIG.render.lineOpacity, blending: THREE.AdditiveBlending, depthWrite: false }));
        globeGroup.add(quantumPoints); globeGroup.add(quantumLines);

        // ВЕРТИКАЛЬНЫЕ ЛАЗЕРЫ
        const laserGroup = new THREE.Group(); const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        for(let i=0; i<80; i++) {
            const laser = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 10, 0), new THREE.Vector3(0, 250, 0)]), laserMat.clone());
            const phi = Math.acos(-1 + (2 * i) / 80); const theta = Math.sqrt(80 * Math.PI) * phi;
            laser.rotation.set(phi, theta, 0); 
            laser.userData = { phase: Math.random() * Math.PI * 2, speed: 0.01 + Math.random() * 0.02, basex: phi, basey: theta };
            laserGroup.add(laser);
        }
        globeGroup.add(laserGroup);

        // ОРБИТАЛЬНЫЕ КОЛЬЦА
        const radioWavesGroup = new THREE.Group(); globeGroup.add(radioWavesGroup);
        const radioRings = [];
        for(let i=0; i<4; i++) {
            const ringMesh = new THREE.LineLoop(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(256 * 3), 3)), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending }));
            ringMesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
            radioRings.push({ mesh: ringMesh, baseRadius: 10.4 + i*0.8, speed: (Math.random()-0.5)*0.016 }); radioWavesGroup.add(ringMesh);
        }

        const strobeLight = new THREE.AmbientLight(0xffffff, 0); scene.add(strobeLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0); sunLight.position.set(50, 20, 30); scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x04040a, 1.8)); // Глубокий космос

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); if(composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // -------------------------------------------------------------------------
        // МАТЕМАТИКА ЭВОЛЮЦИИ И БИО-ГАРМОНИИ
        // -------------------------------------------------------------------------
        let trackSeedR = 1.0, trackSeedFreqU = 2.0, trackSeedFreqV = 3.0, trackSeedMorph = 1.0, trackSeedTwistSpeed = 1.0;
        let currentPaletteIdx = 0, targetPaletteIdx = 0, paletteLerp = 0;
        const c1 = new THREE.Color(), c2 = new THREE.Color(), c3 = new THREE.Color(), c4 = new THREE.Color();

        function seedTrackEvolution() {
            trackSeedR = 12 + Math.random() * 10;
            trackSeedFreqU = 1.0 + Math.random() * 5.0;
            trackSeedFreqV = 1.0 + Math.random() * 5.0;
            trackSeedMorph = 0.5 + Math.random() * 1.5;
            trackSeedTwistSpeed = 0.5 + Math.random() * 2.0;
            
            // Смена палитры
            targetPaletteIdx = (targetPaletteIdx + 1) % CONFIG.palettes.length;
            paletteLerp = 0;
        }
        
        // Начальная установка цвета
        c1.setHex(CONFIG.palettes[0][0]); c2.setHex(CONFIG.palettes[0][1]);
        c3.setHex(CONFIG.palettes[0][2]); c4.setHex(CONFIG.palettes[0][3]);

        let sBass = 0, sMid = 0, sTreble = 0;
        let evolveBass = 0, evolveMid = 0, evolveTreble = 0;
        let beatThreshold = 0.5;
        let targetRotX = 0.001, targetRotY = 0.002, targetRotZ = 0.001;
        let currentRotX = 0.001, currentRotY = 0.002, currentRotZ = 0.001;

        function animate() {
            requestAnimationFrame(animate); controls.update(); const t = Date.now() * 0.001;

            let energy = 0, fSharpTotal = 0;

            // 1. АУДИО АНАЛИЗ (Разбивка частот)
            if (isPlaying && analyser && dataArray && timeDataArray) {
                analyser.getByteFrequencyData(dataArray); analyser.getByteTimeDomainData(timeDataArray);
                let bass = 0, mid = 0, treble = 0, centroid = 0, weightSum = 0;
                const binCount = analyser.frequencyBinCount;
                for(let i=0; i<binCount; i++) {
                    let val = dataArray[i] / 255.0; energy += val;
                    if(i < 20) bass += val; else if(i < 180) mid += val; else treble += val; 
                }
                bass /= 20; mid /= 160; treble /= (binCount - 180); energy /= binCount; 
                
                // Чувствительность
                const rawSharpBass = Math.pow(bass, 1.8) * CONFIG.audio.bassSens; 
                const rawSharpMid = Math.pow(mid, 1.5) * CONFIG.audio.midSens; 
                const rawSharpTreble = Math.pow(treble, 1.8) * CONFIG.audio.trebleSens;

                // Сглаживание Attack / Release
                sBass += (rawSharpBass > sBass ? CONFIG.audio.attack : CONFIG.audio.release) * (rawSharpBass - sBass);
                sMid += (rawSharpMid > sMid ? CONFIG.audio.attack : CONFIG.audio.release) * (rawSharpMid - sMid);
                sTreble += (rawSharpTreble > sTreble ? CONFIG.audio.attack : CONFIG.audio.release) * (rawSharpTreble - sTreble);
            } else {
                sBass += (0 - sBass) * CONFIG.audio.release;
                sMid += (0 - sMid) * CONFIG.audio.release;
                sTreble += (0 - sTreble) * CONFIG.audio.release;
                energy = 0;
            }

            // 2. ДИНАМИКА ВРЕМЕНИ (Тишина = Дыхание, Бит = Скорость)
            let currentSpeed = CONFIG.motion.baseSpeed + sBass * CONFIG.motion.peakSpeed;
            evolveBass += currentSpeed * 0.02 * trackSeedTwistSpeed; 
            evolveMid += currentSpeed * 0.03 * trackSeedTwistSpeed; 
            evolveTreble += currentSpeed * 0.04;
            
            // 3. BLOOM & КАМЕРА
            if (bloomPass) {
                bloomPass.strength += ((CONFIG.render.bloomStrength * 0.5 + energy * 1.5 + sTreble * 2.0 + sBass) - bloomPass.strength) * 0.1;
            }
            camera.fov += ((baseFov - sBass * 15) - camera.fov) * 0.2;
            camera.updateProjectionMatrix();

            // 4. ТАНЕЦ ВРАЩЕНИЯ (Гравитационные рывки)
            beatThreshold = Math.max(0.2, beatThreshold * 0.95); 
            if (sBass > beatThreshold) { 
                beatThreshold = Math.min(1.0, sBass * 1.2); 
                targetRotX = (Math.random() - 0.5) * 0.08 * sBass; 
                targetRotY = (Math.random() - 0.5) * 0.10 * sBass; 
                targetRotZ = (Math.random() - 0.5) * 0.05 * sBass;
            }
            currentRotX += (targetRotX - currentRotX) * 0.05; 
            currentRotY += (targetRotY - currentRotY) * 0.05; 
            currentRotZ += (targetRotZ - currentRotZ) * 0.05;
            globeGroup.rotation.x += currentRotX; 
            globeGroup.rotation.y += currentRotY; 
            globeGroup.rotation.z += currentRotZ;

            // 5. ПЛАВНЫЙ МОРФИНГ ПАЛИТР (Без дерганий)
            paletteLerp += (1.0 - paletteLerp) * 0.01;
            if (paletteLerp > 0.99 && Math.random() < 0.001) {
                targetPaletteIdx = (targetPaletteIdx + 1) % CONFIG.palettes.length;
                paletteLerp = 0;
            }
            const pCur = CONFIG.palettes[currentPaletteIdx];
            const pTar = CONFIG.palettes[targetPaletteIdx];
            c1.setHex(pCur[0]).lerp(new THREE.Color(pTar[0]), paletteLerp);
            c2.setHex(pCur[1]).lerp(new THREE.Color(pTar[1]), paletteLerp);
            c3.setHex(pCur[2]).lerp(new THREE.Color(pTar[2]), paletteLerp);
            c4.setHex(pCur[3]).lerp(new THREE.Color(pTar[3]), paletteLerp);

            // 6. СИНТЕЗ ФОРМЫ И ЦВЕТА
            const positions = quantumPoints.geometry.attributes.position.array; 
            const colors = quantumPoints.geometry.attributes.color.array;
            
            let freqU = trackSeedFreqU + Math.sin(evolveMid * 0.1) * 3.0; 
            let freqV = trackSeedFreqV + Math.cos(evolveBass * 0.1) * 3.0; 
            let shapeChaos = Math.sin(evolveTreble * 0.2) * trackSeedMorph;

            for(let i=0; i<gridDim; i++) {
                for(let j=0; j<gridDim; j++) {
                    let idx = i*gridDim + j; 
                    let u = (j / (gridDim - 1)) * Math.PI * 2; 
                    let v = (i / (gridDim - 1)) * Math.PI;
                    
                    let audioIdx = Math.floor((idx / pCount) * 1024 * 0.5); 
                    let rawF = isPlaying ? (dataArray[audioIdx] / 255.0) : 0; 
                    let fSharp = Math.pow(rawF, 2); 
                    let waveRipple = isPlaying ? (timeDataArray[audioIdx]/128.0 - 1.0) : 0; 
                    
                    let tx = pOrig[idx*3], ty = pOrig[idx*3+1], tz = pOrig[idx*3+2];

                    // Базовая геометрия из Индекса 6
                    let R = trackSeedR + sBass * 20 + Math.sin(v * freqV + evolveMid * 0.5) * (6 + sMid * 15 * CONFIG.audio.midSens);
                    let twist = u + Math.sin(v * freqU + evolveTreble * 0.4) * (Math.sin(evolveBass * 0.3) * 3.5 * trackSeedMorph);
                    let flare = Math.abs(Math.cos(u * (3 + shapeChaos * 2) + t * 0.5)) * (8 + sTreble * 20);
                    
                    // Непрерывное дыхание в тишине (Organism Idle)
                    let idleBreathe = Math.sin(u * 2 + t) * Math.cos(v * 2 + t * 0.8) * CONFIG.motion.breathAmp;
                    let currentRadius = R + flare + (fSharp * 15) + idleBreathe;

                    tx = Math.cos(twist) * Math.sin(v) * currentRadius;
                    tz = Math.sin(twist) * Math.sin(v) * currentRadius;
                    
                    let yVolume = Math.cos(v) * currentRadius * (0.65 + shapeChaos * 0.35); 
                    let yDrift = Math.cos(v * freqV + t * 0.2) * (12 + shapeChaos * 8);
                    ty = yVolume + yDrift + Math.sin(u * freqU + evolveMid) * (4 + sTreble * 22);

                    // Сырая волна для трепетания кожи на высоких
                    let rippleForce = waveRipple * (4 + sTreble * 25); 
                    tx += Math.cos(v * 15 + t) * rippleForce; 
                    ty += Math.sin(u * 15 + t) * rippleForce; 
                    tz += Math.cos(u * 15 + t) * rippleForce;

                    // Плавный отзывчивый Lerp
                    let lerpFactor = fSharp > 0.4 ? 0.35 : (0.05 + sMid * 0.1); 
                    if(!isPlaying && energy <= 0.01) lerpFactor = 0.02; // Сон
                    
                    positions[idx*3]   += (tx - positions[idx*3])   * lerpFactor; 
                    positions[idx*3+1] += (ty - positions[idx*3+1]) * lerpFactor; 
                    positions[idx*3+2] += (tz - positions[idx*3+2]) * lerpFactor;
                    
                    // БЕСШОВНОЕ СМЕШИВАНИЕ ЦВЕТОВ (Процессорный шейдер)
                    let mixX = Math.sin(positions[idx*3] * 0.03 + evolveMid) * 0.5 + 0.5;
                    let mixY = Math.cos(positions[idx*3+1] * 0.03 - evolveTreble) * 0.5 + 0.5;
                    
                    let rA = c1.r + (c2.r - c1.r) * mixX; let gA = c1.g + (c2.g - c1.g) * mixX; let bA = c1.b + (c2.b - c1.b) * mixX;
                    let rB = c3.r + (c4.r - c3.r) * mixY; let gB = c3.g + (c4.g - c3.g) * mixY; let bB = c3.b + (c4.b - c3.b) * mixY;
                    
                    let finalR = rA + (rB - rA) * fSharp;
                    let finalG = gA + (gB - gA) * fSharp;
                    let finalB = bA + (bB - bA) * fSharp;
                    
                    let brightness = isPlaying ? (0.15 + fSharp * 0.8 + Math.abs(waveRipple) * 0.5 * sTreble) : 0.08;
                    
                    colors[idx*3]   += (finalR * brightness - colors[idx*3])   * lerpFactor; 
                    colors[idx*3+1] += (finalG * brightness - colors[idx*3+1]) * lerpFactor; 
                    colors[idx*3+2] += (finalB * brightness - colors[idx*3+2]) * lerpFactor;
                }
            }
            quantumPoints.geometry.attributes.position.needsUpdate = true; 
            quantumPoints.geometry.attributes.color.needsUpdate = true;
            quantumLines.material.opacity = isPlaying ? Math.min(CONFIG.render.lineOpacity, 0.1 + sMid * 0.4) : 0.05;

            // 7. ЛАЗЕРЫ И КОЛЬЦА
            laserGroup.children.forEach((l, i) => {
                let colMix = (i / 100);
                let lColor = c1.clone().lerp(c3, colMix);
                l.material.color.copy(lColor);
                
                let laserPower = Math.pow(sTreble, 2) * 1.5 + sBass;
                if(sBass > 0.5 || laserPower > 0.4) { 
                    l.material.opacity = Math.min(1.0, laserPower); l.scale.y = 1 + sBass * 2; 
                } else { 
                    l.material.opacity *= 0.85; l.scale.y += (1 - l.scale.y) * 0.1; 
                }
                let choreo = i % 3;
                if (choreo === 0) { l.rotation.x = l.userData.basex + Math.sin(t * l.userData.speed + l.userData.phase) * (0.2 + sBass*0.5); l.rotation.y = l.userData.basey + Math.cos(t * l.userData.speed + l.userData.phase) * (0.2 + sBass*0.5); } 
                else if (choreo === 1) { l.rotation.x = l.userData.basex + Math.sin(t * 0.5) * 0.3; l.rotation.z = Math.cos(t * 0.5) * 0.3; } 
                else { l.rotation.y = l.userData.basey + Math.cos(evolveBass * 0.5) * (0.5 * sBass); }
            });

            if (isBeat && sBass > 0.7) { strobeLight.intensity = 4.0; sunLight.intensity = 3.0; } 
            else { strobeLight.intensity += (0 - strobeLight.intensity) * 0.2; sunLight.intensity += (1.0 - sunLight.intensity) * 0.1; }

            radioRings.forEach((r, idx) => {
                r.mesh.rotation.x += r.speed * (1 + sBass * 5); 
                r.mesh.rotation.y += r.speed * (1 + sMid * 5); 
                const ringPositions = r.mesh.geometry.attributes.position.array;
                
                r.mesh.material.color.copy(idx % 2 === 0 ? c2 : c4);
                r.mesh.material.opacity = isPlaying ? (0.15 + energy) : 0.05;
                
                for(let j=0; j<256; j++) {
                    const angle = (j / 256) * Math.PI * 2; 
                    const freqVal = isPlaying ? dataArray[j*4] / 255.0 : 0; 
                    const waveVal = isPlaying ? (timeDataArray[j*8]/128.0 - 1.0) : 0; 
                    const dynamicRadius = r.baseRadius + Math.pow(freqVal, 2) * (3 + idx) + (waveVal * (1 + sBass*4));
                    
                    let tX = Math.cos(angle) * dynamicRadius; 
                    let tY = Math.sin(angle) * dynamicRadius; 
                    let tZ = Math.sin(angle * (5 + idx*2) + t*5) * (freqVal * 5 + waveVal);
                    
                    let rLerp = isPlaying ? 0.15 : 0.02;
                    ringPositions[j*3] += (tX - ringPositions[j*3]) * rLerp;
                    ringPositions[j*3+1] += (tY - ringPositions[j*3+1]) * rLerp;
                    ringPositions[j*3+2] += (tZ - ringPositions[j*3+2]) * rLerp;
                }
                r.mesh.geometry.attributes.position.needsUpdate = true;
            });

            composer.render();
        }
        animate();
    </script>
