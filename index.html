<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Radio 3D - Infinite Symbiosis</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; 
            background-color: #000000 !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; 
        }
        
        :fullscreen, ::backdrop, :-webkit-full-screen { background-color: #000000 !important; }

        #canvas-container { width: 100vw; height: 100dvh; position: fixed; top: 0; left: 0; z-index: 1; cursor: grab; background-color: #000000; }
        #canvas-container:active { cursor: grabbing; }
        
        /* Нижняя панель управления */
        #ui-bottom {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 700px; z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #ui-bottom.idle { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }

        #player-panel {
            width: 100%; background: rgba(10, 10, 15, 0.85); padding: 15px 20px; border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); box-sizing: border-box;
            display: flex; flex-direction: column; gap: 12px;
        }

        /* Левая панель плейлиста */
        #sidebar {
            position: fixed; top: 0; left: 0; width: 350px; height: 100%;
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20; display: flex; flex-direction: column;
            transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.7); box-sizing: border-box;
        }
        #sidebar.open { transform: translateX(0); }

        #sidebar-header {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 1.1rem; color: #3b82f6; letter-spacing: 1px;
        }
        
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0; outline: none; transition: color 0.2s; }
        .close-btn:hover { color: #ef4444; }

        #playlist { flex: 1; overflow-y: auto; padding: 10px; }
        
        /* Элемент трека - кликабельна только иконка Play! */
        .track-item { 
            display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; transition: background 0.2s; font-size: 0.9rem; margin-bottom: 4px;
        }
        .track-item:hover { background: rgba(255,255,255,0.05); }
        .track-item.active { background: rgba(59, 130, 246, 0.1); border-color: transparent; font-weight: bold; }
        
        .track-play-icon {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.08); color: #aaa; cursor: pointer;
            margin-right: 15px; font-size: 1.1rem; transition: all 0.2s;
        }
        .track-play-icon:hover { background: rgba(59, 130, 246, 0.3); color: #fff; transform: scale(1.1); }
        .track-item.active .track-play-icon { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .track-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eee; }
        
        .fav-btn { font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; padding: 5px; margin-left: 10px; }
        .fav-btn:hover { transform: scale(1.3); }

        #progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 0.75rem; color: #aaa; font-weight: 600; }
        
        input[type="range"] { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 10px rgba(59,130,246,0.8); }

        #controls-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

        select, .btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(59, 130, 246, 0.3);
            color: white; padding: 10px 14px; border-radius: 20px;
            outline: none; cursor: pointer; transition: all 0.3s; font-weight: bold;
            font-size: 0.8rem; text-transform: uppercase;
        }
        
        select { flex: 1; min-width: 100px; text-overflow: ellipsis; }
        select option { background: #111; color: #fff; }
        
        .btn.icon { display: flex; align-items: center; justify-content: center; min-width: 40px; font-size: 1.1rem; }
        #play-pause-btn { font-size: 1.3rem; min-width: 50px; background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        
        select:hover, .btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }

        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #ui-bottom { bottom: 15px; width: 95%; }
            #player-panel { padding: 12px 15px; border-radius: 20px; }
            select { padding: 10px; font-size: 0.7rem; }
            .btn.icon { padding: 10px; font-size: 1.1rem; min-width: 35px; }
            #play-pause-btn { min-width: 45px; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div id="sidebar-header">
            <span>QUANTUM PLAYLIST</span>
            <button id="close-sidebar" class="close-btn" title="Закрыть плейлист">✕</button>
        </div>
        <div id="playlist">
            <div style="padding: 20px; color: #aaa; text-align: center;">Syncing with Global Core...</div>
        </div>
    </div>

    <div id="ui-bottom">
        <div id="player-panel">
            <div id="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="time-total">0:00</span>
            </div>

            <div id="controls-bar">
                <button id="toggle-sidebar-btn" class="btn icon" title="Открыть плейлист">☰</button>
                <select id="genre-filter"><option value="all">Loading...</option></select>
                
                <label class="btn icon" title="Upload Local Track">
                    ⇧ <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
                </label>
                
                <div style="display: flex; gap: 8px;">
                    <button id="prev-btn" class="btn icon" title="Previous Track">⏮</button>
                    <button id="play-pause-btn" class="btn icon" title="Play/Pause">▶</button>
                    <button id="next-btn" class="btn icon" title="Next Track">⏭</button>
                </div>

                <button id="fullscreen-btn" class="btn icon" title="Fullscreen">⛶</button>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <!-- ТУТ НАЧИНАЕТСЯ МАГИЯ (Полностью переписанный JS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ==========================================
        // 1. КОНФИГУРАЦИЯ СИМБИОЗА (10/10)
        // Вынес все главные параметры сюда для удобства
        // ==========================================
        const CONFIG = {
            audio: {
                smoothing: 0.85,
                bassSens: 6.0,     // Глобальная пульсация и макро-деформации
                midSens: 3.5,      // Натяжение и кручение линий
                trebleSens: 7.0,   // Вспышки и микро-вибрации
                attack: 0.45,      // Резкость реакции на пик звука
                release: 0.05      // Плавность затухания (убирает дерганость)
            },
            motion: {
                baseSpeed: 0.2,    // Скорость дыхания фигуры в тишине
                peakSpeed: 2.5,    // Ускорение времени при мощном басе
                autoRotate: 0.8    // Скорость вращения камеры
            },
            render: {
                bloomStrength: 1.5,
                bloomRadius: 0.4,
                bloomThreshold: 0.15,
                particleSize: 18.0, // Размер для вершин
                lineOpacity: 0.35
            },
            // Палитры (Шейдер плавно морфирует между ними при смене трека)
            palettes: [
                [0x00f0ff, 0x0055ff, 0x8a2be2, 0xff0055], // Cyberpunk
                [0x00ffaa, 0x0088ff, 0x0000ff, 0x5500ff], // Bio-Ocean
                [0xff3300, 0xffaa00, 0xff0055, 0x440000], // Solar Flare
                [0xffffff, 0xaaaaff, 0x00aaff, 0x002255]  // Quantum Deep
            ]
        };

        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-mIMwHe0AAz1xQxxmklBJFTkfRxhGDcllBKjYs3J8N77RvbROOlapD7YpiOgoBLQ/exec"; 

        // --- УПРАВЛЕНИЕ UI И ПЛЕЕРОМ (ИЗ ТВОЕЙ ОСНОВЫ, НЕ ТРОГАЛ) ---
        let uiTimeout;
        const uiLayer = document.getElementById('ui-bottom');
        const sidebar = document.getElementById('sidebar');
        
        function resetUiTimer() {
            uiLayer.classList.remove('idle');
            document.body.style.cursor = 'default';
            clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => { 
                if (isPlaying && !sidebar.classList.contains('open')) { 
                    uiLayer.classList.add('idle'); 
                    document.body.style.cursor = 'none'; 
                } 
            }, 3000);
        }
        
        window.addEventListener('mousemove', resetUiTimer);
        window.addEventListener('touchstart', resetUiTimer, {passive: true});
        window.addEventListener('click', resetUiTimer);

        document.getElementById('toggle-sidebar-btn').onclick = () => { sidebar.classList.add('open'); resetUiTimer(); };
        document.getElementById('close-sidebar').onclick = () => { sidebar.classList.remove('open'); resetUiTimer(); };
        document.getElementById('fullscreen-btn').onclick = () => {
            let docEl = document.documentElement;
            if (!document.fullscreenElement) {
                if (docEl.requestFullscreen) docEl.requestFullscreen().catch(e => {});
                else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(e => {});
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
            resetUiTimer();
        };

        let audioContext, analyser, dataArray;
        let audioElement = new Audio();
        audioElement.crossOrigin = "anonymous"; 
        
        let isPlaying = false, fullPlaylist = [], currentPlaylist = [], currentPlayingTrack = null;
        let favorites = JSON.parse(localStorage.getItem('quantum_favorites')) || [];

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048; 
            analyser.smoothingTimeConstant = CONFIG.audio.smoothing; 
            
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser); analyser.connect(audioContext.destination);
            
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        }

        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                progressBar.max = audioElement.duration;
                progressBar.value = audioElement.currentTime;
                timeCurrent.innerText = formatTime(audioElement.currentTime);
                timeTotal.innerText = formatTime(audioElement.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if(audioElement.duration) audioElement.currentTime = progressBar.value;
            resetUiTimer();
        });

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                if (!data.error) {
                    fullPlaylist = data; currentPlaylist = [...fullPlaylist];
                    const genres = [...new Set(fullPlaylist.map(t => t.genre).filter(Boolean))];
                    const filterSelect = document.getElementById('genre-filter');
                    filterSelect.innerHTML = '<option value="all">ALL GENRES</option><option value="favorites">❤ FAVORITES</option>';
                    genres.forEach(g => {
                        const opt = document.createElement('option'); opt.value = g; opt.innerText = g.toUpperCase();
                        filterSelect.appendChild(opt);
                    });
                    updatePlaylistUI();
                    if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
                }
            } catch (err) {
                document.getElementById('playlist').innerHTML = '<div style="color:#ef4444; padding:20px; text-align:center;">Database connection failed.</div>';
            }
        });

        document.getElementById('genre-filter').addEventListener('change', (e) => {
            const selectedGenre = e.target.value;
            if (selectedGenre === 'all') currentPlaylist = [...fullPlaylist];
            else if (selectedGenre === 'favorites') currentPlaylist = fullPlaylist.filter(t => favorites.includes(t.url));
            else currentPlaylist = fullPlaylist.filter(t => t.genre === selectedGenre);
            
            updatePlaylistUI();
            if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
            else { audioElement.pause(); isPlaying = false; document.getElementById('play-pause-btn').innerText = "▶"; }
            resetUiTimer();
        });

        document.getElementById('audio-upload').onchange = (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                const localUrl = URL.createObjectURL(file);
                fullPlaylist.unshift({ name: file.name.substring(0, 30) + '...', genre: "LOCAL", url: localUrl, isLocal: true }); 
                document.getElementById('genre-filter').value = 'all';
                currentPlaylist = [...fullPlaylist]; updatePlaylistUI(); playTrack(currentPlaylist[0]);
                e.target.value = ''; resetUiTimer();
            }
        };

        const playBtn = document.getElementById('play-pause-btn');

        function playNext() {
            if (!currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            playTrack(currentPlaylist[(idx + 1) % currentPlaylist.length]);
        }
        function playPrev() {
            if (!currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            let prevIdx = (idx - 1 + currentPlaylist.length) % currentPlaylist.length;
            playTrack(currentPlaylist[prevIdx]);
        }

        document.getElementById('next-btn').onclick = () => { playNext(); resetUiTimer(); };
        document.getElementById('prev-btn').onclick = () => { playPrev(); resetUiTimer(); };
        audioElement.addEventListener('ended', playNext);

        async function playTrack(track) {
            currentPlayingTrack = track;
            initAudio(); 
            if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            
            // Запускаем перетекание в случайную новую цветовую палитру
            targetPaletteIdx = Math.floor(Math.random() * CONFIG.palettes.length);
            paletteLerp = 0;

            updatePlaylistUI();
            playBtn.innerText = "↻"; 
            
            try {
                if (!track.isLocal && track.url.includes("script.google.com")) {
                     const response = await fetch(track.url); const data = await response.json();
                     audioElement.src = data.base64;
                } else { audioElement.src = track.url; }

                let playPromise = audioElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true; playBtn.innerText = "❚❚";
                        updatePlaylistUI(); resetUiTimer();
                    }).catch(error => {
                        isPlaying = false; playBtn.innerText = "▶"; updatePlaylistUI();
                        document.body.addEventListener('click', function resumeAutoplay() {
                            if(!isPlaying) { audioContext.resume(); audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; updatePlaylistUI(); }
                            document.body.removeEventListener('click', resumeAutoplay);
                        }, {once: true});
                    });
                }
            } catch (error) {
                playBtn.innerText = "⚠"; setTimeout(() => playNext(), 2000);
            }
        }

        function updatePlaylistUI() {
            const playlistDiv = document.getElementById('playlist');
            playlistDiv.innerHTML = '';
            if (currentPlaylist.length === 0) { playlistDiv.innerHTML = '<div style="padding:10px; color:#aaa; text-align:center;">No tracks found</div>'; return; }

            currentPlaylist.forEach((track) => {
                const trackEl = document.createElement('div'); trackEl.className = 'track-item';
                const isActive = (currentPlayingTrack && currentPlayingTrack.url === track.url);
                if (isActive) trackEl.classList.add('active');
                
                const playIconBtn = document.createElement('div'); playIconBtn.className = 'track-play-icon';
                playIconBtn.innerHTML = (isActive && isPlaying) ? '❚❚' : '▶';
                playIconBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (isActive) {
                        if (isPlaying) { audioElement.pause(); isPlaying = false; }
                        else { audioElement.play(); isPlaying = true; }
                        updatePlaylistUI(); playBtn.innerText = isPlaying ? "❚❚" : "▶";
                    } else playTrack(track);
                    resetUiTimer();
                };
                
                const titleSpan = document.createElement('span'); titleSpan.className = 'track-title'; titleSpan.innerHTML = track.name;

                const favBtn = document.createElement('span'); const isFav = favorites.includes(track.url);
                favBtn.className = 'fav-btn'; favBtn.innerText = isFav ? '♥' : '♡'; favBtn.style.color = isFav ? '#ef4444' : '#aaa';
                favBtn.onclick = (e) => {
                    e.stopPropagation();
                    if (isFav) favorites = favorites.filter(url => url !== track.url); else favorites.push(track.url);
                    localStorage.setItem('quantum_favorites', JSON.stringify(favorites));
                    if (document.getElementById('genre-filter').value === 'favorites' && isFav) currentPlaylist = currentPlaylist.filter(t => t.url !== track.url);
                    updatePlaylistUI(); 
                };

                trackEl.appendChild(playIconBtn); trackEl.appendChild(titleSpan); trackEl.appendChild(favBtn);
                playlistDiv.appendChild(trackEl);
            });
        }

        playBtn.onclick = async () => {
            initAudio(); if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            if (isPlaying) { audioElement.pause(); isPlaying = false; playBtn.innerText = "▶"; } 
            else {
                if (!audioElement.src || audioElement.src.endsWith(window.location.host + "/")) { if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]); } 
                else { await audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; }
            }
            updatePlaylistUI(); resetUiTimer();
        };

        // =========================================================================
        // 3D СЦЕНА (ОТПТИМИЗИРОВАННАЯ МАТЕМАТИКА НА GPU)
        // =========================================================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.0035);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 5, 45); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; 
        controls.minDistance = 20; controls.maxDistance = 100;
        controls.autoRotate = true; controls.autoRotateSpeed = CONFIG.motion.rotationSpeed;

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), CONFIG.render.bloomStrength, CONFIG.render.bloomRadius, CONFIG.render.bloomThreshold);
        
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene); composer.addPass(bloomPass);

        // --- ГЕНЕРАЦИЯ ГЕОМЕТРИИ (Формируем органичный "Глобус" из частиц и линий) ---
        const gridDim = 64; // Высокая детализация сетки
        const pCount = gridDim * gridDim;
        const pPos = new Float32Array(pCount * 3); 
        const randoms = new Float32Array(pCount); 
        const lineIndices = [];

        for(let i=0; i<gridDim; i++){
            for(let j=0; j<gridDim; j++){
                let idx = i*gridDim + j;
                if (j < gridDim - 1) lineIndices.push(idx, idx + 1);
                if (i < gridDim - 1) lineIndices.push(idx, idx + gridDim);
                
                let u = (j / (gridDim - 1)) * Math.PI * 2; 
                let v = (i / (gridDim - 1)) * Math.PI; 
                let r = 12.0; // Исходный радиус сферы
                
                pPos[idx*3] = r * Math.cos(u) * Math.sin(v); 
                pPos[idx*3+1] = r * Math.cos(v); 
                pPos[idx*3+2] = r * Math.sin(u) * Math.sin(v);
                
                randoms[idx] = Math.random(); // Случайное смещение для каждой точки
            }
        }

        const baseGeo = new THREE.BufferGeometry();
        baseGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); 
        baseGeo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1)); 
        baseGeo.setIndex(lineIndices);

        // --- GPU ШЕЙДЕРЫ (10/10 Симбиоз Музыки и Математики) ---
        const vertexShader = `
            uniform float uTime;
            uniform float uBass;
            uniform float uMid;
            uniform float uTreble;
            
            attribute float aRandom;
            
            varying vec3 vPos;
            varying float vIntensity;
            
            // Мощный 3D Simplex Noise
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 1.0/7.0;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vec3 pos = position;
                vec3 norm = normalize(pos);

                // 1. Спокойное Дыхание
                float nBase = snoise(pos * 0.15 + uTime * 0.3);

                // 2. БАС: Гравитация и макро-взрывы
                float nBass = snoise(pos * 0.08 - uTime * 0.8) * uBass;
                pos += norm * (nBass * 12.0 + nBase * 2.0);

                // 3. СРЕДНИЕ: Скручивание и натяжение связей
                float nMid = snoise(pos * 0.4 + uTime * 0.5) * uMid;
                pos.x += sin(pos.y * 0.1 + uTime) * nMid * 6.0;
                pos.z += cos(pos.x * 0.1 - uTime) * nMid * 6.0;

                // 4. ВЫСОКИЕ (Скрипки/Хэты): Острые микро-вспышки и трепетание
                float nTreble = snoise(pos * 3.0 + uTime * 2.0) * uTreble;
                pos += norm * nTreble * aRandom * 4.0;

                vPos = pos;
                vIntensity = (nBass * 0.4 + nMid * 0.3 + nTreble * 0.8);

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                
                // IS_POINT позволяет нам использовать этот шейдер И для точек, И для линий без краша
                #ifdef IS_POINT
                    gl_PointSize = (${CONFIG.render.particleSize.toFixed(1)} + uTreble * 25.0 * aRandom) * (20.0 / -mvPosition.z);
                #endif
            }
        `;

        const fragmentShader = `
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uColor4;
            uniform float uTreble;
            uniform float uOpacity;
            
            varying vec3 vPos;
            varying float vIntensity;

            void main() {
                float alpha = uOpacity;
                float core = 0.0;
                
                #ifdef IS_POINT
                    // Кристальная отрисовка точки (жесткий центр + мягкое гало)
                    vec2 coord = gl_PointCoord - vec2(0.5);
                    float dist = length(coord);
                    if (dist > 0.5) discard;
                    alpha = smoothstep(0.5, 0.1, dist);
                    core = smoothstep(0.2, 0.0, dist) * 1.5;
                #endif

                // Динамический морфинг цвета в зависимости от пространственных координат (3D)
                float mix1 = sin(vPos.y * 0.12) * 0.5 + 0.5;
                float mix2 = cos(vPos.x * 0.12) * 0.5 + 0.5;
                
                vec3 colA = mix(uColor1, uColor2, mix1);
                vec3 colB = mix(uColor3, uColor4, mix2);
                
                // Влияние амплитуды звука на цвет (Вспыхивает на пиках)
                float blend = clamp(vIntensity + vPos.z * 0.05, 0.0, 1.0);
                vec3 finalColor = mix(colA, colB, blend);
                
                // Вспышки высоких частот (Скрипка делает точки бело-светящимися)
                finalColor += vec3(core) * (0.3 + uTreble * 2.0);

                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        const uniforms = {
            uTime: { value: 0 },
            uBass: { value: 0 },
            uMid: { value: 0 },
            uTreble: { value: 0 },
            uOpacity: { value: 1.0 },
            uColor1: { value: new THREE.Color(CONFIG.palettes[0][0]) },
            uColor2: { value: new THREE.Color(CONFIG.palettes[0][1]) },
            uColor3: { value: new THREE.Color(CONFIG.palettes[0][2]) },
            uColor4: { value: new THREE.Color(CONFIG.palettes[0][3]) }
        };

        // Материал Точек
        const pointMat = new THREE.ShaderMaterial({
            vertexShader, fragmentShader, uniforms,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
            defines: { IS_POINT: "" } // Секрет обхода бага WebGL
        });

        // Материал Линий (использует тот же шейдер, но без gl_PointSize и gl_PointCoord)
        const lineMat = new THREE.ShaderMaterial({
            vertexShader, fragmentShader,
            uniforms: THREE.UniformsUtils.clone(uniforms),
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
        });
        lineMat.uniforms.uOpacity.value = CONFIG.render.lineOpacity;

        const quantumPoints = new THREE.Points(baseGeo, pointMat);
        const quantumLines = new THREE.LineSegments(baseGeo, lineMat);
        
        scene.add(quantumPoints);
        scene.add(quantumLines);

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); if(composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- ЛОГИКА ЦВЕТА И ФИЗИКИ ВРЕМЕНИ ---
        let currentPaletteIdx = 0, targetPaletteIdx = 0, paletteLerp = 0;
        const c1 = new THREE.Color(), c2 = new THREE.Color(), c3 = new THREE.Color(), c4 = new THREE.Color();
        
        let sBass = 0, sMid = 0, sTreble = 0;
        let shaderTime = 0;

        function animate() {
            requestAnimationFrame(animate); 
            
            // 1. АУДИО АНАЛИЗАТОР (Расщепление на 3 потока)
            if (isPlaying && analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray); 
                
                let b = 0, m = 0, t = 0;
                const bins = analyser.frequencyBinCount;
                
                for(let i=0; i<bins; i++) {
                    let val = dataArray[i] / 255.0;
                    if(i < 15) b += val;          // Sub-bass
                    else if(i < 120) m += val;    // Mids (Вокал, мелодия)
                    else t += val;                // Treble (Скрипки, тарелки)
                }
                b /= 15; m /= 105; t /= (bins - 120);
                
                // Применяем коэффициенты чувствительности
                b = Math.pow(b, 1.8) * CONFIG.audio.bassSens;
                m = Math.pow(m, 1.5) * CONFIG.audio.midSens;
                t = Math.pow(t, 2.0) * CONFIG.audio.trebleSens;

                // Умный Lerp (Attack / Release) для устранения хаоса и дрожи
                sBass += (b > sBass ? CONFIG.audio.attack : CONFIG.audio.release) * (b - sBass);
                sMid += (m > sMid ? CONFIG.audio.attack : CONFIG.audio.release) * (m - sMid);
                sTreble += (t > sTreble ? CONFIG.audio.attack : CONFIG.audio.release) * (t - sTreble);
            } else {
                sBass += (0 - sBass) * CONFIG.audio.release;
                sMid += (0 - sMid) * CONFIG.audio.release;
                sTreble += (0 - sTreble) * CONFIG.audio.release;
            }

            // 2. СКОРОСТЬ ВРЕМЕНИ (Время течет быстрее на битах)
            let currentSpeed = CONFIG.motion.baseSpeed + (sBass * CONFIG.motion.peakSpeed);
            shaderTime += currentSpeed * 0.016;

            // 3. ПЕРЕДАЧА В ШЕЙДЕР
            pointMat.uniforms.uTime.value = shaderTime;
            pointMat.uniforms.uBass.value = sBass;
            pointMat.uniforms.uMid.value = sMid;
            pointMat.uniforms.uTreble.value = sTreble;

            lineMat.uniforms.uTime.value = shaderTime;
            lineMat.uniforms.uBass.value = sBass;
            lineMat.uniforms.uMid.value = sMid;
            lineMat.uniforms.uTreble.value = sTreble;

            // 4. МОРФИНГ ЦВЕТОВЫХ ПАЛИТР
            paletteLerp += (1.0 - paletteLerp) * 0.01; // Очень плавный переход
            if (paletteLerp > 0.99) {
                currentPaletteIdx = targetPaletteIdx;
                paletteLerp = 0;
                // Смена палитры во время воспроизведения (очень редко)
                if (Math.random() < 0.0005) targetPaletteIdx = (targetPaletteIdx + 1) % CONFIG.palettes.length;
            }

            const pCur = CONFIG.palettes[currentPaletteIdx];
            const pTar = CONFIG.palettes[targetPaletteIdx];

            c1.setHex(pCur[0]).lerp(new THREE.Color(pTar[0]), paletteLerp);
            c2.setHex(pCur[1]).lerp(new THREE.Color(pTar[1]), paletteLerp);
            c3.setHex(pCur[2]).lerp(new THREE.Color(pTar[2]), paletteLerp);
            c4.setHex(pCur[3]).lerp(new THREE.Color(pTar[3]), paletteLerp);

            pointMat.uniforms.uColor1.value.copy(c1); pointMat.uniforms.uColor2.value.copy(c2);
            pointMat.uniforms.uColor3.value.copy(c3); pointMat.uniforms.uColor4.value.copy(c4);
            
            lineMat.uniforms.uColor1.value.copy(c1); lineMat.uniforms.uColor2.value.copy(c2);
            lineMat.uniforms.uColor3.value.copy(c3); lineMat.uniforms.uColor4.value.copy(c4);

            // 5. ГРАВИТАЦИЯ И ВРАЩЕНИЕ КАМЕРЫ
            controls.autoRotateSpeed = CONFIG.motion.rotationSpeed + (sBass * 1.5);
            controls.update();

            camera.fov += ((baseFov - sBass * 12.0) - camera.fov) * 0.1;
            camera.updateProjectionMatrix();
            
            if (bloomPass) {
                bloomPass.strength += ((CONFIG.render.bloomStrength + sTreble * 1.5) - bloomPass.strength) * 0.1;
            }

            composer.render();
        }
        
        animate();
    </script>
</body>
</html>
