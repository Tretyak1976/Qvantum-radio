<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Radio 3D - The Human Dance</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; 
            background-color: #000000 !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; 
        }
        :fullscreen, ::backdrop, :-webkit-full-screen { background-color: #000000 !important; }

        #canvas-container { width: 100vw; height: 100dvh; position: fixed; top: 0; left: 0; z-index: 1; cursor: grab; background-color: #000000; }
        #canvas-container:active { cursor: grabbing; }
        
        #fullscreen-btn-top-left {
            position: fixed; top: 20px; left: 20px; z-index: 15;
            background: rgba(10, 10, 15, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: #fff; cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.3s; padding: 0; outline: none;
        }
        #fullscreen-btn-top-left:hover { background: rgba(59, 130, 246, 0.4); transform: scale(1.1); }

        #ui-bottom {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 700px; z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #ui-bottom.idle { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }

        #player-panel {
            width: 100%; background: rgba(10, 10, 15, 0.85); padding: 15px 20px; border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); box-sizing: border-box;
            display: flex; flex-direction: column; gap: 12px;
        }

        #sidebar {
            position: fixed; top: 0; left: 0; width: 350px; height: 100%;
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20; display: flex; flex-direction: column;
            transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.7); box-sizing: border-box;
        }
        #sidebar.open { transform: translateX(0); }

        #sidebar-header {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 1.1rem; color: #3b82f6; letter-spacing: 1px;
        }
        
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0; outline: none; transition: color 0.2s; }
        .close-btn:hover { color: #ef4444; }
        #playlist { flex: 1; overflow-y: auto; padding: 10px; transition: opacity 0.3s; }
        
        .track-item { 
            display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; transition: background 0.2s; font-size: 0.9rem; margin-bottom: 4px;
        }
        .track-item:hover { background: rgba(255,255,255,0.05); }
        .track-item.active { background: rgba(59, 130, 246, 0.1); border-color: transparent; font-weight: bold; }
        
        .track-play-icon {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.08); color: #aaa; cursor: pointer;
            margin-right: 15px; font-size: 1.1rem; transition: all 0.2s;
        }
        .track-play-icon:hover { background: rgba(59, 130, 246, 0.3); color: #fff; transform: scale(1.1); }
        .track-item.active .track-play-icon { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .track-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eee; }
        .fav-btn { font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; padding: 5px; margin-left: 10px; }
        .fav-btn:hover { transform: scale(1.3); }

        #progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 0.75rem; color: #aaa; font-weight: 600; }
        input[type="range"] { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 10px rgba(59,130,246,0.8); }

        #controls-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

        select, .btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(59, 130, 246, 0.3);
            color: white; padding: 10px 14px; border-radius: 20px;
            outline: none; cursor: pointer; transition: all 0.3s; font-weight: bold;
            font-size: 0.8rem; text-transform: uppercase;
        }
        select { flex: 1; min-width: 100px; text-overflow: ellipsis; }
        select option { background: #111; color: #fff; }
        
        .btn.icon { display: flex; align-items: center; justify-content: center; min-width: 40px; font-size: 1.1rem; }
        #play-pause-btn { font-size: 1.3rem; min-width: 50px; background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        select:hover, .btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
    </style>
</head>
<body>

    <button id="fullscreen-btn-top-left" title="На весь экран">⛶</button>

    <div id="sidebar">
        <div id="sidebar-header">
            <span>QUANTUM PLAYLIST</span>
            <button id="close-sidebar" class="close-btn" title="Закрыть плейлист">✕</button>
        </div>
        <div id="playlist"><div style="padding: 20px; color: #aaa; text-align: center;">Syncing with Global Core...</div></div>
    </div>

    <div id="ui-bottom">
        <div id="player-panel">
            <div id="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="time-total">0:00</span>
            </div>

            <div id="controls-bar">
                <button id="toggle-sidebar-btn" class="btn icon" title="Открыть плейлист">☰</button>
                <select id="genre-filter"><option value="all">Loading...</option></select>
                
                <label class="btn icon" title="Upload Local Track">
                    ⇧ <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
                </label>
                
                <div style="display: flex; gap: 8px;">
                    <button id="prev-btn" class="btn icon" title="Previous Track">⏮</button>
                    <button id="play-pause-btn" class="btn icon" title="Play/Pause">▶</button>
                    <button id="next-btn" class="btn icon" title="Next Track">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ==========================================
        // UI & AUDIO SETUP
        // ==========================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-mIMwHe0AAz1xQxxmklBJFTkfRxhGDcllBKjYs3J8N77RvbROOlapD7YpiOgoBLQ/exec"; 

        let uiTimeout;
        const uiLayer = document.getElementById('ui-bottom');
        const sidebar = document.getElementById('sidebar');
        const fullscreenBtnTopLeft = document.getElementById('fullscreen-btn-top-left');
        
        function resetUiTimer() {
            uiLayer.classList.remove('idle');
            fullscreenBtnTopLeft.style.opacity = '1'; fullscreenBtnTopLeft.style.pointerEvents = 'auto';
            document.body.style.cursor = 'default'; clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => { 
                if (isPlaying && !sidebar.classList.contains('open')) { 
                    uiLayer.classList.add('idle'); fullscreenBtnTopLeft.style.opacity = '0';
                    fullscreenBtnTopLeft.style.pointerEvents = 'none'; document.body.style.cursor = 'none'; 
                } 
            }, 3000);
        }
        
        window.addEventListener('mousemove', resetUiTimer);
        window.addEventListener('click', resetUiTimer);
        document.getElementById('toggle-sidebar-btn').onclick = () => { sidebar.classList.add('open'); resetUiTimer(); };
        document.getElementById('close-sidebar').onclick = () => { sidebar.classList.remove('open'); resetUiTimer(); };
        fullscreenBtnTopLeft.onclick = () => {
            let docEl = document.documentElement;
            if (!document.fullscreenElement) { if (docEl.requestFullscreen) docEl.requestFullscreen().catch(e=>{}); } 
            else { if (document.exitFullscreen) document.exitFullscreen(); }
            resetUiTimer();
        };

        let audioContext, analyser, dataArray, timeDataArray;
        let audioElement = new Audio(); audioElement.crossOrigin = "anonymous"; 
        
        let isPlaying = false, isLoadingTrack = false, loadingTimer = null, countdownValue = 10;
        let fullPlaylist = [], currentPlaylist = [], currentPlayingTrack = null;
        const audioCache = {};

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.85; 
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser); analyser.connect(audioContext.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount); timeDataArray = new Uint8Array(analyser.fftSize);
        }

        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function formatTime(s) { if (isNaN(s)) return "0:00"; let m = Math.floor(s/60); let sec = Math.floor(s%60).toString().padStart(2, '0'); return `${m}:${sec}`; }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                progressBar.max = audioElement.duration; progressBar.value = audioElement.currentTime;
                timeCurrent.innerText = formatTime(audioElement.currentTime); timeTotal.innerText = formatTime(audioElement.duration);
            }
        });

        progressBar.addEventListener('input', () => { if(audioElement.duration) audioElement.currentTime = progressBar.value; resetUiTimer(); });

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(APPS_SCRIPT_URL); const data = await response.json();
                fullPlaylist = data; currentPlaylist = [...fullPlaylist];
                const genres = [...new Set(fullPlaylist.map(t => t.genre).filter(Boolean))];
                const filterSelect = document.getElementById('genre-filter');
                filterSelect.innerHTML = '<option value="all">ALL GENRES</option>';
                genres.forEach(g => { const opt = document.createElement('option'); opt.value = g; opt.innerText = g.toUpperCase(); filterSelect.appendChild(opt); });
                updatePlaylistUI();
                if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
            } catch (err) {
                document.getElementById('playlist').innerHTML = '<div style="color:#ef4444; padding:20px; text-align:center;">Database connection failed.</div>';
            }
        });

        const playBtn = document.getElementById('play-pause-btn');

        function playNext() {
            if (isLoadingTrack || !currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            playTrack(currentPlaylist[(idx + 1) % currentPlaylist.length]);
        }
        function playPrev() {
            if (isLoadingTrack || !currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            playTrack(currentPlaylist[(idx - 1 + currentPlaylist.length) % currentPlaylist.length]);
        }
        document.getElementById('next-btn').onclick = () => { playNext(); resetUiTimer(); };
        document.getElementById('prev-btn').onclick = () => { playPrev(); resetUiTimer(); };
        audioElement.addEventListener('ended', playNext);

        async function playTrack(track) {
            if (isLoadingTrack) return; 
            currentPlayingTrack = track; initAudio(); 
            if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            
            isLoadingTrack = true; countdownValue = 10;
            playBtn.innerHTML = `<span style="color:#ef4444;">${countdownValue}</span>`; updatePlaylistUI(); 
            
            clearInterval(loadingTimer);
            loadingTimer = setInterval(() => {
                if (countdownValue > 1) { countdownValue--; playBtn.innerHTML = `<span style="color:#ef4444;">${countdownValue}</span>`; updatePlaylistUI(); }
            }, 1000);
            
            try {
                if (!track.isLocal && track.url.includes("script.google.com")) {
                     if (audioCache[track.url]) { audioElement.src = audioCache[track.url]; } 
                     else {
                         const response = await fetch(track.url); const data = await response.json();
                         if (data.error || !data.base64) throw new Error("Load error");
                         audioElement.src = data.base64; audioCache[track.url] = data.base64; 
                     }
                } else { audioElement.src = track.url; }

                clearInterval(loadingTimer); isLoadingTrack = false;
                let playPromise = audioElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => { isPlaying = true; playBtn.innerText = "❚❚"; updatePlaylistUI(); resetUiTimer(); }).catch(error => {
                        isPlaying = false; playBtn.innerText = "▶"; updatePlaylistUI();
                    });
                }
            } catch (error) { clearInterval(loadingTimer); isLoadingTrack = false; playBtn.innerText = "⚠"; setTimeout(() => playNext(), 2000); }
        }

        function updatePlaylistUI() {
            const playlistDiv = document.getElementById('playlist'); playlistDiv.innerHTML = '';
            if (isLoadingTrack) { playlistDiv.style.pointerEvents = 'none'; playlistDiv.style.opacity = '0.7'; } 
            else { playlistDiv.style.pointerEvents = 'auto'; playlistDiv.style.opacity = '1'; }
            
            currentPlaylist.forEach((track) => {
                const trackEl = document.createElement('div'); trackEl.className = 'track-item';
                const isActive = (currentPlayingTrack && currentPlayingTrack.url === track.url);
                if (isActive) trackEl.classList.add('active');
                
                const playIconBtn = document.createElement('div'); playIconBtn.className = 'track-play-icon';
                if (isActive && isLoadingTrack) playIconBtn.innerHTML = `<span style="font-size:1.1rem; color:#ef4444; font-weight:bold;">${countdownValue}</span>`;
                else playIconBtn.innerHTML = (isActive && isPlaying) ? '❚❚' : '▶';

                playIconBtn.onclick = (e) => { e.stopPropagation(); if (isLoadingTrack) return; 
                    if (isActive) { if (isPlaying) { audioElement.pause(); isPlaying = false; } else { audioElement.play(); isPlaying = true; } updatePlaylistUI(); playBtn.innerText = isPlaying ? "❚❚" : "▶"; } 
                    else { playTrack(track); } resetUiTimer(); 
                };
                
                const titleSpan = document.createElement('span'); titleSpan.className = 'track-title'; titleSpan.innerHTML = track.name; 
                trackEl.appendChild(playIconBtn); trackEl.appendChild(titleSpan); playlistDiv.appendChild(trackEl);
            });
        }

        playBtn.onclick = async () => {
            if (isLoadingTrack) return; initAudio();
            if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            if (isPlaying) { audioElement.pause(); isPlaying = false; playBtn.innerText = "▶"; } 
            else { if (!audioElement.src || audioElement.src.endsWith(window.location.host + "/")) { if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]); } else { await audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; } }
            updatePlaylistUI(); resetUiTimer();
        };

        // ==========================================
        // 3D СЦЕНА И ГЕНЕРАТОР АНАТОМИЧЕСКИХ ТЕЛ
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.003);

        const baseFov = 50;
        const camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 15, 120); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.minDistance = 30; controls.maxDistance = 250;
        controls.target.set(0, 10, 0); 

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene); composer.addPass(bloomPass);

        // Функция математической генерации анатомических частей тела (Голова, Торс, Руки, Ноги/Юбка)
        function createHumanGrid(isFemale) {
            let pos = [], idx = [], uvs = [];
            
            function addPart(type, hSegs, rSegs) {
                let start = pos.length / 3;
                for(let i=0; i<=hSegs; i++) {
                    let v = i / hSegs;
                    for(let j=0; j<rSegs; j++) {
                        let u = j / rSegs;
                        pos.push(0,0,0); // Координаты формируются в animate()
                        uvs.push(u, v, type);
                        
                        if(i < hSegs) {
                            let nextJ = (j + 1) % rSegs;
                            let curr = start + i * rSegs + j;
                            let right = start + i * rSegs + nextJ;
                            let top = start + (i + 1) * rSegs + j;
                            idx.push(curr, right, curr, top);
                        }
                    }
                }
            }
            
            addPart(1, 12, 24); // Голова (type 1)
            addPart(0, 20, 36); // Торс (type 0)
            addPart(2, 15, 16); // Левая рука (type 2)
            addPart(3, 15, 16); // Правая рука (type 3)
            
            if (isFemale) {
                addPart(6, 20, 40); // Платье/Юбка (type 6)
            } else {
                addPart(4, 15, 16); // Левая нога (type 4)
                addPart(5, 15, 16); // Правая нога (type 5)
            }

            let pPos = new Float32Array(pos.length);
            let pColor = new Float32Array(pos.length);
            let pUvs = new Float32Array(uvs);

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(pColor, 3));
            geo.setIndex(idx);
            
            return { geo, pos: pPos, color: pColor, uvs: pUvs, count: pos.length / 3 };
        }

        const danceFloor = new THREE.Group();
        scene.add(danceFloor);

        const pCanvas = document.createElement('canvas'); pCanvas.width = 16; pCanvas.height = 16; 
        const pCtx = pCanvas.getContext('2d'); const pGrad = pCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
        pGrad.addColorStop(0, 'rgba(255,255,255,1)'); pGrad.addColorStop(0.3, 'rgba(255,255,255,0.7)'); pGrad.addColorStop(1, 'rgba(0,0,0,0)'); 
        pCtx.fillStyle = pGrad; pCtx.fillRect(0,0,16,16);
        const pointTexture = new THREE.CanvasTexture(pCanvas);

        // Мужчина
        const maleData = createHumanGrid(false);
        const maleGroup = new THREE.Group();
        const malePoints = new THREE.Points(maleData.geo, new THREE.PointsMaterial({ size: 1.6, map: pointTexture, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        const maleLines = new THREE.LineSegments(maleData.geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
        maleGroup.add(malePoints); maleGroup.add(maleLines);
        danceFloor.add(maleGroup);

        // Женщина
        const femaleData = createHumanGrid(true);
        const femaleGroup = new THREE.Group();
        const femalePoints = new THREE.Points(femaleData.geo, new THREE.PointsMaterial({ size: 1.6, map: pointTexture, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        const femaleLines = new THREE.LineSegments(femaleData.geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false }));
        femaleGroup.add(femalePoints); femaleGroup.add(femaleLines);
        danceFloor.add(femaleGroup);

        const laserGroup = new THREE.Group(); const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        for(let i=0; i<60; i++) {
            const laser = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -10, 0), new THREE.Vector3(0, 250, 0)]), laserMat.clone());
            const phi = Math.acos(-1 + (2 * i) / 60); const theta = Math.sqrt(60 * Math.PI) * phi;
            laser.rotation.set(phi, theta, 0); 
            laser.userData = { phase: Math.random() * Math.PI * 2, speed: 0.015 + Math.random() * 0.02, basex: phi, basey: theta };
            laserGroup.add(laser);
        }
        danceFloor.add(laserGroup); 

        const strobeLight = new THREE.AmbientLight(0xffffff, 0); scene.add(strobeLight);
        scene.add(new THREE.AmbientLight(0x050510, 2.0)); 

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); if(composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Математика кинематики вращения
        function rotateX(y, z, a) { return { y: y*Math.cos(a) - z*Math.sin(a), z: y*Math.sin(a) + z*Math.cos(a) }; }
        function rotateY(x, z, a) { return { x: x*Math.cos(a) + z*Math.sin(a), z: -x*Math.sin(a) + z*Math.cos(a) }; }
        function rotateZ(x, y, a) { return { x: x*Math.cos(a) - y*Math.sin(a), y: x*Math.sin(a) + y*Math.cos(a) }; }

        const colorObj = new THREE.Color();
        let prevEnergy = 0, smoothedEnergy = 0, vitality = 0;
        let flowBass = 0, flowMid = 0;
        let pulseBass = 0, pulseMid = 0, pulseTreble = 0;
        let beatThreshold = 0.42, beatCooldown = 0;
        
        let t = 0;
        let dancePhase = 0; 
        let currentPos1 = new THREE.Vector3(-15, 0, 0);
        let currentPos2 = new THREE.Vector3(15, 0, 0);

        function animate() {
            requestAnimationFrame(animate); 
            controls.update(); 
            const deltaT = 0.016; 
            t += deltaT;

            if (isPlaying && analyser && dataArray && timeDataArray) {
                analyser.getByteFrequencyData(dataArray); 
                analyser.getByteTimeDomainData(timeDataArray);
                
                let bass = 0, mid = 0, treble = 0, energy = 0;
                const binCount = analyser.frequencyBinCount;
                for(let i=0; i<binCount; i++) {
                    let val = dataArray[i] / 255.0; energy += val; 
                    if(i < 24) bass += val; else if(i < 300) mid += val; else treble += val; 
                }
                bass /= 24; mid /= 276; treble /= (binCount - 300); energy /= binCount;
                
                smoothedEnergy += (energy - smoothedEnergy) * 0.1;
                pulseBass += (bass > pulseBass ? 0.35 : 0.06) * (bass - pulseBass);
                pulseMid += (mid > pulseMid ? 0.35 : 0.06) * (mid - pulseMid);
                pulseTreble += (treble > pulseTreble ? 0.35 : 0.06) * (treble - pulseTreble);

                flowBass += (bass - flowBass) * 0.10; flowMid += (mid - flowMid) * 0.08;
                vitality += (Math.min(1.0, smoothedEnergy * 2.5 + pulseBass * 0.5) - vitality) * 0.05;
                if (beatCooldown > 0) beatCooldown--;
                if (pulseBass > beatThreshold && beatCooldown <= 0) { beatThreshold = Math.min(0.9, pulseBass * 1.25); beatCooldown = 15; }
                beatThreshold = Math.max(0.24, beatThreshold * 0.97);

                // ===============================================
                // ХОРЕОГРАФИЯ (ТРАЕКТОРИЯ ТАНЦА)
                // ===============================================
                dancePhase += deltaT * (0.5 + flowMid * 2.0); // Темп зависит от мелодии
                
                let cx = Math.sin(t * 0.15) * 15 * vitality; // Дрейф центра по сцене
                let cz = Math.cos(t * 0.11) * 15 * vitality;
                
                let danceRadius = 14 - (vitality * 6); // При сильной музыке прижимаются ближе (мин 8)
                danceRadius = Math.max(8, danceRadius);
                
                let waltzX = Math.cos(dancePhase) * danceRadius;
                let waltzZ = Math.sin(dancePhase) * danceRadius;
                
                let target1 = new THREE.Vector3(cx + waltzX, 0, cz + waltzZ);
                let target2 = new THREE.Vector3(cx - waltzX, 0, cz - waltzZ);

                currentPos1.lerp(target1, 0.1);
                currentPos2.lerp(target2, 0.1);

                maleGroup.position.copy(currentPos1);
                femaleGroup.position.copy(currentPos2);

                // ЖЕСТКАЯ ФИКСАЦИЯ ВРАЩЕНИЯ (Никаких переворотов!)
                let dx = currentPos2.x - currentPos1.x;
                let dz = currentPos2.z - currentPos1.z;
                let angleToPartner = Math.atan2(dx, dz); 
                // Они смотрят друг на друга строго по оси Y
                maleGroup.rotation.set(0, angleToPartner, 0); 
                femaleGroup.rotation.set(0, angleToPartner + Math.PI, 0);

                // ===============================================
                // КИНЕМАТИКА И ПЛАСТИКА ТЕЛ
                // ===============================================
                let pCount1 = maleData.count;
                let uvs1 = maleData.uvs; let pos1 = maleData.pos; let col1 = maleData.color;
                
                for(let k=0; k<pCount1; k++) {
                    let u = uvs1[k*3], v = uvs1[k*3+1], type = uvs1[k*3+2];
                    let angle = u * Math.PI * 2;
                    let r=0, nx=0, ny=0, nz=0;
                    
                    let audioIdx = Math.floor((k / pCount1) * (binCount * 0.5));
                    let freqVal = dataArray[audioIdx] / 255.0;
                    let rawWave = (timeDataArray[audioIdx] / 128.0 - 1.0);

                    if(type === 1) { // Голова Мужчины
                        r = 2.4 * Math.sin(v * Math.PI) + (rawWave * pulseBass * 0.5);
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = 14 + v*6;
                    } else if(type === 0) { // Торс Мужчины (Костюм)
                        r = 4.0 + v*2.0 + (Math.pow(Math.cos(angle*2),2)*0.6); // Форма плеч и пиджака
                        r += freqVal * 1.5 * vitality; // Дыхание/вибрация музыки
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = v*14;
                    } else if(type === 2) { // Левая рука (Держит её за руку)
                        r = 1.3 - v*0.3 + (freqVal * 0.4);
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = (v-1)*13; 
                        let rX = rotateX(ny, nz, 1.2 + Math.sin(dancePhase)*0.1); ny = rX.y; nz = rX.z; // Поднята вперед
                        let rZ = rotateZ(nx, ny, 0.4); nx = rZ.x; ny = rZ.y; // Отведена в сторону
                        nx -= 5.5; ny += 13.5; // Крепление к левому плечу
                    } else if(type === 3) { // Правая рука (На её талии)
                        r = 1.3 - v*0.3 + (freqVal * 0.4);
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = (v-1)*13;
                        let rX = rotateX(ny, nz, 0.4); ny = rX.y; nz = rX.z; // Слегка вперед
                        let rZ = rotateZ(nx, ny, -0.3); nx = rZ.x; ny = rZ.y; // Ближе к телу
                        nx += 5.5; ny += 13.5; // Крепление к правому плечу
                    } else if(type === 4) { // Левая нога (Шагает)
                        r = 1.8 - v*0.4;
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = (v-1)*18;
                        let step = Math.sin(dancePhase*2) * 0.6 * vitality; 
                        let rX = rotateX(ny, nz, step); ny = rX.y; nz = rX.z;
                        nx -= 2.2;
                    } else if(type === 5) { // Правая нога (Шагает в противофазе)
                        r = 1.8 - v*0.4;
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = (v-1)*18;
                        let step = Math.cos(dancePhase*2) * 0.6 * vitality;
                        let rX = rotateX(ny, nz, step); ny = rX.y; nz = rX.z;
                        nx += 2.2;
                    }
                    
                    pos1[k*3] += (nx - pos1[k*3]) * 0.2; 
                    pos1[k*3+1] += (ny - pos1[k*3+1]) * 0.2; 
                    pos1[k*3+2] += (nz - pos1[k*3+2]) * 0.2;
                    
                    // Строгие, глубокие мужские цвета (синий/фиолетовый)
                    let hue1 = (220 + pulseBass * 40 + freqVal * 20) % 360;
                    colorObj.setHSL(hue1 / 360, 0.8, 0.2 + freqVal * 0.5);
                    col1[k*3] = colorObj.r; col1[k*3+1] = colorObj.g; col1[k*3+2] = colorObj.b;
                }

                let pCount2 = femaleData.count;
                let uvs2 = femaleData.uvs; let pos2 = femaleData.pos; let col2 = femaleData.color;

                for(let k=0; k<pCount2; k++) {
                    let u = uvs2[k*3], v = uvs2[k*3+1], type = uvs2[k*3+2];
                    let angle = u * Math.PI * 2;
                    let r=0, nx=0, ny=0, nz=0;
                    
                    let audioIdx = Math.floor((k / pCount2) * (binCount * 0.5));
                    let freqVal = dataArray[audioIdx] / 255.0;
                    let rawWave = (timeDataArray[audioIdx] / 128.0 - 1.0);

                    if(type === 1) { // Голова Женщины
                        r = 2.2 * Math.sin(v * Math.PI) + (rawWave * pulseTreble * 0.5);
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = 12.5 + v*5.5;
                    } else if(type === 0) { // Торс Женщины (Изящный)
                        r = 2.8 + Math.sin(v * Math.PI) * 1.5; // Талия и грудь
                        r += freqVal * 1.5 * vitality;
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = v*12.5;
                    } else if(type === 2) { // Левая рука (Лежит на его плече)
                        r = 0.9 - v*0.2 + (freqVal * 0.3);
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = (v-1)*12; 
                        let rX = rotateX(ny, nz, 1.4); ny = rX.y; nz = rX.z; // Поднята высоко
                        let rZ = rotateZ(nx, ny, 0.3); nx = rZ.x; ny = rZ.y;
                        nx -= 4.0; ny += 12; 
                    } else if(type === 3) { // Правая рука (В его руке)
                        r = 0.9 - v*0.2 + (freqVal * 0.3);
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = (v-1)*12;
                        let rX = rotateX(ny, nz, 1.2 + Math.sin(dancePhase)*0.1); ny = rX.y; nz = rX.z; // Вытянута вперед
                        let rZ = rotateZ(nx, ny, -0.4); nx = rZ.x; ny = rZ.y; 
                        nx += 4.0; ny += 12;
                    } else if(type === 6) { // Платье/Юбка
                        // Радиус юбки расширяется книзу и зависит от энергии музыки (mid)
                        let flare = 3.5 + (1-v) * (8.0 + flowMid * 15.0 * vitality);
                        r = flare + (Math.cos(angle * 7) * 0.8 * (1-v)); // Складки ткани
                        nx = Math.cos(angle)*r; nz = Math.sin(angle)*r; ny = (v-1)*18;
                        // Эффект закручивания платья в танце
                        let twist = (1-v) * Math.sin(dancePhase) * 1.5;
                        let rY = rotateY(nx, nz, twist); nx = rY.x; nz = rY.z;
                    }
                    
                    pos2[k*3] += (nx - pos2[k*3]) * 0.2; 
                    pos2[k*3+1] += (ny - pos2[k*3+1]) * 0.2; 
                    pos2[k*3+2] += (nz - pos2[k*3+2]) * 0.2;
                    
                    // Яркие, женственные цвета (красный/золотой/розовый), меняющиеся от всех частот
                    let hue2 = (340 + smoothedEnergy * 150 + freqVal * 40 - t*15) % 360;
                    if(hue2 < 0) hue2 += 360;
                    colorObj.setHSL(hue2 / 360, 1.0, 0.3 + freqVal * 0.6);
                    col2[k*3] = colorObj.r; col2[k*3+1] = colorObj.g; col2[k*3+2] = colorObj.b;
                }
                
                malePoints.geometry.attributes.position.needsUpdate = true; malePoints.geometry.attributes.color.needsUpdate = true;
                maleLines.material.opacity = Math.min(0.6, 0.2 + pulseBass * 0.4);
                
                femalePoints.geometry.attributes.position.needsUpdate = true; femalePoints.geometry.attributes.color.needsUpdate = true;
                femaleLines.material.opacity = Math.min(0.7, 0.2 + flowMid * 0.5);

                if (bloomPass) bloomPass.strength += (0.8 + smoothedEnergy * 1.5 - bloomPass.strength) * 0.1;
                
                // Камера плавно облетает пару, ориентируясь на их центр
                camera.position.x = cx + Math.sin(t * 0.2) * (90 - vitality * 30);
                camera.position.z = cz + Math.cos(t * 0.2) * (90 - vitality * 30);
                camera.position.y = 12 + Math.sin(t * 0.4) * 15;
                camera.lookAt(cx, 5, cz);

                let laserPower = (pulseTreble * 1.3 + pulseBass * 0.8) * (0.3 + vitality * 0.7); 
                laserGroup.children.forEach((l, i) => {
                    l.material.color.setHSL((200 + i * 5) % 360 / 360, 0.95, 0.55);
                    if (laserPower > 0.30) { l.material.opacity += (Math.min(0.7, laserPower * 0.7) - l.material.opacity) * 0.2; l.scale.y += (1 + pulseBass * 2 - l.scale.y) * 0.2; } 
                    else { l.material.opacity *= 0.9; l.scale.y += (1 - l.scale.y) * 0.08; }
                    l.rotation.x = l.userData.basex + Math.sin(t * 0.3 + l.userData.phase) * (0.1 + vitality * 0.3); 
                    l.rotation.y = l.userData.basey + Math.cos(t * 0.3 + l.userData.phase) * (0.1 + vitality * 0.3); 
                });

            } else {
                strobeLight.intensity += (0 - strobeLight.intensity) * 0.1;
                if (bloomPass) bloomPass.strength += (0.3 - bloomPass.strength) * 0.05; 
                
                currentPos1.lerp(new THREE.Vector3(-15, 0, 0), 0.02);
                currentPos2.lerp(new THREE.Vector3(15, 0, 0), 0.02);
                maleGroup.position.copy(currentPos1);
                femaleGroup.position.copy(currentPos2);
                maleGroup.rotation.set(0, Math.PI/2, 0);
                femaleGroup.rotation.set(0, -Math.PI/2, 0);
                
                laserGroup.children.forEach((l) => { l.material.opacity *= 0.85; l.scale.y += (1 - l.scale.y) * 0.08; });
            }
            composer.render();
        }
        animate();
    </script>
