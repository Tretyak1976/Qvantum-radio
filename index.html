<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Quantum Radio 3D - Human Dance Symbiosis</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100dvh; overflow: hidden; 
            background-color: #000000 !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #fff; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; 
        }
        :fullscreen, ::backdrop, :-webkit-full-screen { background-color: #000000 !important; }

        #canvas-container { width: 100vw; height: 100dvh; position: fixed; top: 0; left: 0; z-index: 1; cursor: grab; background-color: #000000; }
        #canvas-container:active { cursor: grabbing; }
        
        #fullscreen-btn-top-left {
            position: fixed; top: 20px; left: 20px; z-index: 15;
            background: rgba(10, 10, 15, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%; width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; color: #fff; cursor: pointer; backdrop-filter: blur(10px);
            transition: all 0.3s; padding: 0; outline: none;
        }
        #fullscreen-btn-top-left:hover { background: rgba(59, 130, 246, 0.4); transform: scale(1.1); }

        #ui-bottom {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 700px; z-index: 10;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #ui-bottom.idle { opacity: 0; transform: translate(-50%, 20px); pointer-events: none; }

        #player-panel {
            width: 100%; background: rgba(10, 10, 15, 0.85); padding: 15px 20px; border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); box-sizing: border-box;
            display: flex; flex-direction: column; gap: 12px;
        }

        #sidebar {
            position: fixed; top: 0; left: 0; width: 350px; height: 100%;
            background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 20; display: flex; flex-direction: column;
            transform: translateX(-100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.7); box-sizing: border-box;
        }
        #sidebar.open { transform: translateX(0); }

        #sidebar-header {
            padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            font-weight: bold; font-size: 1.1rem; color: #3b82f6; letter-spacing: 1px;
        }
        
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; padding: 0; outline: none; transition: color 0.2s; }
        .close-btn:hover { color: #ef4444; }
        #playlist { flex: 1; overflow-y: auto; padding: 10px; transition: opacity 0.3s; }
        
        .track-item { 
            display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; transition: background 0.2s; font-size: 0.9rem; margin-bottom: 4px;
        }
        .track-item:hover { background: rgba(255,255,255,0.05); }
        .track-item.active { background: rgba(59, 130, 246, 0.1); border-color: transparent; font-weight: bold; }
        
        .track-play-icon {
            min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: rgba(255,255,255,0.08); color: #aaa; cursor: pointer;
            margin-right: 15px; font-size: 1.1rem; transition: all 0.2s;
        }
        .track-play-icon:hover { background: rgba(59, 130, 246, 0.3); color: #fff; transform: scale(1.1); }
        .track-item.active .track-play-icon { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .track-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #eee; }
        .fav-btn { font-size: 1.3rem; cursor: pointer; transition: transform 0.2s; padding: 5px; margin-left: 10px; }
        .fav-btn:hover { transform: scale(1.3); }

        #progress-container { display: flex; align-items: center; gap: 10px; width: 100%; font-size: 0.75rem; color: #aaa; font-weight: 600; }
        input[type="range"] { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 10px rgba(59,130,246,0.8); }

        #controls-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }

        select, .btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(59, 130, 246, 0.3);
            color: white; padding: 10px 14px; border-radius: 20px;
            outline: none; cursor: pointer; transition: all 0.3s; font-weight: bold;
            font-size: 0.8rem; text-transform: uppercase;
        }
        select { flex: 1; min-width: 100px; text-overflow: ellipsis; }
        select option { background: #111; color: #fff; }
        
        .btn.icon { display: flex; align-items: center; justify-content: center; min-width: 40px; font-size: 1.1rem; }
        #play-pause-btn { font-size: 1.3rem; min-width: 50px; background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        select:hover, .btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
    </style>
</head>
<body>

    <button id="fullscreen-btn-top-left" title="На весь экран">⛶</button>

    <div id="sidebar">
        <div id="sidebar-header">
            <span>QUANTUM PLAYLIST</span>
            <button id="close-sidebar" class="close-btn" title="Закрыть плейлист">✕</button>
        </div>
        <div id="playlist"><div style="padding: 20px; color: #aaa; text-align: center;">Syncing with Global Core...</div></div>
    </div>

    <div id="ui-bottom">
        <div id="player-panel">
            <div id="progress-container">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0">
                <span id="time-total">0:00</span>
            </div>

            <div id="controls-bar">
                <button id="toggle-sidebar-btn" class="btn icon" title="Открыть плейлист">☰</button>
                <select id="genre-filter"><option value="all">Loading...</option></select>
                
                <label class="btn icon" title="Upload Local Track">
                    ⇧ <input type="file" id="audio-upload" accept="audio/*" style="display:none;">
                </label>
                
                <div style="display: flex; gap: 8px;">
                    <button id="prev-btn" class="btn icon" title="Previous Track">⏮</button>
                    <button id="play-pause-btn" class="btn icon" title="Play/Pause">▶</button>
                    <button id="next-btn" class="btn icon" title="Next Track">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ==========================================
        // UI & AUDIO SETUP (ОБЩЕЕ)
        // ==========================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-mIMwHe0AAz1xQxxmklBJFTkfRxhGDcllBKjYs3J8N77RvbROOlapD7YpiOgoBLQ/exec"; 

        let uiTimeout;
        const uiLayer = document.getElementById('ui-bottom');
        const sidebar = document.getElementById('sidebar');
        const fullscreenBtnTopLeft = document.getElementById('fullscreen-btn-top-left');
        
        function resetUiTimer() {
            uiLayer.classList.remove('idle');
            fullscreenBtnTopLeft.style.opacity = '1'; fullscreenBtnTopLeft.style.pointerEvents = 'auto';
            document.body.style.cursor = 'default'; clearTimeout(uiTimeout);
            uiTimeout = setTimeout(() => { 
                if (isPlaying && !sidebar.classList.contains('open')) { 
                    uiLayer.classList.add('idle'); fullscreenBtnTopLeft.style.opacity = '0';
                    fullscreenBtnTopLeft.style.pointerEvents = 'none'; document.body.style.cursor = 'none'; 
                } 
            }, 3000);
        }
        
        window.addEventListener('mousemove', resetUiTimer);
        window.addEventListener('click', resetUiTimer);
        document.getElementById('toggle-sidebar-btn').onclick = () => { sidebar.classList.add('open'); resetUiTimer(); };
        document.getElementById('close-sidebar').onclick = () => { sidebar.classList.remove('open'); resetUiTimer(); };
        fullscreenBtnTopLeft.onclick = () => {
            let docEl = document.documentElement;
            if (!document.fullscreenElement) { if (docEl.requestFullscreen) docEl.requestFullscreen().catch(e=>{}); } 
            else { if (document.exitFullscreen) document.exitFullscreen(); }
            resetUiTimer();
        };

        let audioContext, analyser, dataArray, timeDataArray;
        let audioElement = new Audio(); audioElement.crossOrigin = "anonymous"; 
        
        let isPlaying = false, isPreloadingNext = false, isLoadingTrack = false, loadingTimer = null, countdownValue = 10;
        let fullPlaylist = [], currentPlaylist = [], currentPlayingTrack = null;
        const audioCache = {}; let favorites = JSON.parse(localStorage.getItem('quantum_favorites')) || [];

        function initAudio() {
            if (audioContext) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.85; 
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser); analyser.connect(audioContext.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount); timeDataArray = new Uint8Array(analyser.fftSize);
        }

        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        function formatTime(s) { if (isNaN(s)) return "0:00"; let m = Math.floor(s/60); let sec = Math.floor(s%60).toString().padStart(2, '0'); return `${m}:${sec}`; }

        audioElement.addEventListener('timeupdate', () => {
            if (audioElement.duration) {
                progressBar.max = audioElement.duration; progressBar.value = audioElement.currentTime;
                timeCurrent.innerText = formatTime(audioElement.currentTime); timeTotal.innerText = formatTime(audioElement.duration);
            }
        });

        progressBar.addEventListener('input', () => { if(audioElement.duration) audioElement.currentTime = progressBar.value; resetUiTimer(); });

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(APPS_SCRIPT_URL); const data = await response.json();
                fullPlaylist = data; currentPlaylist = [...fullPlaylist];
                const genres = [...new Set(fullPlaylist.map(t => t.genre).filter(Boolean))];
                const filterSelect = document.getElementById('genre-filter');
                filterSelect.innerHTML = '<option value="all">ALL GENRES</option><option value="favorites">❤ FAVORITES</option>';
                genres.forEach(g => { const opt = document.createElement('option'); opt.value = g; opt.innerText = g.toUpperCase(); filterSelect.appendChild(opt); });
                updatePlaylistUI();
                if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]);
            } catch (err) {
                document.getElementById('playlist').innerHTML = '<div style="color:#ef4444; padding:20px; text-align:center;">Database connection failed.</div>';
            }
        });

        const playBtn = document.getElementById('play-pause-btn');

        function playNext() {
            if (isLoadingTrack || !currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            playTrack(currentPlaylist[(idx + 1) % currentPlaylist.length]);
        }
        function playPrev() {
            if (isLoadingTrack || !currentPlayingTrack || currentPlaylist.length === 0) return;
            let idx = currentPlaylist.findIndex(t => t.url === currentPlayingTrack.url);
            playTrack(currentPlaylist[(idx - 1 + currentPlaylist.length) % currentPlaylist.length]);
        }

        document.getElementById('next-btn').onclick = () => { playNext(); resetUiTimer(); };
        document.getElementById('prev-btn').onclick = () => { playPrev(); resetUiTimer(); };
        audioElement.addEventListener('ended', playNext);

        async function playTrack(track) {
            if (isLoadingTrack) return; 
            currentPlayingTrack = track; initAudio(); 
            if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            
            seedTrackEvolution1(); // Инициализация 1-й фигуры (Мужской)
            seedTrackEvolution2(); // Инициализация 2-й фигуры (Женской)

            isLoadingTrack = true; countdownValue = 10;
            playBtn.innerHTML = `<span style="color:#ef4444;">${countdownValue}</span>`; updatePlaylistUI(); 
            
            clearInterval(loadingTimer);
            loadingTimer = setInterval(() => {
                if (countdownValue > 1) { countdownValue--; playBtn.innerHTML = `<span style="color:#ef4444;">${countdownValue}</span>`; updatePlaylistUI(); }
            }, 1000);
            
            try {
                if (!track.isLocal && track.url.includes("script.google.com")) {
                     if (audioCache[track.url]) { audioElement.src = audioCache[track.url]; } 
                     else {
                         const response = await fetch(track.url); const data = await response.json();
                         if (data.error || !data.base64) throw new Error("Load error");
                         audioElement.src = data.base64; audioCache[track.url] = data.base64; 
                     }
                } else { audioElement.src = track.url; }

                clearInterval(loadingTimer); isLoadingTrack = false;

                let playPromise = audioElement.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => { isPlaying = true; playBtn.innerText = "❚❚"; updatePlaylistUI(); resetUiTimer(); }).catch(error => {
                        isPlaying = false; playBtn.innerText = "▶"; updatePlaylistUI();
                    });
                }
            } catch (error) { clearInterval(loadingTimer); isLoadingTrack = false; playBtn.innerText = "⚠"; setTimeout(() => playNext(), 2000); }
        }

        function updatePlaylistUI() {
            const playlistDiv = document.getElementById('playlist'); playlistDiv.innerHTML = '';
            if (isLoadingTrack) { playlistDiv.style.pointerEvents = 'none'; playlistDiv.style.opacity = '0.7'; } 
            else { playlistDiv.style.pointerEvents = 'auto'; playlistDiv.style.opacity = '1'; }
            
            currentPlaylist.forEach((track) => {
                const trackEl = document.createElement('div'); trackEl.className = 'track-item';
                const isActive = (currentPlayingTrack && currentPlayingTrack.url === track.url);
                if (isActive) trackEl.classList.add('active');
                
                const playIconBtn = document.createElement('div'); playIconBtn.className = 'track-play-icon';
                if (isActive && isLoadingTrack) playIconBtn.innerHTML = `<span style="font-size:1.1rem; color:#ef4444; font-weight:bold;">${countdownValue}</span>`;
                else playIconBtn.innerHTML = (isActive && isPlaying) ? '❚❚' : '▶';

                playIconBtn.onclick = (e) => { e.stopPropagation(); if (isLoadingTrack) return; 
                    if (isActive) { if (isPlaying) { audioElement.pause(); isPlaying = false; } else { audioElement.play(); isPlaying = true; } updatePlaylistUI(); playBtn.innerText = isPlaying ? "❚❚" : "▶"; } 
                    else { playTrack(track); } resetUiTimer(); 
                };
                
                const titleSpan = document.createElement('span'); titleSpan.className = 'track-title'; titleSpan.innerHTML = track.name; 
                trackEl.appendChild(playIconBtn); trackEl.appendChild(titleSpan); playlistDiv.appendChild(trackEl);
            });
        }

        playBtn.onclick = async () => {
            if (isLoadingTrack) return; initAudio();
            if(audioContext.state === 'suspended') await audioContext.resume().catch(e=>{});
            if (isPlaying) { audioElement.pause(); isPlaying = false; playBtn.innerText = "▶"; } 
            else { if (!audioElement.src || audioElement.src.endsWith(window.location.host + "/")) { if (currentPlaylist.length > 0) playTrack(currentPlaylist[0]); } else { await audioElement.play(); isPlaying = true; playBtn.innerText = "❚❚"; } }
            updatePlaylistUI(); resetUiTimer();
        };

        // ==========================================
        // 3D СЦЕНА И ТАНЕЦ ФИГУР (DANCE CHOREOGRAPHY)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020205, 0.002);

        const baseFov = 55;
        const camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 15, 80); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05; controls.minDistance = 20; controls.maxDistance = 200;

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.85);
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene); composer.addPass(bloomPass);

        // Функция для создания отдельной сетки фигуры
        const gridDim = 48; const pCount = gridDim * gridDim;
        function createFigureGrid() {
            const pOrig = new Float32Array(pCount * 3); 
            const pPos = new Float32Array(pCount * 3); 
            const pColor = new Float32Array(pCount * 3); 
            const lineIndices = [];
            for(let i=0; i<gridDim; i++){
                for(let j=0; j<gridDim; j++){
                    let idx = i*gridDim + j;
                    if (j < gridDim - 1) lineIndices.push(idx, idx + 1);
                    if (i < gridDim - 1) lineIndices.push(idx, idx + gridDim);
                    let u = (j / (gridDim - 1)) * Math.PI * 2; let v = (i / (gridDim - 1)) * Math.PI; let r = 10.3; 
                    pOrig[idx*3] = r * Math.cos(u) * Math.sin(v); pOrig[idx*3+1] = r * Math.cos(v); pOrig[idx*3+2] = r * Math.sin(u) * Math.sin(v);
                    pPos[idx*3] = pOrig[idx*3]; pPos[idx*3+1] = pOrig[idx*3+1]; pPos[idx*3+2] = pOrig[idx*3+2];
                }
            }
            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3)); 
            pGeo.setAttribute('color', new THREE.BufferAttribute(pColor, 3)); 
            pGeo.setIndex(lineIndices);
            return { geo: pGeo, orig: pOrig, pos: pPos, color: pColor };
        }

        // --- Группа Танцпола ---
        const danceFloor = new THREE.Group();
        scene.add(danceFloor);

        // Фигура 1 (Из файла 12 - Скелетная/Био)
        const fig1Data = createFigureGrid();
        const fig1Group = new THREE.Group();
        const pCanvas1 = document.createElement('canvas'); pCanvas1.width = 32; pCanvas1.height = 32; 
        const pCtx1 = pCanvas1.getContext('2d'); const pGrad1 = pCtx1.createRadialGradient(16, 16, 0, 16, 16, 16);
        pGrad1.addColorStop(0, 'rgba(255,255,255,1)'); pGrad1.addColorStop(0.3, 'rgba(255,255,255,0.85)'); pGrad1.addColorStop(1, 'rgba(0,0,0,0)'); 
        pCtx1.fillStyle = pGrad1; pCtx1.fillRect(0,0,32,32);
        const points1 = new THREE.Points(fig1Data.geo, new THREE.PointsMaterial({ size: 1.6, map: new THREE.CanvasTexture(pCanvas1), vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        const lines1 = new THREE.LineSegments(fig1Data.geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
        fig1Group.add(points1); fig1Group.add(lines1);
        fig1Group.position.x = -22.5; // Изначально разнесены далеко друг от друга
        danceFloor.add(fig1Group);

        // Фигура 2 (Из файла 6 - Энергетическая/Математическая)
        const fig2Data = createFigureGrid();
        const fig2Group = new THREE.Group();
        const pCanvas2 = document.createElement('canvas'); pCanvas2.width = 16; pCanvas2.height = 16; 
        const pCtx2 = pCanvas2.getContext('2d'); const pGrad2 = pCtx2.createRadialGradient(8, 8, 0, 8, 8, 8);
        pGrad2.addColorStop(0, 'rgba(255,255,255,1)'); pGrad2.addColorStop(0.2, 'rgba(255,255,255,0.8)'); pGrad2.addColorStop(1, 'rgba(0,0,0,0)'); 
        pCtx2.fillStyle = pGrad2; pCtx2.fillRect(0,0,16,16);
        const points2 = new THREE.Points(fig2Data.geo, new THREE.PointsMaterial({ size: 1.4, map: new THREE.CanvasTexture(pCanvas2), vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        const lines2 = new THREE.LineSegments(fig2Data.geo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.40, blending: THREE.AdditiveBlending, depthWrite: false }));
        fig2Group.add(points2); fig2Group.add(lines2);
        fig2Group.position.x = 22.5; 
        danceFloor.add(fig2Group);

        // --- Общие эффекты ---
        const laserGroup = new THREE.Group(); const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending });
        for(let i=0; i<60; i++) {
            const laser = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 10, 0), new THREE.Vector3(0, 250, 0)]), laserMat.clone());
            const phi = Math.acos(-1 + (2 * i) / 60); const theta = Math.sqrt(60 * Math.PI) * phi;
            laser.rotation.set(phi, theta, 0); 
            laser.userData = { phase: Math.random() * Math.PI * 2, speed: 0.015 + Math.random() * 0.02, basex: phi, basey: theta };
            laserGroup.add(laser);
        }
        danceFloor.add(laserGroup); // Лазеры идут из центра танцпола

        const strobeLight = new THREE.AmbientLight(0xffffff, 0); scene.add(strobeLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0); sunLight.position.set(50, 20, 30); scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0x0a0a1a, 2.5)); 

        window.addEventListener('resize', () => { 
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); 
            renderer.setSize(window.innerWidth, window.innerHeight); if(composer) composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Переменные Фигуры 1 ---
        const PHI = 1.618033988749895; const SQRT2 = 1.414213562373095; const SQRT3 = 1.732050807568877;
        let dna = { baseScale: 13.0, symmetryA: 3, symmetryB: 5, knotP: 2, knotQ: 3, twistDir: 1, hueBase: 190, hueRange: 140, morphSpeed: 0.9, bioPulseRate: 1.1 };
        let phaseAlpha = 0, phaseBeta = 0, phaseGamma = 0, waltzPhase = 0, audioMapOffset = 0;

        function seedTrackEvolution1() {
            dna.baseScale = 9.0 + Math.random() * 3.0; // Немного уменьшили масштаб, так как вытянули по Y
            dna.symmetryA = Math.floor(2 + Math.random() * 6);
            dna.twistDir = Math.random() > 0.5 ? 1 : -1;
            dna.hueBase = Math.random() * 360;
        }

        // --- Переменные Фигуры 2 ---
        let trackSeedR = 1.0, trackSeedFreqU = 2.0, trackSeedFreqV = 3.0, trackSeedMorph = 1.0, trackSeedHueShift = 0, trackSeedTwistSpeed = 1.0;
        let currentBassLevel = 0, evolveBass = 0, evolveMid = 0, evolveTreble = 0;

        function seedTrackEvolution2() {
            trackSeedR = 9 + Math.random() * 6; // Немного уменьшили масштаб, так как вытянули по Y
            trackSeedFreqU = 1.0 + Math.random() * 6.0;
            trackSeedFreqV = 1.0 + Math.random() * 6.0;
            trackSeedMorph = 0.5 + Math.random() * 1.5;
            trackSeedHueShift = (dna.hueBase + 180) % 360; 
            trackSeedTwistSpeed = 0.5 + Math.random() * 2.0;
        }

        const colorObj = new THREE.Color();
        let prevEnergy = 0, smoothedEnergy = 0, smoothedCentroid = 0.5, vitality = 0;
        let flowBass = 0, flowLowMid = 0, flowMid = 0, flowTreble = 0;
        let pulseBass = 0, pulseMid = 0, pulseTreble = 0;
        let beatThreshold = 0.42, beatCooldown = 0;

        // --- Главный цикл анимации ---
        function animate() {
            requestAnimationFrame(animate); 
            controls.update(); 
            const t = Date.now() * 0.001;
            if (beatCooldown > 0) beatCooldown--;

            if (isPlaying && analyser && dataArray && timeDataArray) {
                analyser.getByteFrequencyData(dataArray); 
                analyser.getByteTimeDomainData(timeDataArray);
                
                let bass = 0, lowMid = 0, mid = 0, treble = 0, energy = 0, centroid = 0, weightSum = 0;
                const binCount = analyser.frequencyBinCount;
                for(let i=0; i<binCount; i++) {
                    let val = dataArray[i] / 255.0; energy += val; centroid += val * i; weightSum += val;
                    if(i < 24) bass += val; else if(i < 120) lowMid += val; else if(i < 400) mid += val; else treble += val; 
                }
                bass /= 24; lowMid /= 96; mid /= 280; treble /= (binCount - 400); 
                energy /= binCount; if(weightSum > 0) centroid /= weightSum;
                
                smoothedCentroid += ((centroid / binCount) - smoothedCentroid) * 0.05;
                smoothedEnergy   += (energy - smoothedEnergy) * 0.07;
                let energyFlux = Math.max(0, energy - prevEnergy); prevEnergy = energy;

                const rawSharpBass = Math.pow(bass, 1.8); const rawSharpMid = Math.pow(mid, 1.6); const rawSharpTreble = Math.pow(treble, 1.5);
                const attack = 0.35, release = 0.06;
                pulseBass += (rawSharpBass > pulseBass ? attack : release) * (rawSharpBass - pulseBass);
                pulseMid += (rawSharpMid > pulseMid ? attack : release) * (rawSharpMid - pulseMid);
                pulseTreble += (rawSharpTreble > pulseTreble ? attack : release) * (rawSharpTreble - pulseTreble);

                flowBass += (bass - flowBass) * 0.10; flowMid += (mid - flowMid) * 0.08;
                let targetVitality = Math.min(1.0, smoothedEnergy * 2.2 + pulseBass * 0.5 + energyFlux * 2.5);
                vitality += (targetVitality - vitality) * 0.04;

                // Переменные для Фигуры 1
                let metabolism = (0.002 + vitality * 0.015) * dna.morphSpeed;
                phaseAlpha += (metabolism + pulseBass * 0.02) * PHI;
                phaseBeta  += (metabolism + pulseMid * 0.018) * SQRT2;
                phaseGamma += (metabolism + pulseTreble * 0.018) * SQRT3;
                waltzPhase += 0.003 + vitality * 0.012; audioMapOffset += 0.0015 + vitality * 0.007;

                // Переменные для Фигуры 2
                currentBassLevel += (Math.pow(bass, 3) - currentBassLevel) * 0.2; 
                evolveBass += (Math.pow(bass, 3) * 0.04 + 0.002) * trackSeedTwistSpeed; 
                evolveMid += (mid * 0.04 + 0.003) * trackSeedTwistSpeed; 
                evolveTreble += (treble * 0.04 + 0.0025);

                beatThreshold = Math.max(0.24, beatThreshold * 0.97); 
                let isBeat = false;
                if (pulseBass > beatThreshold && beatCooldown <= 0) { 
                    isBeat = true; beatThreshold = Math.min(0.9, pulseBass * 1.25); beatCooldown = 15; 
                }

                // ===============================================
                // ХОРЕОГРАФИЯ (Движение и сближение фигур)
                // ===============================================
                // Орбита танцпола меняет направление, реагируя на средние частоты (мелодию)
                let orbitDirection = Math.sin(t * 0.3 + flowMid * 2.0); 
                danceFloor.rotation.y += orbitDirection * 0.02 + pulseBass * 0.04 * Math.sign(orbitDirection);
                danceFloor.rotation.z = Math.cos(t * 0.4) * 0.15 * vitality; // Плавные наклоны танцпола

                // Фигуры крутятся вокруг своей оси в разных направлениях
                fig1Group.rotation.y += 0.015 + pulseBass * 0.03;
                fig2Group.rotation.y -= 0.015 + pulseBass * 0.03;

                // Сближение ТОЛЬКО на сильных пиках (возводим бас в степень, чтобы отсечь слабые удары)
                let peakPower = Math.pow(pulseBass, 3.5); 
                let baseDistance = 45; // Разносим фигуры далеко друг от друга
                let currentDistance = baseDistance - (peakPower * 32.0); // Резкий рывок друг к другу на пике

                fig1Group.position.x += (-currentDistance/2 - fig1Group.position.x) * 0.08;
                fig2Group.position.x += (currentDistance/2 - fig2Group.position.x) * 0.08;

                // ===============================================
                // РЕНДЕР ФИГУР И ЧЕЛОВЕЧЕСКИЙ СИЛУЭТ
                // ===============================================
                const pos1 = points1.geometry.attributes.position.array; 
                const col1 = points1.geometry.attributes.color.array;
                
                const pos2 = points2.geometry.attributes.position.array; 
                const col2 = points2.geometry.attributes.color.array;

                let waveV = dna.symmetryB + Math.cos(phaseBeta * 0.12) * 2.0;
                let bioBreath = 1.0 + Math.sin(waltzPhase * dna.bioPulseRate) * 0.1 + pulseBass * 0.2;
                
                let fU2 = trackSeedFreqU + Math.sin(evolveMid * 0.1) * 3.0; 
                let chaos2 = Math.sin(evolveTreble * 0.2) * trackSeedMorph;

                // Динамическая симметрия, которая постоянно течет (форма никогда не повторяется)
                let dynamicSymU1 = dna.symmetryA + Math.sin(t * 0.1) * 2.0;
                let dynamicFreqV2 = trackSeedFreqV + Math.cos(t * 0.15) * 3.0;

                for(let i=0; i<gridDim; i++) {
                    let vNorm = i / (gridDim - 1); let v = vNorm * Math.PI; let sinV = Math.sin(v); let cosV = Math.cos(v);
                    
                    // Создаем математический силуэт человека (Голова, торс, ноги)
                    let head = Math.exp(-Math.pow(vNorm - 0.1, 2) * 40); 
                    let torso = Math.exp(-Math.pow(vNorm - 0.45, 2) * 10); 
                    let limbs = Math.exp(-Math.pow(vNorm - 0.85, 2) * 5); 
                    let humanSilhouette = (head * 0.7 + torso * 1.3 + limbs * 1.0) * 0.5 + 0.3;

                    for(let j=0; j<gridDim; j++) {
                        let idx = i * gridDim + j; 
                        let uNorm = j / (gridDim - 1); let u = uNorm * Math.PI * 2;
                        let audioIdx = Math.floor((idx / pCount) * (analyser.frequencyBinCount * 0.4));
                        let rawF = (dataArray[audioIdx] + dataArray[audioIdx+1]) / (2 * 255.0);
                        let fSharp = Math.pow(rawF, 1.7);
                        let tIdx = (idx * 2 + Math.floor(audioMapOffset * 100)) % (analyser.fftSize - 2);
                        let rawWave = (timeDataArray[tIdx] / 128.0 - 1.0);

                        // --- Расчет Фигуры 1 (Мужчина / Био-пластика) ---
                        // Форма постоянно плывет за счет добавления t к углам
                        let rSphere = (dna.baseScale * bioBreath + Math.sin(v * waveV + phaseAlpha + t) * (3.0 + flowMid * 5.0) + Math.cos(u * dynamicSymU1 + phaseBeta) * sinV * (2.0 + pulseBass * 5.0)) * humanSilhouette;
                        let tx1 = rSphere * Math.cos(u + t * 0.2) * sinV; 
                        let tz1 = rSphere * Math.sin(u + t * 0.2) * sinV;
                        // Вытягиваем по вертикали (* 1.8) для имитации роста
                        let ty1 = (rSphere * cosV * 1.8) + Math.sin(u * dynamicSymU1 + phaseBeta) * sinV * (2.0 + pulseTreble * 5.0);
                        
                        let dist1 = Math.sqrt(tx1*tx1 + ty1*ty1 + tz1*tz1) || 1.0;
                        let audioSwell1 = fSharp * (2.5 + vitality * 5.0);
                        let flutter1 = rawWave * (3.0 + pulseTreble * 20.0 * vitality);
                        
                        // Пластичные движения "рук/тела" от музыки
                        tx1 += (tx1 / dist1) * audioSwell1 + Math.cos(v * 20 + waltzPhase) * flutter1;
                        ty1 += (ty1 / dist1) * audioSwell1 + Math.sin(u * 20 + waltzPhase) * flutter1;
                        tz1 += (tz1 / dist1) * audioSwell1 + Math.cos(u * 20 + waltzPhase) * flutter1;

                        let pointLerp1 = 0.05 + fSharp * 0.1 + Math.abs(rawWave) * 0.2;
                        pos1[idx*3] += (tx1 - pos1[idx*3]) * pointLerp1; 
                        pos1[idx*3+1] += (ty1 - pos1[idx*3+1]) * pointLerp1; 
                        pos1[idx*3+2] += (tz1 - pos1[idx*3+2]) * pointLerp1;
                        
                        let hue1 = (dna.hueBase + fSharp * 45 + t * 5) % 360;
                        colorObj.setHSL(hue1 / 360, 0.95, Math.min(0.85, 0.3 + fSharp * 0.6));
                        col1[idx*3] += (colorObj.r - col1[idx*3]) * 0.15; 
                        col1[idx*3+1] += (colorObj.g - col1[idx*3+1]) * 0.15; 
                        col1[idx*3+2] += (colorObj.b - col1[idx*3+2]) * 0.15;

                        // --- Расчет Фигуры 2 (Женщина / Энерго-потоки) ---
                        let R2 = (trackSeedR + pulseBass * 15 + Math.sin(v * dynamicFreqV2 + evolveMid * 0.5) * (4 + mid * 10)) * humanSilhouette;
                        let twist2 = u + Math.sin(v * fU2 + evolveTreble * 0.4 + t) * (Math.sin(evolveBass * 0.3) * 3.0);
                        let flare2 = Math.abs(Math.cos(u * (3 + chaos2 * 2) + t * 0.5)) * (5 + Math.pow(mid,2) * 10);
                        let currentRadius2 = R2 + flare2 * humanSilhouette + fSharp * 12;

                        let tx2 = Math.cos(twist2) * Math.sin(v) * currentRadius2;
                        let tz2 = Math.sin(twist2) * Math.sin(v) * currentRadius2;
                        
                        let yVolume2 = Math.cos(v) * currentRadius2 * (0.65 + chaos2 * 0.35); 
                        let yDrift2 = Math.cos(v * dynamicFreqV2 + t * 0.2) * (8 + chaos2 * 5);
                        // Вытягиваем женский силуэт по вертикали
                        let ty2 = (yVolume2 + yDrift2) * 1.7 + Math.sin(u * fU2 + evolveMid) * (3 + treble * 15);

                        let rippleForce2 = rawWave * (3 + treble * 25); 
                        tx2 += Math.cos(v * 15 + t * 2) * rippleForce2; 
                        ty2 += Math.sin(u * 15 + t * 2) * rippleForce2; 
                        tz2 += Math.cos(u * 15 + t * 2) * rippleForce2;

                        let lerpFactor2 = fSharp > 0.4 ? 0.3 : 0.08; 
                        pos2[idx*3] += (tx2 - pos2[idx*3]) * lerpFactor2; 
                        pos2[idx*3+1] += (ty2 - pos2[idx*3+1]) * lerpFactor2; 
                        pos2[idx*3+2] += (tz2 - pos2[idx*3+2]) * lerpFactor2;
                        
                        let hue2 = (trackSeedHueShift + evolveMid * 40 + rawWave * 30 - t * 5) % 360;
                        if (hue2 < 0) hue2 += 360;
                        colorObj.setHSL(hue2 / 360, 1.0, 0.3 + fSharp * 0.7); // Сделали ярче
                        col2[idx*3] += (colorObj.r - col2[idx*3]) * lerpFactor2; 
                        col2[idx*3+1] += (colorObj.g - col2[idx*3+1]) * lerpFactor2; 
                        col2[idx*3+2] += (colorObj.b - col2[idx*3+2]) * lerpFactor2;
                    }
                }
                
                points1.geometry.attributes.position.needsUpdate = true; points1.geometry.attributes.color.needsUpdate = true;
                lines1.material.opacity += (Math.min(0.65, 0.2 + vitality * 0.35) - lines1.material.opacity) * 0.08;
                
                points2.geometry.attributes.position.needsUpdate = true; points2.geometry.attributes.color.needsUpdate = true;
                lines2.material.opacity += (Math.min(0.8, energy * 1.5) - lines2.material.opacity) * 0.08;

                // --- Камера и эффекты ---
                if (bloomPass) bloomPass.strength += (0.8 + (energy * 1.0) + (pulseBass * 1.5) - bloomPass.strength) * 0.1;
                let breathFov = Math.sin(waltzPhase) * 2.0;
                let kickFov = -pulseBass * 10;
                camera.fov += ((baseFov + breathFov + kickFov) - camera.fov) * 0.1;
                camera.updateProjectionMatrix();

                let laserPower = (pulseTreble * 1.3 + pulseBass * 0.8) * (0.3 + vitality * 0.7); 
                laserGroup.children.forEach((l, i) => {
                    l.material.color.setHSL((dna.hueBase + i * 5) % 360 / 360, 0.95, 0.55);
                    if (laserPower > 0.30) { l.material.opacity += (Math.min(0.7, laserPower * 0.7) - l.material.opacity) * 0.2; l.scale.y += (1 + pulseBass * 2 - l.scale.y) * 0.2; } 
                    else { l.material.opacity *= 0.9; l.scale.y += (1 - l.scale.y) * 0.08; }
                    l.rotation.x = l.userData.basex + Math.sin(phaseAlpha * 0.3 + l.userData.phase) * (0.1 + vitality * 0.3); 
                    l.rotation.y = l.userData.basey + Math.cos(phaseBeta * 0.3 + l.userData.phase) * (0.1 + vitality * 0.3); 
                });

            } else {
                // Плавное затухание и расхождение фигур, если музыка не играет
                strobeLight.intensity += (0 - strobeLight.intensity) * 0.1;
                if (bloomPass) bloomPass.strength += (0.4 - bloomPass.strength) * 0.05; 
                camera.fov += (baseFov - camera.fov) * 0.05; camera.updateProjectionMatrix();
                
                danceFloor.rotation.y += 0.002;
                fig1Group.position.x += (-22.5 - fig1Group.position.x) * 0.05;
                fig2Group.position.x += (22.5 - fig2Group.position.x) * 0.05;
                
                laserGroup.children.forEach((l) => { l.material.opacity *= 0.85; l.scale.y += (1 - l.scale.y) * 0.08; });
            }
            composer.render();
        }
        animate();
    </script>
